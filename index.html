<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Manager // Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.9/locales/th.global.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #121212;
      --surface-2: #1a1a1a;
      --border: #262626;
      --border-light: #333;
      --text: #ffffff;
      --text-dim: #999;
      --text-faint: #666;
      --accent: #ffffff;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      font-family: 'JetBrains Mono', 'SF Mono', Monaco, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Subtle grid background */
    body {
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Blinking cursor */
    .cursor {
      display: inline-block;
      background: var(--text);
      width: 9px;
      height: 1.1em;
      vertical-align: text-bottom;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .card:hover {
      border-color: var(--border-light);
    }

    .card-hover:hover {
      border-color: var(--text);
      transform: translateY(-2px);
    }

    /* Header */
    .mono-header {
      letter-spacing: -0.02em;
    }

    /* Buttons */
    .btn-primary {
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-primary:hover {
      background: #e5e5e5;
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-light);
      transition: all 0.15s;
    }
    .btn-ghost:hover {
      background: var(--surface-2);
      border-color: var(--text);
    }
    .btn-danger {
      background: transparent;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
    }

    /* Input */
    .input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      width: 100%;
      transition: all 0.15s;
    }
    .input:focus {
      border-color: var(--text);
      background: var(--bg);
    }
    .input::placeholder { color: var(--text-faint); }
    select.input option {
      background: var(--surface);
      color: var(--text);
    }

    /* Progress bar */
    .progress-track {
      background: var(--surface-2);
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--text);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-fill-success { background: var(--success); }
    .progress-fill-warning { background: var(--warning); }
    .progress-fill-danger { background: var(--danger); }

    /* Label */
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Status badges */
    .badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border: 1px solid;
      display: inline-block;
    }
    .badge-planning { color: var(--text-dim); border-color: var(--border-light); }
    .badge-active { color: var(--success); border-color: var(--success); }
    .badge-paused { color: var(--warning); border-color: var(--warning); }
    .badge-completed { color: var(--text); border-color: var(--text); }
    .badge-cancelled { color: var(--danger); border-color: var(--danger); }

    /* Tab */
    .tab {
      padding: 10px 18px;
      color: var(--text-faint);
      border-bottom: 2px solid transparent;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text-dim); }
    .tab-active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* FullCalendar theme */
    .fc { font-size: 13px; font-family: inherit; color: var(--text); }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
    .fc-theme-standard .fc-scrollgrid { border-color: var(--border); background: var(--surface); }
    .fc .fc-col-header-cell { background: var(--surface-2); }
    .fc .fc-col-header-cell-cushion { color: var(--text-dim); padding: 12px; font-weight: 600; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
    .fc .fc-daygrid-day-number { color: var(--text); padding: 8px; font-size: 14px; }
    .fc .fc-day-today { background: rgba(255,255,255,0.04) !important; }
    .fc .fc-day-other { opacity: 0.35; }
    .fc .fc-button-primary {
      background: var(--surface-2) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
    }
    .fc .fc-button-primary:hover { background: var(--border) !important; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { 
      background: var(--text) !important; 
      color: var(--bg) !important;
      border-color: var(--text) !important;
    }
    .fc-event { 
      cursor: pointer; 
      border: 1px solid var(--border-light) !important;
      background: var(--surface-2) !important;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 2px;
    }
    .fc-event:hover { border-color: var(--text) !important; }

    /* Modal */
    .modal-backdrop { 
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.8); 
    }

    /* Toast */
    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Pulse dot */
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      position: relative;
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    /* Terminal prompt */
    .prompt::before {
      content: '> ';
      color: var(--text-dim);
    }

    /* Big number */
    .big-num {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    /* Section divider */
    .divider {
      height: 1px;
      background: var(--border);
    }

    /* Funnel connector */
    .funnel-connector { position: relative; }
    @media (min-width: 768px) {
      .funnel-connector:not(:last-child)::after {
        content: '→';
        position: absolute;
        right: -18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-faint);
        font-size: 20px;
        z-index: 2;
      }
    }

    /* Hover arrow */
    .hover-arrow {
      position: relative;
    }
    .hover-arrow::after {
      content: '→';
      margin-left: 4px;
      opacity: 0;
      transition: all 0.15s;
    }
    .hover-arrow:hover::after {
      opacity: 1;
      margin-left: 8px;
    }

    /* Top border accent */
    .top-accent {
      border-top: 2px solid var(--text);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyALhqvQGSPR2OtWG4-yuAeBVeo103mLHeE",
      authDomain: "mkt-project-f818a.firebaseapp.com",
      projectId: "mkt-project-f818a",
      storageBucket: "mkt-project-f818a.firebasestorage.app",
      messagingSenderId: "1076626422079",
      appId: "1:1076626422079:web:31d3849f6af7ae76213b8a",
      measurementId: "G-LQFMH7X9WH"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const parseDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal.toDate && typeof dateVal.toDate === 'function') return dateVal.toDate();
      if (dateVal.seconds) return new Date(dateVal.seconds * 1000);
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? null : d;
    };

    const FirebaseService = {
      subscribeProjects(callback) {
        return db.collection('projects').orderBy('startDate', 'desc').onSnapshot((snapshot) => {
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ id: doc.id, ...data, startDate: parseDate(data.startDate), endDate: parseDate(data.endDate) });
          });
          callback(projects);
        }, (error) => console.error('Subscription error:', error));
      },
      async addProject(projectData) {
        const docRef = await db.collection('projects').add({
          ...projectData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id: docRef.id, ...projectData };
      },
      async updateProject(id, projectData) {
        await db.collection('projects').doc(id).update({
          ...projectData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id, ...projectData };
      },
      async deleteProject(id) {
        await db.collection('projects').doc(id).delete();
      }
    };

    // ═══ LOGIN ═══
    function LoginComponent() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          let msg = 'เกิดข้อผิดพลาด';
          if (err.code === 'auth/user-not-found') msg = 'ไม่พบบัญชี';
          else if (err.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (err.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้แล้ว';
          else if (err.code === 'auth/weak-password') msg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัว';
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            <div className="mb-10 text-center">
              <div className="text-xs tracking-[0.3em] text-white/40 mb-4">// MARKETING TERMINAL v2.0</div>
              <h1 className="text-5xl font-bold mono-header mb-2">ACCESS_</h1>
              <p className="text-white/50 text-sm">ระบบจัดการแคมเปญการตลาด</p>
            </div>

            <div className="card p-8">
              <div className="mb-6 text-xs tracking-widest text-white/40">
                [{isRegister ? 'NEW_USER' : 'LOGIN'}]
              </div>

              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="label block mb-2">Email</label>
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} 
                    className="input" placeholder="user@domain.com" required />
                </div>
                <div>
                  <label className="label block mb-2">Password</label>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} 
                    className="input" placeholder="••••••••" required />
                </div>

                {error && (
                  <div className="p-3 border border-red-500/30 text-red-400 text-sm">
                    [ERROR] {error}
                  </div>
                )}

                <button type="submit" disabled={loading} className="w-full btn-primary py-3 text-sm tracking-widest">
                  {loading ? 'PROCESSING...' : (isRegister ? 'REGISTER' : 'LOGIN')}
                </button>
              </form>

              <div className="mt-6 pt-6 border-t border-white/10 text-center">
                <button onClick={() => { setIsRegister(!isRegister); setError(''); }} 
                  className="text-sm text-white/60 hover:text-white transition hover-arrow">
                  {isRegister ? 'กลับหน้า Login' : 'สร้างบัญชีใหม่'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══ STAT CARD ═══
    function StatCard({ label, value, hint, icon }) {
      return (
        <div className="card card-hover p-6">
          <div className="flex items-start justify-between mb-6">
            <div className="label">{label}</div>
            {icon && <i data-lucide={icon} className="w-4 h-4 text-white/40"></i>}
          </div>
          <div className="big-num mono-header">{value}</div>
          {hint && <div className="mt-3 text-xs text-white/50">{hint}</div>}
        </div>
      );
    }

    // ═══ AUTO FUNNEL ═══
    function AutoFunnel({ data }) {
      const steps = [
        { label: 'INQUIRIES', sub: 'ลูกค้ามุ่งหวัง', value: data.inquiries, num: '01' },
        { label: 'TEST DRIVES', sub: 'ทดลองขับ', value: data.testDrives, num: '02' },
        { label: 'BOOKINGS', sub: 'จองรถ', value: data.bookings, num: '03' },
        { label: 'DELIVERIES', sub: 'ส่งมอบ', value: data.deliveries, num: '04' }
      ];

      const rates = [
        '100.00%',
        data.inquiries > 0 ? ((data.testDrives / data.inquiries) * 100).toFixed(1) + '%' : '0.0%',
        data.inquiries > 0 ? ((data.bookings / data.inquiries) * 100).toFixed(1) + '%' : '0.0%',
        data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) + '%' : '0.0%'
      ];

      const overallRate = data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) : '0.00';

      return (
        <div className="card p-8 fade-in">
          <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
              <div className="text-xs tracking-[0.3em] text-white/40 mb-2">// SALES_FUNNEL</div>
              <h2 className="text-2xl font-bold mono-header">Automotive Pipeline</h2>
              <p className="text-sm text-white/50 mt-1">อัตรา conversion เทียบกับ INQUIRIES เป็นฐาน</p>
            </div>
            <div className="card p-5 top-accent">
              <div className="text-xs tracking-[0.2em] text-white/40 mb-1">OVERALL</div>
              <div className="text-3xl font-bold mono-header">{overallRate}%</div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
            {steps.map((step, idx) => (
              <div key={idx} className="funnel-connector">
                <div className="card-hover card p-5 h-full">
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-xs tracking-widest text-white/30">{step.num}</span>
                    <span className="text-xs tracking-widest text-white/60">{step.label}</span>
                  </div>
                  <div className="big-num mono-header mb-1">{(step.value || 0).toLocaleString()}</div>
                  <div className="text-xs text-white/50 mb-4">{step.sub}</div>
                  <div className="divider mb-3"></div>
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-[10px] tracking-widest text-white/40">RATE</span>
                    <span className="text-sm font-semibold">{rates[idx]}</span>
                  </div>
                  <div className="progress-track">
                    <div className="progress-fill" style={{ width: `${Math.min(parseFloat(rates[idx]), 100)}%` }}></div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ═══ CALENDAR ═══
    function CalendarComponent({ projects }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;
        const events = projects.filter(p => p.startDate && p.endDate).map(p => {
          const startD = parseDate(p.startDate);
          const endD = parseDate(p.endDate);
          const adjustedEnd = new Date(endD);
          adjustedEnd.setDate(adjustedEnd.getDate() + 1);
          return {
            id: p.id, title: p.name,
            start: startD.toISOString().split('T')[0],
            end: adjustedEnd.toISOString().split('T')[0],
            backgroundColor: p.status === 'completed' ? '#ffffff' : p.status === 'active' ? '#999' : p.status === 'paused' ? '#666' : p.status === 'cancelled' ? '#333' : '#555',
            borderColor: 'transparent', textColor: p.status === 'completed' ? '#000' : '#fff'
          };
        });

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth', locale: 'th',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          events: events,
          eventClick: function(info) {
            const p = projects.find(proj => proj.id === info.event.id);
            if (p) {
              const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
              const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
              const inquiries = p.inquiries || 0;
              const testDrives = p.testDrives || 0;
              const bookings = p.bookings || 0;
              const deliveries = p.deliveries || 0;
              const pct = (v) => inquiries > 0 ? ((v / inquiries) * 100).toFixed(2) + '%' : '0.00%';
              alert(`${p.name}\n\n${startStr} - ${endStr}\nหมวดหมู่: ${p.category || '-'}\nสถานะ: ${p.status}\nงบประมาณ: ฿${(p.budget || 0).toLocaleString()}\nใช้ไป: ฿${(p.spent || 0).toLocaleString()}\n\nFunnel:\nInquiries: ${inquiries.toLocaleString()} (100%)\nTest Drives: ${testDrives.toLocaleString()} (${pct(testDrives)})\nBookings: ${bookings.toLocaleString()} (${pct(bookings)})\nDeliveries: ${deliveries.toLocaleString()} (${pct(deliveries)})\n\nOverall: ${pct(deliveries)}\n\n${p.description || '-'}`);
            }
          }
        });
        calendar.render();
        return () => calendar.destroy();
      }, [projects]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          <div className="mt-6 pt-6 border-t border-white/10 flex flex-wrap gap-5 justify-center text-xs">
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-[#999]"></span>Active</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-white"></span>Completed</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-[#666]"></span>Paused</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-[#333]"></span>Cancelled</span>
          </div>
        </div>
      );
    }

    // ═══ MAIN APP ═══
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [dashboardFilter, setDashboardFilter] = useState('all');

      const [formData, setFormData] = useState({
        name: '', description: '', category: 'digital', budget: '', spent: '',
        inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
        status: 'planning', startDate: '', endDate: ''
      });

      const categories = [
        { value: 'digital', label: 'Digital Lead Gen', code: 'DIG' },
        { value: 'motorshow', label: 'Motor Show', code: 'SHOW' },
        { value: 'testdrive', label: 'Test Drive', code: 'DRV' },
        { value: 'dealer', label: 'Dealer / Roadshow', code: 'DLR' },
        { value: 'service', label: 'Service', code: 'SRV' },
        { value: 'crm', label: 'CRM', code: 'CRM' },
        { value: 'other', label: 'Other', code: 'OTH' }
      ];

      const statuses = [
        { value: 'planning', label: 'Planning' },
        { value: 'active', label: 'Active' },
        { value: 'paused', label: 'Paused' },
        { value: 'completed', label: 'Completed' },
        { value: 'cancelled', label: 'Cancelled' }
      ];

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetForm = () => {
        setFormData({
          name: '', description: '', category: 'digital', budget: '', spent: '',
          inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
          status: 'planning', startDate: '', endDate: ''
        });
        setEditingProject(null);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubscribe = FirebaseService.subscribeProjects((data) => {
          setProjects(data);
          setTimeout(() => lucide.createIcons(), 100);
        });
        return () => unsubscribe();
      }, [user]);

      useEffect(() => { lucide.createIcons(); });

      const handleLogout = async () => {
        await auth.signOut();
        showToast('ออกจากระบบเรียบร้อย', 'success');
      };

      const openModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          const sDate = parseDate(project.startDate);
          const eDate = parseDate(project.endDate);
          setFormData({
            name: project.name || '', description: project.description || '', category: project.category || 'digital',
            budget: project.budget || '', spent: project.spent || '', 
            inquiries: project.inquiries || '', testDrives: project.testDrives || '', 
            bookings: project.bookings || '', deliveries: project.deliveries || '', followUps: project.followUps || '',
            status: project.status || 'planning',
            startDate: sDate ? sDate.toISOString().split('T')[0] : '',
            endDate: eDate ? eDate.toISOString().split('T')[0] : ''
          });
        } else { resetForm(); }
        setShowModal(true);
      };

      const saveProject = async () => {
        if (!formData.name || !formData.startDate || !formData.endDate) {
          showToast('กรุณากรอกชื่อและวันที่', 'error');
          return;
        }
        if (new Date(formData.startDate) > new Date(formData.endDate)) {
          showToast('วันที่เริ่มต้นต้องน้อยกว่าวันที่สิ้นสุด', 'error');
          return;
        }

        const dataToSave = {
          name: formData.name, description: formData.description || '', category: formData.category,
          budget: parseInt(formData.budget) || 0, spent: parseInt(formData.spent) || 0,
          inquiries: parseInt(formData.inquiries) || 0, testDrives: parseInt(formData.testDrives) || 0,
          bookings: parseInt(formData.bookings) || 0, deliveries: parseInt(formData.deliveries) || 0,
          followUps: parseInt(formData.followUps) || 0, status: formData.status,
          startDate: new Date(formData.startDate), endDate: new Date(formData.endDate)
        };

        try {
          if (editingProject) await FirebaseService.updateProject(editingProject.id, dataToSave);
          else await FirebaseService.addProject(dataToSave);
          showToast(editingProject ? 'อัปเดตสำเร็จ' : 'สร้างใหม่สำเร็จ', 'success');
          setShowModal(false);
          resetForm();
        } catch (error) {
          showToast('เกิดข้อผิดพลาด', 'error');
        }
      };

      const deleteProject = async (id) => {
        if (!confirm('ต้องการลบแคมเปญนี้?')) return;
        try {
          await FirebaseService.deleteProject(id);
          showToast('ลบเรียบร้อย', 'success');
        } catch (error) {
          showToast('เกิดข้อผิดพลาด', 'error');
        }
      };

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (searchTerm) result = result.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.description?.toLowerCase().includes(searchTerm.toLowerCase()));
        if (filterCategory !== 'all') result = result.filter(p => p.category === filterCategory);
        if (filterStatus !== 'all') result = result.filter(p => p.status === filterStatus);
        return result;
      }, [projects, searchTerm, filterCategory, filterStatus]);

      const dashboardProjects = useMemo(() => {
        if (dashboardFilter === 'all') return projects;
        if (dashboardFilter === 'active') return projects.filter(p => p.status === 'active');
        if (dashboardFilter === 'completed') return projects.filter(p => p.status === 'completed');
        return projects.filter(p => p.category === dashboardFilter);
      }, [projects, dashboardFilter]);

      const metrics = useMemo(() => {
        const total = dashboardProjects.length;
        const active = dashboardProjects.filter(p => p.status === 'active').length;
        const totalBudget = dashboardProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const totalSpent = dashboardProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        const totalInquiries = dashboardProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0);
        const totalTestDrives = dashboardProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0);
        const totalBookings = dashboardProjects.reduce((sum, p) => sum + (p.bookings || 0), 0);
        const totalDeliveries = dashboardProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0);
        const totalFollowUps = dashboardProjects.reduce((sum, p) => sum + (p.followUps || 0), 0);
        const cpl = totalInquiries > 0 ? (totalSpent / totalInquiries).toFixed(0) : 0;
        return { total, active, totalBudget, totalSpent, totalInquiries, totalTestDrives, totalBookings, totalDeliveries, totalFollowUps, cpl };
      }, [dashboardProjects]);

      const categoryBreakdown = useMemo(() => {
        const breakdown = {};
        categories.forEach(cat => {
          const catProjects = projects.filter(p => p.category === cat.value);
          if (catProjects.length > 0) {
            breakdown[cat.value] = {
              ...cat, count: catProjects.length,
              totalBudget: catProjects.reduce((sum, p) => sum + (p.budget || 0), 0),
              totalSpent: catProjects.reduce((sum, p) => sum + (p.spent || 0), 0),
              totalInquiries: catProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0),
              totalTestDrives: catProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0),
              totalBookings: catProjects.reduce((sum, p) => sum + (p.bookings || 0), 0),
              totalDeliveries: catProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0)
            };
          }
        });
        return Object.values(breakdown);
      }, [projects]);

      const getStatusBadge = (status) => {
        const map = {
          planning: 'badge-planning',
          active: 'badge-active',
          paused: 'badge-paused',
          completed: 'badge-completed',
          cancelled: 'badge-cancelled'
        };
        const label = (statuses.find(s => s.value === status) || statuses[0]).label;
        return <span className={`badge ${map[status] || 'badge-planning'}`}>{label.toUpperCase()}</span>;
      };

      const formatDate = (date) => {
        const d = parseDate(date);
        if (!d) return '-';
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl font-bold mb-2">LOADING_<span className="cursor"></span></div>
              <div className="text-sm text-white/40">กำลังเริ่มต้นระบบ</div>
            </div>
          </div>
        );
      }

      if (!user) return <LoginComponent />;

      return (
        <div className="min-h-screen">
          {toast && (
            <div className={`fixed top-5 right-5 z-[100] card toast px-5 py-3 flex items-center gap-2 ${toast.type === 'error' ? 'border-red-500/40' : 'border-white/30'}`}>
              <i data-lucide={toast.type === 'error' ? 'x' : 'check'} className={`w-4 h-4 ${toast.type === 'error' ? 'text-red-400' : 'text-white'}`}></i>
              <span className="text-sm">{toast.message}</span>
            </div>
          )}

          <header className="sticky top-0 z-40 border-b border-white/10 bg-black/80 backdrop-blur">
            <div className="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 bg-white text-black flex items-center justify-center font-bold">
                  M
                </div>
                <div>
                  <div className="font-bold text-lg mono-header">MARKETING_TERMINAL</div>
                  <div className="flex items-center gap-2 text-xs text-white/40">
                    <span className="pulse-dot"></span>
                    <span>{user.email}</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => openModal()} className="btn-primary px-5 py-2.5 text-sm tracking-wider">
                  + NEW
                </button>
                <button onClick={handleLogout} className="btn-ghost px-5 py-2.5 text-sm tracking-wider">
                  LOGOUT
                </button>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-6 py-6">
            {/* TABS */}
            <div className="flex gap-0 mb-8 border-b border-white/10 overflow-x-auto">
              {[
                { id: 'dashboard', label: 'DASHBOARD' },
                { id: 'breakdown', label: 'ANALYTICS' },
                { id: 'projects', label: 'MISSIONS' },
                { id: 'calendar', label: 'TIMELINE' }
              ].map((tab) => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                  className={`tab ${activeTab === tab.id ? 'tab-active' : ''}`}>
                  {tab.label}
                </button>
              ))}
            </div>

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="fade-in space-y-6">
                <div className="card p-4 flex flex-wrap items-center gap-2">
                  <span className="label mr-2">FILTER:</span>
                  <button onClick={() => setDashboardFilter('all')} className={`px-4 py-1.5 text-xs tracking-widest ${dashboardFilter === 'all' ? 'bg-white text-black' : 'text-white/60 hover:text-white'}`}>ALL [{projects.length}]</button>
                  <button onClick={() => setDashboardFilter('active')} className={`px-4 py-1.5 text-xs tracking-widest ${dashboardFilter === 'active' ? 'bg-white text-black' : 'text-white/60 hover:text-white'}`}>ACTIVE [{projects.filter(p => p.status === 'active').length}]</button>
                  {categories.map(cat => {
                    const count = projects.filter(p => p.category === cat.value).length;
                    if (count === 0) return null;
                    return (
                      <button key={cat.value} onClick={() => setDashboardFilter(cat.value)} 
                        className={`px-4 py-1.5 text-xs tracking-widest ${dashboardFilter === cat.value ? 'bg-white text-black' : 'text-white/60 hover:text-white'}`}>
                        [{cat.code}] ({count})
                      </button>
                    );
                  })}
                </div>

                <AutoFunnel data={{ inquiries: metrics.totalInquiries, testDrives: metrics.totalTestDrives, bookings: metrics.totalBookings, deliveries: metrics.totalDeliveries }} />

                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                  <StatCard label="MISSIONS" value={metrics.total} icon="folder" hint={`${metrics.active} active`} />
                  <StatCard label="BUDGET" value={`฿${metrics.totalBudget.toLocaleString()}`} icon="wallet" />
                  <StatCard label="SPENT" value={`฿${metrics.totalSpent.toLocaleString()}`} icon="credit-card" hint={`${metrics.totalBudget > 0 ? ((metrics.totalSpent/metrics.totalBudget)*100).toFixed(0) : 0}% used`} />
                  <StatCard label="COST/LEAD" value={`฿${parseInt(metrics.cpl || 0).toLocaleString()}`} icon="target" hint="per inquiry" />
                  <StatCard label="FOLLOW-UP" value={metrics.totalFollowUps.toLocaleString()} icon="phone" />
                </div>
              </div>
            )}

            {/* BREAKDOWN */}
            {activeTab === 'breakdown' && (
              <div className="fade-in">
                {categoryBreakdown.length === 0 ? (
                  <div className="card p-16 text-center">
                    <div className="text-3xl font-bold mb-2">[ NO DATA ]</div>
                    <div className="text-sm text-white/40">ยังไม่มีข้อมูล</div>
                  </div>
                ) : (
                  <div className="card overflow-hidden">
                    <div className="p-6 border-b border-white/10 flex justify-between items-center">
                      <div>
                        <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// ANALYTICS</div>
                        <h2 className="text-xl font-bold mono-header">Breakdown by Category</h2>
                      </div>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full">
                        <thead>
                          <tr className="border-b border-white/10">
                            <th className="text-left p-4 label">Category</th>
                            <th className="text-right p-4 label">Count</th>
                            <th className="text-right p-4 label">Inq</th>
                            <th className="text-right p-4 label">Test</th>
                            <th className="text-right p-4 label">Book</th>
                            <th className="text-right p-4 label">Delv</th>
                            <th className="text-right p-4 label">Conv%</th>
                            <th className="text-right p-4 label">Budget</th>
                          </tr>
                        </thead>
                        <tbody>
                          {categoryBreakdown.map((cat) => {
                            const conv = cat.totalInquiries > 0 ? ((cat.totalDeliveries / cat.totalInquiries) * 100).toFixed(2) : '0.00';
                            const spentPercent = cat.totalBudget > 0 ? ((cat.totalSpent / cat.totalBudget) * 100).toFixed(0) : 0;
                            return (
                              <tr key={cat.value} className="border-b border-white/5 hover:bg-white/[0.02] transition">
                                <td className="p-4">
                                  <div className="font-semibold">[{cat.code}]</div>
                                  <div className="text-xs text-white/50">{cat.label}</div>
                                </td>
                                <td className="text-right p-4">{cat.count}</td>
                                <td className="text-right p-4">{cat.totalInquiries.toLocaleString()}</td>
                                <td className="text-right p-4">{cat.totalTestDrives.toLocaleString()}</td>
                                <td className="text-right p-4">{cat.totalBookings.toLocaleString()}</td>
                                <td className="text-right p-4 font-bold">{cat.totalDeliveries.toLocaleString()}</td>
                                <td className="text-right p-4">
                                  <span className="badge badge-completed">{conv}%</span>
                                </td>
                                <td className="text-right p-4">
                                  <div className="text-xs text-white/50 mb-1.5">฿{cat.totalSpent.toLocaleString()} / {cat.totalBudget.toLocaleString()}</div>
                                  <div className="progress-track w-28 ml-auto">
                                    <div className={`progress-fill ${spentPercent > 90 ? 'progress-fill-danger' : spentPercent > 70 ? 'progress-fill-warning' : 'progress-fill-success'}`} style={{ width: `${Math.min(spentPercent, 100)}%` }}></div>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                          <tr className="bg-white/[0.03] border-t border-white/20 font-bold">
                            <td className="p-4">[TOTAL]</td>
                            <td className="text-right p-4">{categoryBreakdown.reduce((s, c) => s + c.count, 0)}</td>
                            <td className="text-right p-4">{categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0).toLocaleString()}</td>
                            <td className="text-right p-4">{categoryBreakdown.reduce((s, c) => s + c.totalTestDrives, 0).toLocaleString()}</td>
                            <td className="text-right p-4">{categoryBreakdown.reduce((s, c) => s + c.totalBookings, 0).toLocaleString()}</td>
                            <td className="text-right p-4">{categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0).toLocaleString()}</td>
                            <td className="text-right p-4">
                              {(() => {
                                const v = categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0);
                                const d = categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0);
                                return <span className="badge badge-completed">{v > 0 ? ((d/v)*100).toFixed(2) + '%' : '0.00%'}</span>;
                              })()}
                            </td>
                            <td className="text-right p-4">฿{categoryBreakdown.reduce((s, c) => s + c.totalSpent, 0).toLocaleString()}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* MISSIONS */}
            {activeTab === 'projects' && (
              <div className="fade-in space-y-5">
                <div className="card p-5">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="label block mb-2">Search</label>
                      <input type="text" placeholder="ค้นหา..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">Category</label>
                      <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="input">
                        <option value="all">[ ALL ]</option>
                        {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label block mb-2">Status</label>
                      <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="input">
                        <option value="all">[ ALL ]</option>
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                  {filteredProjects.length === 0 ? (
                    <div className="col-span-full card p-16 text-center">
                      <div className="text-3xl font-bold mb-2">[ NO MATCHES ]</div>
                      <div className="text-sm text-white/40">ไม่พบแคมเปญ</div>
                    </div>
                  ) : (
                    filteredProjects.map(p => {
                      const inquiries = p.inquiries || 0;
                      const testDriveRate = inquiries > 0 ? (((p.testDrives || 0) / inquiries) * 100).toFixed(0) : 0;
                      const bookingRate = inquiries > 0 ? (((p.bookings || 0) / inquiries) * 100).toFixed(0) : 0;
                      const deliveryRate = inquiries > 0 ? (((p.deliveries || 0) / inquiries) * 100).toFixed(0) : 0;
                      const spentPercent = (p.budget || 0) > 0 ? (((p.spent || 0) / (p.budget || 0)) * 100).toFixed(0) : 0;
                      const cat = categories.find(c => c.value === p.category);

                      return (
                        <div key={p.id} className="card card-hover p-6">
                          <div className="flex justify-between items-start mb-4 gap-3">
                            <div className="flex-1 min-w-0">
                              <div className="text-xs tracking-[0.2em] text-white/40 mb-1">[{cat?.code || 'OTH'}]</div>
                              <h4 className="font-bold text-lg mono-header truncate">{p.name}</h4>
                            </div>
                            {getStatusBadge(p.status)}
                          </div>

                          <div className="text-xs text-white/50 mb-5">
                            {formatDate(p.startDate)} → {formatDate(p.endDate)}
                          </div>

                          <div className="grid grid-cols-4 gap-1 mb-5 p-3 bg-white/[0.03] border border-white/10">
                            <div className="text-center">
                              <div className="text-[9px] tracking-widest text-white/40 mb-1">INQ</div>
                              <div className="text-lg font-bold">{inquiries.toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">100%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/40 mb-1">TST</div>
                              <div className="text-lg font-bold">{(p.testDrives || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{testDriveRate}%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/40 mb-1">BK</div>
                              <div className="text-lg font-bold">{(p.bookings || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{bookingRate}%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/40 mb-1">DLV</div>
                              <div className="text-lg font-bold">{(p.deliveries || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{deliveryRate}%</div>
                            </div>
                          </div>

                          <div className="mb-5">
                            <div className="flex justify-between text-[10px] tracking-widest text-white/50 mb-2">
                              <span>BUDGET</span>
                              <span className={spentPercent > 90 ? 'text-red-400' : spentPercent > 70 ? 'text-yellow-400' : 'text-green-400'}>
                                {spentPercent}%
                              </span>
                            </div>
                            <div className="progress-track">
                              <div className={`progress-fill ${spentPercent > 90 ? 'progress-fill-danger' : spentPercent > 70 ? 'progress-fill-warning' : 'progress-fill-success'}`} style={{ width: `${Math.min(spentPercent, 100)}%` }}></div>
                            </div>
                            <div className="text-[11px] text-white/40 mt-1.5 text-right">
                              ฿{(p.spent || 0).toLocaleString()} / {(p.budget || 0).toLocaleString()}
                            </div>
                          </div>

                          <div className="flex gap-2 pt-4 border-t border-white/10">
                            <button onClick={() => openModal(p)} className="flex-1 btn-ghost py-2 text-xs tracking-widest">
                              EDIT
                            </button>
                            <button onClick={() => deleteProject(p.id)} className="flex-1 btn-danger py-2 text-xs tracking-widest">
                              DELETE
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* CALENDAR */}
            {activeTab === 'calendar' && (
              <div className="fade-in card p-6">
                <CalendarComponent projects={projects} />
              </div>
            )}
          </div>

          {/* MODAL */}
          {showModal && (
            <div className="fixed inset-0 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="card max-w-2xl w-full p-8 max-h-[90vh] overflow-y-auto fade-in" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-6 pb-6 border-b border-white/10">
                  <div>
                    <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// {editingProject ? 'EDIT' : 'NEW'}</div>
                    <h2 className="text-2xl font-bold mono-header">{editingProject ? 'Edit Mission' : 'New Mission'}</h2>
                  </div>
                  <button onClick={() => setShowModal(false)} className="btn-ghost w-10 h-10 flex items-center justify-center">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="label block mb-2">Mission Name *</label>
                    <input type="text" placeholder="ชื่อแคมเปญ" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="input" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">Category</label>
                      <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="input">
                        {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label block mb-2">Status *</label>
                      <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="input">
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">Start Date *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">End Date *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="input" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">Budget (THB)</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">Spent (THB)</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="input" />
                    </div>
                  </div>

                  {/* Funnel */}
                  <div className="p-5 border border-white/20 bg-white/[0.02]">
                    <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// FUNNEL</div>
                    <h3 className="font-bold text-lg mb-4">Sales Funnel Data</h3>

                    {(() => {
                      const inq = parseInt(formData.inquiries) || 0;
                      const td = parseInt(formData.testDrives) || 0;
                      const bk = parseInt(formData.bookings) || 0;
                      const dl = parseInt(formData.deliveries) || 0;
                      const pct = (v) => inq > 0 ? ((v / inq) * 100).toFixed(1) + '%' : '0.0%';
                      return (
                        <div className="p-4 bg-black/40 border border-white/10 mb-4">
                          <div className="label mb-3">LIVE PREVIEW</div>
                          <div className="grid grid-cols-4 gap-2 text-center">
                            <div>
                              <div className="text-[9px] tracking-widest text-white/50 mb-1">INQ</div>
                              <div className="text-xl font-bold">{inq}</div>
                              <div className="text-[10px] text-white/40">100%</div>
                            </div>
                            <div className="border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/50 mb-1">TST</div>
                              <div className="text-xl font-bold">{td}</div>
                              <div className="text-[10px] text-white/40">{pct(td)}</div>
                            </div>
                            <div className="border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/50 mb-1">BK</div>
                              <div className="text-xl font-bold">{bk}</div>
                              <div className="text-[10px] text-white/40">{pct(bk)}</div>
                            </div>
                            <div className="border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-white/50 mb-1">DLV</div>
                              <div className="text-xl font-bold">{dl}</div>
                              <div className="text-[10px] text-white/40">{pct(dl)}</div>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      <div>
                        <label className="label block mb-2">Inquiries</label>
                        <input type="number" min="0" placeholder="0" value={formData.inquiries} onChange={(e) => setFormData({...formData, inquiries: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">Test Drives</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">Bookings</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">Deliveries</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">Follow-up</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="input" />
                      </div>
                    </div>

                    <div className="mt-4 p-5 bg-white text-black">
                      <div className="text-xs tracking-[0.2em] text-black/50 mb-1">OVERALL CONVERSION</div>
                      <div className="text-4xl font-bold mono-header">
                        {(Number(formData.inquiries) || 0) > 0 ? (((Number(formData.deliveries) || 0) / (Number(formData.inquiries) || 0)) * 100).toFixed(2) : '0.00'}%
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="label block mb-2">Notes</label>
                    <textarea rows="3" placeholder="รายละเอียดเพิ่มเติม" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="input resize-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-white/10">
                    <button onClick={saveProject} className="flex-1 btn-primary py-3 text-sm tracking-widest">
                      SAVE
                    </button>
                    <button onClick={() => setShowModal(false)} className="btn-ghost px-6 py-3 text-sm tracking-widest">
                      CANCEL
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
