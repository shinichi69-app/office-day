<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pixel Office - Team Workflow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0b0c1a;
      color: #e0e0ff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 860px;
      width: 100%;
      background: #14152b;
      border-radius: 24px;
      padding: 24px 24px 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #3c3f7a inset;
      position: relative;
    }
    h2 {
      text-align: center;
      font-weight: 400;
      letter-spacing: 2px;
      color: #b7b9ff;
      margin-bottom: 4px;
      font-size: 1.7rem;
      text-shadow: 0 0 12px #4e54c880;
    }
    h2 small {
      font-size: 0.85rem;
      color: #8f91c0;
      display: inline-block;
      margin-left: 8px;
    }
    .subtitle {
      text-align: center;
      color: #6f72b0;
      font-size: 0.85rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: #1d1e38;
      image-rendering: pixelated;
      box-shadow: 0 8px 0 #0a0b14, 0 0 0 1px #4a4d8a;
      margin: 12px 0 14px;
      cursor: default;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }
    .controls input {
      flex: 3 1 240px;
      padding: 12px 18px;
      background: #1a1b33;
      border: 1px solid #3c3f7a;
      border-radius: 40px;
      color: #f0f0ff;
      font-family: inherit;
      outline: none;
      transition: 0.2s;
    }
    .controls input:focus {
      border-color: #7b7fd8;
      background: #222349;
      box-shadow: 0 0 0 3px #3c3f7a60;
    }
    .controls input::placeholder {
      color: #5d60a0;
    }
    .controls button {
      flex: 0 1 auto;
      padding: 12px 32px;
      background: #4e54c8;
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 0 #2e317a;
      transform: translateY(0);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2e317a;
    }
    .controls button:hover {
      background: #6b70e0;
    }
    .controls button:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2e317a;
      cursor: not-allowed;
    }
    .status-panel {
      margin-top: 18px;
      background: #111225;
      border-radius: 20px;
      padding: 16px 20px;
      border: 1px solid #343764;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 12px;
    }
    .status-item {
      font-size: 0.85rem;
      padding: 6px 14px 6px 10px;
      border-radius: 40px;
      background: #1a1b33;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border-left: 4px solid #4e54c8;
      flex: 1 1 150px;
      color: #c8caff;
      min-height: 40px;
    }
    .status-item .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #6f72b0;
      transition: 0.3s;
    }
    .status-item .dot.idle { background: #6f72b0; }
    .status-item .dot.walking { background: #f7b85a; box-shadow: 0 0 12px #f7b85a80; }
    .status-item .dot.working { background: #5ac8f7; box-shadow: 0 0 12px #5ac8f780; animation: pulse 0.8s infinite; }
    .status-item .dot.done { background: #5af78e; box-shadow: 0 0 12px #5af78e80; }
    .status-item .role-tag {
      font-size: 0.7rem;
      background: #2a2c52;
      padding: 2px 10px;
      border-radius: 20px;
      color: #a8aae0;
      white-space: nowrap;
    }
    .workflow-log {
      margin-top: 14px;
      background: #0e0f22;
      border-radius: 16px;
      padding: 12px 18px;
      border: 1px solid #2a2c52;
      font-size: 0.8rem;
      color: #a8aae0;
      min-height: 48px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 16px;
    }
    .workflow-log .step {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1b33;
      padding: 4px 14px 4px 10px;
      border-radius: 40px;
      border-left: 3px solid #4e54c8;
    }
    .workflow-log .step .emoji { font-size: 1.1rem; }
    .workflow-log .step .label { color: #b7b9ff; }
    .workflow-log .step .result { color: #5af78e; font-weight: bold; }
    .btn-summary {
      background: #00b894 !important;
      box-shadow: 0 6px 0 #006b5f !important;
      margin-left: auto;
      padding: 8px 20px !important;
      font-size: 0.85rem !important;
    }
    .btn-summary:hover {
      background: #55efc4 !important;
      color: #0b0c1a !important;
    }
    .btn-summary:disabled {
      opacity: 0.4;
      box-shadow: 0 2px 0 #006b5f !important;
      cursor: not-allowed;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    @media (max-width: 600px) {
      .container { padding: 16px; }
      .controls { flex-direction: column; }
      .controls input, .controls button { flex: 1 1 auto; width: 100%; }
      .status-panel { flex-direction: column; }
      .workflow-log { flex-direction: column; align-items: stretch; }
      .btn-summary { margin-left: 0; }
    }
    .footer {
      margin-top: 16px;
      color: #5d60a0;
      font-size: 0.75rem;
      text-align: center;
      border-top: 1px solid #282b50;
      padding-top: 14px;
      letter-spacing: 0.5px;
    }

    /* === FULLSCREEN OVERLAY === */
    .fullscreen-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(11, 12, 26, 0.95);
      backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 40px;
      animation: fadeIn 0.4s ease;
    }
    .fullscreen-overlay.show {
      display: flex;
    }
    .fullscreen-card {
      background: #14152b;
      border-radius: 32px;
      padding: 40px 48px;
      max-width: 720px;
      width: 100%;
      border: 1px solid #4a4d8a;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.4s ease;
    }
    .fullscreen-card h2 {
      font-size: 1.8rem;
      color: #b7b9ff;
      margin-bottom: 8px;
      text-align: center;
    }
    .fullscreen-card .topic-display {
      text-align: center;
      font-size: 1.2rem;
      color: #5af78e;
      background: #1a1b33;
      padding: 10px 20px;
      border-radius: 40px;
      margin-bottom: 24px;
      border: 1px solid #2a2c52;
    }
    .result-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 20px 0 28px;
    }
    .result-item {
      background: #1a1b33;
      border-radius: 16px;
      padding: 16px 20px;
      border-left: 6px solid #4e54c8;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .result-item .icon {
      font-size: 2rem;
      flex-shrink: 0;
      width: 48px;
      text-align: center;
    }
    .result-item .content {
      flex: 1;
    }
    .result-item .agent-name {
      font-weight: bold;
      color: #b7b9ff;
      font-size: 1rem;
    }
    .result-item .agent-role {
      font-size: 0.75rem;
      color: #6f72b0;
      margin-left: 8px;
    }
    .result-item .result-text {
      color: #e0e0ff;
      margin-top: 4px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .result-item .status-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 12px;
      border-radius: 20px;
      background: #2a2c52;
      color: #5af78e;
      margin-top: 4px;
    }
    .fullscreen-card .close-btn {
      width: 100%;
      padding: 14px;
      background: #4e54c8;
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 0 #2e317a;
      margin-top: 8px;
      font-family: inherit;
    }
    .fullscreen-card .close-btn:hover {
      background: #6b70e0;
    }
    .fullscreen-card .close-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #2e317a;
    }
    .fullscreen-card .summary-tag {
      text-align: center;
      font-size: 0.85rem;
      color: #6f72b0;
      margin-bottom: 16px;
      border-top: 1px solid #2a2c52;
      padding-top: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @media (max-width: 600px) {
      .fullscreen-card { padding: 24px 20px; }
      .result-item { flex-direction: column; align-items: center; text-align: center; }
      .result-item .icon { width: auto; }
    }
  </style>
</head>
<body>
<div class="container">
  <h2>🏢 AI Micro‑Office <small>Shinichi HQ</small></h2>
  <div class="subtitle">⚡ Team Workflow — เทรนด์ → คอนเทนต์ → ตรวจสอบ</div>

  <canvas id="officeCanvas" width="820" height="400"></canvas>

  <div class="controls">
    <input type="text" id="userInput" placeholder="ใส่หัวข้อหรือ关键词 เช่น 'เครื่องดื่มเพื่อสุขภาพ' ...">
    <button id="startBtn" onclick="startWorkflow()">🚀 เริ่มเวิร์กโฟลว์</button>
  </div>

  <div class="status-panel">
    <div class="status-item" id="status-kim">
      <span class="dot idle" id="dot-kim"></span>
      <span><span id="statusText-kim">รอเริ่ม</span> <span class="role-tag">🔍 เทรนด์</span></span>
    </div>
    <div class="status-item" id="status-alex">
      <span class="dot idle" id="dot-alex"></span>
      <span><span id="statusText-alex">รอเริ่ม</span> <span class="role-tag">✍️ คอนเทนต์</span></span>
    </div>
    <div class="status-item" id="status-may">
      <span class="dot idle" id="dot-may"></span>
      <span><span id="statusText-may">รอเริ่ม</span> <span class="role-tag">✅ ตรวจสอบ</span></span>
    </div>
  </div>

  <div class="workflow-log" id="workflowLog">
    <span style="color:#5d60a0;">💬 รอการเริ่มเวิร์กโฟลว์...</span>
    <button id="summaryBtn" class="btn-summary" onclick="window.showFullscreenSummary()" style="display:none;">
      📺 ดูผลสรุปแบบเต็มจอ
    </button>
  </div>

  <div class="footer">🧠 AI Agents ทำงานร่วมกันแบบ Pipeline — แต่ละคนมีหน้าที่เฉพาะ</div>
</div>

<!-- === FULLSCREEN OVERLAY === -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
  <div class="fullscreen-card">
    <h2>📊 สรุปผลการทำงาน</h2>
    <div class="topic-display" id="fsTopic">📌 หัวข้อ: -</div>
    <div class="result-grid" id="fsResultGrid"></div>
    <div class="summary-tag" id="fsSummaryTag">✨ ทุกคนทำงานเสร็จสิ้นแล้ว!</div>
    <button class="close-btn" onclick="window.closeFullscreen()">✕ ปิด และให้ทุกคนกลับไปพัก</button>
  </div>
</div>

<script>
  (function(){
    const canvas = document.getElementById('officeCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // ----- AGENTS CONFIG -----
    const agents = [
      {
        id: 'kim', name: 'Kim', role: 'Trend Analyst',
        color: '#e84393', accent: '#ff6eb4',
        x: 60, y: 80,
        restX: 60, restY: 80,
        deskX: 580, deskY: 70,
        targetX: 60, targetY: 80,
        speed: 1.6,
        state: 'IDLE',
        bubbleText: '',
        bubbleTimer: null,
        taskResult: '',
        emoji: '🔍'
      },
      {
        id: 'alex', name: 'Alex', role: 'Content Creator',
        color: '#0984e3', accent: '#6ab0ff',
        x: 60, y: 190,
        restX: 60, restY: 190,
        deskX: 580, deskY: 185,
        targetX: 60, targetY: 190,
        speed: 1.6,
        state: 'IDLE',
        bubbleText: '',
        bubbleTimer: null,
        taskResult: '',
        emoji: '✍️'
      },
      {
        id: 'may', name: 'May', role: 'Quality Checker',
        color: '#00b894', accent: '#55efc4',
        x: 60, y: 300,
        restX: 60, restY: 300,
        deskX: 580, deskY: 300,
        targetX: 60, targetY: 300,
        speed: 1.6,
        state: 'IDLE',
        bubbleText: '',
        bubbleTimer: null,
        taskResult: '',
        emoji: '✅'
      }
    ];

    // DOM refs
    const statusTexts = {};
    const dots = {};
    agents.forEach(a => {
      statusTexts[a.id] = document.getElementById(`statusText-${a.id}`);
      dots[a.id] = document.getElementById(`dot-${a.id}`);
    });
    const logEl = document.getElementById('workflowLog');
    const startBtn = document.getElementById('startBtn');
    const summaryBtn = document.getElementById('summaryBtn');

    // Fullscreen elements
    const overlay = document.getElementById('fullscreenOverlay');
    const fsTopic = document.getElementById('fsTopic');
    const fsResultGrid = document.getElementById('fsResultGrid');
    const fsSummaryTag = document.getElementById('fsSummaryTag');

    let currentTopic = '';
    let workflowDone = false;
    let isReturning = false;

    // ----- Helper functions -----
    function setDot(agent, stateClass) {
      const dot = dots[agent.id];
      if (dot) {
        dot.className = 'dot';
        if (stateClass) dot.classList.add(stateClass);
      }
    }

    function updateStatusUI(agent, text, stateClass) {
      const el = statusTexts[agent.id];
      if (el) el.innerText = text;
      setDot(agent, stateClass);
    }

    function showBubble(agent, text, duration = 2500) {
      agent.bubbleText = text;
      if (agent.bubbleTimer) clearTimeout(agent.bubbleTimer);
      agent.bubbleTimer = setTimeout(() => {
        agent.bubbleText = '';
      }, duration);
    }

    function addLog(html, showSummaryBtn = false) {
      logEl.innerHTML = html;
      if (showSummaryBtn) {
        summaryBtn.style.display = 'inline-flex';
        summaryBtn.disabled = false;
      } else {
        summaryBtn.style.display = 'none';
        summaryBtn.disabled = true;
      }
    }

    // ----- Move agent to target (promise) -----
    function moveAgentTo(agent, targetX, targetY) {
      return new Promise((resolve) => {
        agent.targetX = targetX;
        agent.targetY = targetY;
        const checkInterval = setInterval(() => {
          if (Math.abs(agent.x - targetX) < 1.5 && Math.abs(agent.y - targetY) < 1.5) {
            agent.x = targetX;
            agent.y = targetY;
            clearInterval(checkInterval);
            resolve();
          }
        }, 50);
      });
    }

    // ----- Simulate work with progress -----
    function simulateWork(agent, workText, duration = 1500) {
      return new Promise((resolve) => {
        agent.state = 'WORKING';
        updateStatusUI(agent, workText, 'working');
        showBubble(agent, '⏳ กำลังทำงาน...', duration);
        setTimeout(() => {
          resolve();
        }, duration);
      });
    }

    // ----- SHOW FULLSCREEN SUMMARY -----
    window.showFullscreenSummary = function() {
      console.log('showFullscreenSummary ถูกเรียก!');
      console.log('workflowDone =', workflowDone);
      
      if (!workflowDone) {
        alert('⚠️ ยังไม่มีผลลัพธ์ให้แสดง กรุณาเริ่มเวิร์กโฟลว์ก่อน');
        return;
      }
      
      fsTopic.textContent = `📌 หัวข้อ: "${currentTopic}"`;
      
      const colors = {
        kim: '#e84393',
        alex: '#0984e3',
        may: '#00b894'
      };
      const roles = {
        kim: '🔍 เทรนด์',
        alex: '✍️ คอนเทนต์',
        may: '✅ ตรวจสอบ'
      };
      
      let html = '';
      agents.forEach(agent => {
        const borderColor = colors[agent.id] || '#4e54c8';
        const resultText = agent.taskResult || 'ไม่มีข้อมูล';
        html += `
          <div class="result-item" style="border-left-color: ${borderColor};">
            <div class="icon">${agent.emoji}</div>
            <div class="content">
              <div>
                <span class="agent-name">${agent.name}</span>
                <span class="agent-role">${roles[agent.id]}</span>
              </div>
              <div class="result-text">${resultText}</div>
              <span class="status-badge">✅ เสร็จสิ้น</span>
            </div>
          </div>
        `;
      });
      fsResultGrid.innerHTML = html;
      
      const mayResult = agents[2].taskResult || 'งานเสร็จสมบูรณ์';
      fsSummaryTag.textContent = `📌 สรุปโดย May: ${mayResult}`;
      
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    };

    window.closeFullscreen = function() {
      console.log('closeFullscreen ถูกเรียก');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
      
      if (workflowDone && !isReturning) {
        isReturning = true;
        returnAllToLounge();
      }
    };

    // ----- Return all agents to lounge -----
    async function returnAllToLounge() {
      console.log('returnAllToLounge เริ่มทำงาน');
      for (const agent of agents) {
        updateStatusUI(agent, 'กลับไปพัก...', 'walking');
        showBubble(agent, '🚶 กลับ lounge', 1200);
        await moveAgentTo(agent, agent.restX, agent.restY);
        agent.state = 'IDLE';
        updateStatusUI(agent, 'พร้อมรับงานใหม่', 'idle');
        showBubble(agent, '☕ พร้อม!', 1000);
      }
      isReturning = false;
      startBtn.disabled = false;
      startBtn.textContent = '🚀 เริ่มเวิร์กโฟลว์';
      workflowDone = false;
      summaryBtn.style.display = 'none';
      summaryBtn.disabled = true;
      console.log('returnAllToLounge เสร็จสิ้น');
    }

    // ----- MAIN WORKFLOW -----
    window.startWorkflow = async function() {
      console.log('startWorkflow ถูกเรียก');
      const input = document.getElementById('userInput');
      const topic = input.value.trim();
      if (!topic) {
        addLog(`<span style="color:#f7b85a;">⚠️ กรุณาใส่หัวข้อหรือ关键词ก่อน</span>`);
        return;
      }

      workflowDone = false;
      isReturning = false;
      currentTopic = topic;
      startBtn.disabled = true;
      startBtn.textContent = '⏳ กำลังทำงาน...';
      summaryBtn.style.display = 'none';
      summaryBtn.disabled = true;

      for (const agent of agents) {
        agent.targetX = agent.restX;
        agent.targetY = agent.restY;
        agent.state = 'IDLE';
        agent.taskResult = '';
        updateStatusUI(agent, 'พร้อมทำงาน', 'idle');
        showBubble(agent, '☕ พร้อม!', 1000);
      }

      await new Promise(r => setTimeout(r, 500));

      const kim = agents[0];
      const alex = agents[1];
      const may = agents[2];

      addLog(`<span class="step"><span class="emoji">🔍</span> <span class="label">Kim กำลังวิเคราะห์เทรนด์สำหรับ:</span> <span class="result">"${topic}"</span></span>`);
      
      updateStatusUI(kim, 'เดินไปโต๊ะ...', 'walking');
      showBubble(kim, '🚶 ไปดูเทรนด์', 1500);
      await moveAgentTo(kim, kim.deskX, kim.deskY);
      await simulateWork(kim, '📊 กำลังวิเคราะห์เทรนด์...', 1800);
      
      const trendResults = [
        `📈 เทรนด์ "${topic}" มาแรง! โต 35% ใน 3 เดือน กลุ่มเป้าหมายหลักคือวัยรุ่นและคนทำงาน`,
        `🔥 "${topic}" กำลังเป็นที่นิยมในโซเชียลมีเดีย มียอดพูดถึงเพิ่ม 280%`,
        `📊 ตลาด "${topic}" ขยายตัว 28% ปีนี้ คาดการณ์โตต่อเนื่องใน Q4`,
        `💡 ผู้บริโภคให้ความสนใจ "${topic}" สูงสุดในรอบปี โดยเฉพาะกลุ่ม Gen Z`,
        `🌟 "${topic}" อยู่ใน Top 5 เทรนด์แห่งปี มีการค้นหาสูงสุดในเดือนนี้`
      ];
      const trend = trendResults[Math.floor(Math.random() * trendResults.length)];
      kim.taskResult = trend;
      kim.state = 'IDLE';
      updateStatusUI(kim, `✅ วิเคราะห์เสร็จ`, 'done');
      showBubble(kim, '📊 เทรนด์เสร็จ!', 1500);
      addLog(`<span class="step"><span class="emoji">🔍</span> <span class="label">Kim:</span> <span class="result">${trend.substring(0, 30)}...</span></span>`);

      // STEP 2: Alex
      addLog(`<span class="step"><span class="emoji">✍️</span> <span class="label">Alex กำลังสร้างคอนเทนต์จากเทรนด์...</span></span>`);
      
      updateStatusUI(alex, 'เดินไปโต๊ะ...', 'walking');
      showBubble(alex, '🚶 ไปสร้างคอนเทนต์', 1500);
      await moveAgentTo(alex, alex.deskX, alex.deskY);
      await simulateWork(alex, '✍️ กำลังคิดคอนเทนต์...', 2000);
      
      const contentIdeas = [
        `🎯 แคมเปญ "${topic}" ใช้แนวคิด "สุขภาพดี เริ่มที่ตัวเอง" ร่วมกับ influencer สายสุขภาพ`,
        `📝 คอนเทนต์ "${topic}" แนว How-to พร้อมแชร์เรื่องจริงจากผู้ใช้งานจริง 5 คน`,
        `🎬 ผลิตวิดีโอ "${topic}" สไตล์ vlog สั้น 60 วินาที เน้นภาพสวยและดนตรีประกอบ`,
        `📰 บทความ "${topic}" พร้อม Infographic ดึงดูดสายตา แจกฟรี 5 ไอเดีย`,
        `🎨 ใช้ User-Generated Content ชวนแฟนๆ แชร์ประสบการณ์ "${topic}" พร้อมแฮชแท็ก`
      ];
      const content = contentIdeas[Math.floor(Math.random() * contentIdeas.length)];
      alex.taskResult = content;
      alex.state = 'IDLE';
      updateStatusUI(alex, `✅ สร้างคอนเทนต์เสร็จ`, 'done');
      showBubble(alex, '✍️ คอนเทนต์เสร็จ!', 1500);
      addLog(`<span class="step"><span class="emoji">✍️</span> <span class="label">Alex:</span> <span class="result">${content.substring(0, 30)}...</span></span>`);

      // STEP 3: May
      addLog(`<span class="step"><span class="emoji">✅</span> <span class="label">May กำลังตรวจสอบและสรุปผล...</span></span>`);
      
      updateStatusUI(may, 'เดินไปโต๊ะ...', 'walking');
      showBubble(may, '🚶 ไปตรวจสอบ', 1500);
      await moveAgentTo(may, may.deskX, may.deskY);
      await simulateWork(may, '🔎 กำลังตรวจสอบคุณภาพ...', 1800);
      
      const summaries = [
        `⭐ สรุป: เทรนด์ "${topic}" แรงมาก → คอนเทนต์ที่สร้างตรงกลุ่มเป้าหมาย → พร้อมใช้ได้ทันที!`,
        `✅ ผ่านทุกเกณฑ์! "${topic}" มีศักยภาพสูง ใช้คอนเทนต์ที่สร้างไว้ได้เลย`,
        `📌 แนะนำปรับเล็กน้อย: เพิ่ม hashtag #${topic.replace(/\s/g,'')} และลงช่วงเวลา 20:00 น.`,
        `🏆 คะแนนรวม 92/100 — "${topic}" พร้อม launch แนะนำใช้ช่องทาง TikTok และ IG`,
        `💯 อนุมัติ! "${topic}" ผ่านทุกเกณฑ์ เริ่มผลิตเนื้อหาและวางแผนเผยแพร่ได้`
      ];
      const summary = summaries[Math.floor(Math.random() * summaries.length)];
      may.taskResult = summary;
      may.state = 'IDLE';
      updateStatusUI(may, `✅ ตรวจสอบเสร็จ`, 'done');
      showBubble(may, '✅ ตรวจสอบเสร็จ!', 1500);
      
      workflowDone = true;
      console.log('workflowDone =', workflowDone);
      
      addLog(`
        <span class="step"><span class="emoji">🏁</span> <span class="label">✨ เวิร์กโฟลว์เสร็จสิ้น!</span></span>
        <span class="step"><span class="emoji">📊</span> <span class="label">คลิกปุ่มเพื่อดูผลสรุปแบบเต็มจอ</span></span>
      `, true);
      
      summaryBtn.style.display = 'inline-flex';
      summaryBtn.disabled = false;
      startBtn.textContent = '✅ เสร็จแล้ว (กดปุ่มเขียวเพื่อดูสรุป)';
    };

    // ----- Animation loop -----
    function update() {
      agents.forEach(agent => {
        const dx = agent.targetX - agent.x;
        const dy = agent.targetY - agent.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 0.8) {
          if (agent.state !== 'WALKING' && agent.state !== 'WORKING') {
            agent.state = 'WALKING';
          }
          const step = Math.min(agent.speed, dist);
          agent.x += (dx / dist) * step;
          agent.y += (dy / dist) * step;
        } else {
          agent.x = agent.targetX;
          agent.y = agent.targetY;
        }
      });

      draw();
      requestAnimationFrame(update);
    }

    // ----- Draw -----
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#1a1b33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.strokeStyle = '#2f3160';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < canvas.width; x += 35) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 35) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      ctx.fillStyle = '#1f2145';
      ctx.shadowColor = '#3c3f7a40';
      ctx.shadowBlur = 12;
      ctx.fillRect(20, 30, 110, 340);
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#9b9ed0';
      ctx.font = '10px monospace';
      ctx.fillText('🏖️ LOUNGE', 40, 52);

      agents.forEach(agent => {
        const dx = agent.deskX, dy = agent.deskY;
        ctx.fillStyle = '#3d3f7a';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#2a2c60';
        ctx.fillRect(dx-36, dy-22, 76, 48);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = agent.state === 'WORKING' ? '#55efc4' : '#2d3b6b';
        ctx.fillRect(dx-14, dy-20, 32, 24);
        ctx.fillStyle = '#0b0d1a';
        ctx.fillRect(dx-10, dy-16, 24, 16);
        if (agent.state === 'WORKING') {
          ctx.fillStyle = '#55efc4';
          for (let i=0; i<6; i++) {
            ctx.fillRect(dx-8 + i*4, dy-12 + (i%2)*4, 2, 2);
          }
        }
        ctx.fillStyle = '#2f315a';
        ctx.fillRect(dx-30, dy-6, 16, 32);
        ctx.fillStyle = '#8a8dc0';
        ctx.font = '8px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(agent.emoji + ' ' + agent.name, dx, dy+34);
      });

      agents.forEach(agent => {
        const x = agent.x, y = agent.y;
        ctx.fillStyle = '#0b0c1a80';
        ctx.beginPath();
        ctx.ellipse(x, y+4, 13, 5, 0, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = agent.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = agent.color + '60';
        ctx.fillRect(x-13, y-26, 26, 28);
        ctx.shadowBlur = 0;
        
        ctx.fillStyle = agent.accent || agent.color;
        ctx.fillRect(x-7, y-6, 14, 6);
        
        ctx.fillStyle = agent.color;
        ctx.fillRect(x-9, y-34, 18, 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x-7, y-30, 4, 4);
        ctx.fillRect(x+3, y-30, 4, 4);
        ctx.fillStyle = '#0b0c1a';
        ctx.fillRect(x-6, y-29, 2, 2);
        ctx.fillRect(x+4, y-29, 2, 2);
        ctx.fillStyle = '#0b0c1a';
        ctx.fillRect(x-3, y-22, 6, 2);

        ctx.fillStyle = '#d0d2ff';
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(agent.emoji + ' ' + agent.name, x, y-40);

        if (agent.bubbleText) {
          const txt = agent.bubbleText;
          ctx.font = '9px monospace';
          const tw = ctx.measureText(txt).width;
          const bw = Math.min(140, Math.max(tw + 24, 70));
          const bx = x - bw/2;
          const by = y - 78;
          ctx.fillStyle = '#f0f0ff';
          ctx.shadowBlur = 16;
          ctx.shadowColor = '#00000080';
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, 28, 14);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#4a4d8a';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, 28, 14);
          ctx.stroke();
          ctx.fillStyle = '#15162b';
          ctx.font = '9px monospace';
          ctx.textAlign = 'center';
          const displayText = txt.length > 16 ? txt.substring(0,15)+'…' : txt;
          ctx.fillText(displayText, x, by+19);
        }
      });
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
      };
    }

    // Init
    agents.forEach(a => {
      a.x = a.restX; a.y = a.restY;
      a.targetX = a.restX; a.targetY = a.restY;
      a.state = 'IDLE';
      updateStatusUI(a, 'รอเริ่ม', 'idle');
    });
    update();
    
    console.log('✅ โหลดหน้าเว็บเสร็จแล้ว!');
    console.log('showFullscreenSummary มีอยู่:', typeof window.showFullscreenSummary === 'function');
  })();
</script>
