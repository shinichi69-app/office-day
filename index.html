<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Manager Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- FullCalendar v6 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.9/locales/th.global.min.js"></script>

  <style>
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .stat-card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.08); transition: all 0.25s ease; }
    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    .fc { font-size: 0.85rem; font-family: inherit; }
    .fc-event { cursor: pointer; border-radius: 4px; }
    .modal-backdrop { backdrop-filter: blur(6px); background-color: rgba(15, 23, 42, 0.4); }
    .progress-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .funnel-connector { position: relative; }
    .funnel-connector::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -16px;
      transform: translateY(-50%);
      width: 0; height: 0; 
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 8px solid #cbd5e1;
      z-index: 10;
    }
    @media (max-width: 768px) {
      .funnel-connector::after {
        top: auto; bottom: -16px; right: 50%; transform: translateX(50%);
        border-left: 8px solid transparent; border-right: 8px solid transparent;
        border-top: 8px solid #cbd5e1; border-bottom: none;
      }
    }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ============================================================
    // 🔥 FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyALhqvQGSPR2OtWG4-yuAeBVeo103mLHeE",
      authDomain: "mkt-project-f818a.firebaseapp.com",
      projectId: "mkt-project-f818a",
      storageBucket: "mkt-project-f818a.firebasestorage.app",
      messagingSenderId: "1076626422079",
      appId: "1:1076626422079:web:31d3849f6af7ae76213b8a",
      measurementId: "G-LQFMH7X9WH"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    
    const db = firebase.firestore();
    const auth = firebase.auth();

    const parseDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal.toDate && typeof dateVal.toDate === 'function') return dateVal.toDate();
      if (dateVal.seconds) return new Date(dateVal.seconds * 1000);
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? null : d;
    };

    // ============================================================
    // 📦 FIRESTORE SERVICE
    // ============================================================
    const FirebaseService = {
      subscribeProjects(callback) {
        return db.collection('projects').orderBy('startDate', 'desc').onSnapshot((snapshot) => {
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ 
              id: doc.id, 
              ...data,
              startDate: parseDate(data.startDate),
              endDate: parseDate(data.endDate)
            });
          });
          callback(projects);
        }, (error) => console.error('Subscription error:', error));
      },
      async addProject(projectData) {
        const docRef = await db.collection('projects').add({
          ...projectData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id: docRef.id, ...projectData };
      },
      async updateProject(id, projectData) {
        await db.collection('projects').doc(id).update({
          ...projectData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id, ...projectData };
      },
      async deleteProject(id) {
        await db.collection('projects').doc(id).delete();
      }
    };

    // ============================================================
    // 🔐 LOGIN COMPONENT
    // ============================================================
    function LoginComponent() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          let msg = 'เกิดข้อผิดพลาด';
          if (err.code === 'auth/user-not-found') msg = 'ไม่พบบัญชีผู้ใช้นี้';
          else if (err.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (err.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้งานแล้ว';
          else if (err.code === 'auth/weak-password') msg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <div className="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden fade-in border border-slate-200">
            <div className="p-8">
              <div className="text-center mb-8">
                <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-600 text-white mb-4 shadow-lg shadow-blue-200">
                  <i data-lucide="car" className="w-7 h-7"></i>
                </div>
                <h1 className="text-2xl font-bold text-slate-900 mb-1">Marketing Manager</h1>
                <p className="text-sm text-slate-500">{isRegister ? 'สร้างบัญชีสำหรับทีมการตลาด' : 'เข้าสู่ระบบเพื่อจัดการแคมเปญรถยนต์'}</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wide">อีเมล</label>
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm" placeholder="name@company.com" required />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1.5 uppercase tracking-wide">รหัสผ่าน</label>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm" placeholder="••••••••" required />
                </div>
                {error && <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 flex items-center gap-2"><i data-lucide="alert-circle" className="w-4 h-4"></i>{error}</div>}
                <button type="submit" disabled={loading} className={`w-full py-2.5 rounded-lg font-semibold text-white transition text-sm ${loading ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 shadow-sm hover:shadow'}`}>
                  {loading ? 'กำลังดำเนินการ...' : (isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ')}
                </button>
              </form>
              <div className="mt-6 text-center">
                <button onClick={() => { setIsRegister(!isRegister); setError(''); }} className="text-sm text-blue-600 hover:text-blue-800 font-medium transition">
                  {isRegister ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิก'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 📊 STAT CARD COMPONENT
    // ============================================================
    function StatCard({ title, value, icon, color, bg, subtitle }) {
      return (
        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between stat-card-hover group">
          <div className="flex-1 min-w-0">
            <p className="text-xs font-semibold text-slate-500 uppercase tracking-wide truncate">{title}</p>
            <p className="text-2xl font-bold text-slate-900 mt-1 truncate">{value}</p>
            {subtitle && <p className="text-xs text-slate-500 mt-1 flex items-center gap-1 truncate">{subtitle}</p>}
          </div>
          <div className={`p-3 rounded-xl ${bg} ${color} group-hover:scale-110 transition-transform duration-200`}>
            <i data-lucide={icon} className="w-5 h-5"></i>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🚗 AUTO FUNNEL COMPONENT (แผนผังธุรกิจรถยนต์)
    // ✅ ปรับให้ % ทุกขั้นคำนวณเทียบกับ "ผู้สนใจ (Inquiries)" เป็นฐาน
    // ============================================================
    function AutoFunnel({ data }) {
      const steps = [
        { label: 'ลูกค้ามุ่งหวัง', sub: 'Inquiries', value: data.inquiries, icon: 'users', color: 'from-slate-600 to-slate-700', bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', iconBg: 'bg-slate-100' },
        { label: 'ทดลองขับ', sub: 'Test Drives', value: data.testDrives, icon: 'steering-wheel', color: 'from-blue-500 to-blue-600', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', iconBg: 'bg-blue-100' },
        { label: 'จองรถ', sub: 'Bookings', value: data.bookings, icon: 'calendar-check', color: 'from-amber-500 to-amber-600', bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', iconBg: 'bg-amber-100' },
        { label: 'ส่งมอบรถ', sub: 'Deliveries', value: data.deliveries, icon: 'key', color: 'from-emerald-500 to-emerald-600', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', iconBg: 'bg-emerald-100' }
      ];

      // ✅ คำนวณ % ทุกขั้นเทียบกับ "ผู้สนใจ" เป็นฐาน
      const rates = [
        '100%',
        data.inquiries > 0 ? ((data.testDrives / data.inquiries) * 100).toFixed(1) + '%' : '0%',
        data.inquiries > 0 ? ((data.bookings / data.inquiries) * 100).toFixed(1) + '%' : '0%',
        data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) + '%' : '0%'
      ];

      const overallRate = data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) + '%' : '0%';

      return (
        <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm fade-in">
          <div className="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
            <div>
              <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                <i data-lucide="funnel" className="w-5 h-5 text-blue-600"></i>
                แผนผังการขายรถยนต์ (Automotive Sales Funnel)
              </h3>
              <p className="text-sm text-slate-500 mt-1">อัตราการแปลงทุกขั้นตอนคำนวณเทียบกับ <span className="font-semibold text-slate-700">"ลูกค้ามุ่งหวัง"</span> เป็นฐาน</p>
            </div>
            <div className="bg-blue-50 border border-blue-100 rounded-lg px-4 py-2 flex items-center gap-3">
              <span className="text-xs font-bold text-blue-700 uppercase tracking-wide">Overall Conversion</span>
              <span className="text-xl font-extrabold text-blue-900">{overallRate}</span>
            </div>
          </div>
          
          <div className="flex flex-col md:flex-row items-stretch justify-center gap-0 md:gap-0">
            {steps.map((step, idx) => (
              <React.Fragment key={idx}>
                <div className={`flex-1 relative funnel-connector ${idx < steps.length - 1 ? 'md:pr-2' : ''}`}>
                  <div className={`relative overflow-hidden rounded-xl border ${step.border} ${step.bg} p-4 transition-all duration-300 hover:shadow-md hover:-translate-y-1 h-full`}>
                    <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${step.color}`}></div>
                    <div className="flex items-center gap-2 mb-3">
                      <div className={`p-1.5 rounded-lg ${step.iconBg} ${step.text}`}>
                        <i data-lucide={step.icon} className="w-4 h-4"></i>
                      </div>
                      <div>
                        <span className={`text-xs font-bold uppercase tracking-wide block ${step.text}`}>{step.label}</span>
                        <span className="text-[10px] text-slate-500 font-medium">{step.sub}</span>
                      </div>
                    </div>
                    <div className="text-2xl font-extrabold text-slate-900 tracking-tight">
                      {(step.value || 0).toLocaleString()} <span className="text-sm font-normal text-slate-500">คน/คัน</span>
                    </div>
                    <div className="mt-3 pt-3 border-t border-slate-200/60">
                      <div className="flex justify-between items-center">
                        <span className="text-[11px] font-medium text-slate-500">% ของลูกค้ามุ่งหวัง</span>
                        <span className={`text-sm font-bold ${step.text}`}>{rates[idx]}</span>
                      </div>
                      <div className="w-full bg-slate-200/60 rounded-full h-1.5 mt-1.5 overflow-hidden">
                        <div className={`h-full bg-gradient-to-r ${step.color} progress-bar`} style={{ width: `${Math.min(parseFloat(rates[idx]), 100)}%` }}></div>
                      </div>
                    </div>
                  </div>
                </div>
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // 📅 CALENDAR COMPONENT
    // ============================================================
    function CalendarComponent({ projects }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;
        const events = projects.filter(p => p.startDate && p.endDate).map(p => {
          const startD = parseDate(p.startDate);
          const endD = parseDate(p.endDate);
          const adjustedEnd = new Date(endD);
          adjustedEnd.setDate(adjustedEnd.getDate() + 1);
          return {
            id: p.id, title: p.name,
            start: startD.toISOString().split('T')[0],
            end: adjustedEnd.toISOString().split('T')[0],
            backgroundColor: p.status === 'completed' ? '#3b82f6' : p.status === 'active' ? '#10b981' : p.status === 'paused' ? '#f59e0b' : p.status === 'cancelled' ? '#ef4444' : '#94a3b8',
            borderColor: 'transparent', textColor: '#ffffff'
          };
        });

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth', locale: 'th',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          events: events,
          eventClick: function(info) {
            const p = projects.find(proj => proj.id === info.event.id);
            if (p) {
              const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
              const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
              const inquiries = p.inquiries || 0;
              const testDrives = p.testDrives || 0;
              const bookings = p.bookings || 0;
              const deliveries = p.deliveries || 0;
              const pct = (v) => inquiries > 0 ? ((v / inquiries) * 100).toFixed(2) + '%' : '0.00%';
              alert(`🚗 ${p.name}\n\n📅 ${startStr} - ${endStr}\n📂 หมวดหมู่: ${p.category || 'ไม่ระบุ'}\n📊 สถานะ: ${p.status || 'planning'}\n💰 งบประมาณ: ${(p.budget || 0).toLocaleString()} บาท\n💸 ใช้ไป: ${(p.spent || 0).toLocaleString()} บาท\n\n--- Automotive Funnel (เทียบกับผู้สนใจ) ---\n👥 ผู้สนใจ: ${inquiries.toLocaleString()} (100%)\n🚗 ทดลองขับ: ${testDrives.toLocaleString()} (${pct(testDrives)})\n📝 จองรถ: ${bookings.toLocaleString()} (${pct(bookings)})\n🔑 ส่งมอบ: ${deliveries.toLocaleString()} (${pct(deliveries)})\n\n📈 Overall Conversion: ${pct(deliveries)}\n\n📝 ${p.description || 'ไม่มีรายละเอียด'}`);
            }
          }
        });
        calendar.render();
        return () => calendar.destroy();
      }, [projects]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          <div className="mt-6 flex flex-wrap gap-4 justify-center items-center text-xs text-slate-600 border-t border-slate-100 pt-4">
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> กำลังดำเนินการ</span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200"><span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> เสร็จสิ้น</span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200"><span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> ชั่วคราว</span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200"><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span> ยกเลิก</span>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🎯 MAIN APP
    // ============================================================
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [dashboardFilter, setDashboardFilter] = useState('all');

      const [formData, setFormData] = useState({
        name: '', description: '', category: 'digital', budget: '', spent: '',
        inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
        status: 'planning', startDate: '', endDate: '', team: '', platform: '', target: ''
      });

      const categories = [
        { value: 'digital', label: 'Digital Lead Gen', emoji: '📱' },
        { value: 'motorshow', label: 'Motor Show / Exhibition', emoji: '🏢' },
        { value: 'testdrive', label: 'Test Drive Event', emoji: '🚗' },
        { value: 'dealer', label: 'Dealer Activation / Roadshow', emoji: '🏪' },
        { value: 'service', label: 'Service Campaign', emoji: '🔧' },
        { value: 'crm', label: 'CRM / Existing Customer', emoji: '🤝' },
        { value: 'other', label: 'อื่นๆ', emoji: '📌' }
      ];

      const statuses = [
        { value: 'planning', label: 'Planning (วางแผน)' },
        { value: 'active', label: 'Active (กำลังดำเนินการ)' },
        { value: 'paused', label: 'Paused (ชั่วคราว)' },
        { value: 'completed', label: 'Completed (เสร็จสิ้น)' },
        { value: 'cancelled', label: 'Cancelled (ยกเลิก)' }
      ];

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetForm = () => {
        setFormData({
          name: '', description: '', category: 'digital', budget: '', spent: '',
          inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
          status: 'planning', startDate: '', endDate: '', team: '', platform: '', target: ''
        });
        setEditingProject(null);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubscribe = FirebaseService.subscribeProjects((data) => {
          setProjects(data);
          setTimeout(() => lucide.createIcons(), 100);
        });
        return () => unsubscribe();
      }, [user]);

      const handleLogout = async () => {
        await auth.signOut();
        showToast('ออกจากระบบสำเร็จ', 'success');
      };

      const openModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          const sDate = parseDate(project.startDate);
          const eDate = parseDate(project.endDate);
          setFormData({
            name: project.name || '', description: project.description || '', category: project.category || 'digital',
            budget: project.budget || '', spent: project.spent || '', 
            inquiries: project.inquiries || '', testDrives: project.testDrives || '', 
            bookings: project.bookings || '', deliveries: project.deliveries || '', followUps: project.followUps || '',
            status: project.status || 'planning',
            startDate: sDate ? sDate.toISOString().split('T')[0] : '',
            endDate: eDate ? eDate.toISOString().split('T')[0] : '',
            team: project.team || '', platform: project.platform || '', target: project.target || ''
          });
        } else {
          resetForm();
        }
        setShowModal(true);
      };

      const saveProject = async () => {
        if (!formData.name || !formData.startDate || !formData.endDate) {
          showToast('กรุณากรอกชื่อแคมเปญ และวันที่เริ่มต้น-สิ้นสุด', 'error');
          return;
        }
        if (new Date(formData.startDate) > new Date(formData.endDate)) {
          showToast('วันที่เริ่มต้นต้องน้อยกว่าวันที่สิ้นสุด', 'error');
          return;
        }

        const dataToSave = {
          name: formData.name, description: formData.description || '', category: formData.category,
          budget: parseInt(formData.budget) || 0, spent: parseInt(formData.spent) || 0,
          inquiries: parseInt(formData.inquiries) || 0, testDrives: parseInt(formData.testDrives) || 0,
          bookings: parseInt(formData.bookings) || 0, deliveries: parseInt(formData.deliveries) || 0,
          followUps: parseInt(formData.followUps) || 0, status: formData.status,
          startDate: new Date(formData.startDate), endDate: new Date(formData.endDate),
          team: formData.team || '', platform: formData.platform || '', target: formData.target || ''
        };

        try {
          if (editingProject) await FirebaseService.updateProject(editingProject.id, dataToSave);
          else await FirebaseService.addProject(dataToSave);
          showToast(editingProject ? 'อัปเดตแคมเปญสำเร็จ' : 'สร้างแคมเปญใหม่สำเร็จ', 'success');
          setShowModal(false);
          resetForm();
        } catch (error) {
          showToast('เกิดข้อผิดพลาด: ' + error.message, 'error');
        }
      };

      const deleteProject = async (id) => {
        if (!confirm('คุณแน่ใจว่าต้องการลบแคมเปญนี้?')) return;
        try {
          await FirebaseService.deleteProject(id);
          showToast('ลบแคมเปญเรียบร้อย', 'success');
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการลบ', 'error');
        }
      };

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (searchTerm) result = result.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.description?.toLowerCase().includes(searchTerm.toLowerCase()));
        if (filterCategory !== 'all') result = result.filter(p => p.category === filterCategory);
        if (filterStatus !== 'all') result = result.filter(p => p.status === filterStatus);
        return result;
      }, [projects, searchTerm, filterCategory, filterStatus]);

      const dashboardProjects = useMemo(() => {
        if (dashboardFilter === 'all') return projects;
        if (dashboardFilter === 'active') return projects.filter(p => p.status === 'active');
        if (dashboardFilter === 'completed') return projects.filter(p => p.status === 'completed');
        return projects.filter(p => p.category === dashboardFilter);
      }, [projects, dashboardFilter]);

      const metrics = useMemo(() => {
        const total = dashboardProjects.length;
        const active = dashboardProjects.filter(p => p.status === 'active').length;
        const completed = dashboardProjects.filter(p => p.status === 'completed').length;
        const totalBudget = dashboardProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const totalSpent = dashboardProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        const totalInquiries = dashboardProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0);
        const totalTestDrives = dashboardProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0);
        const totalBookings = dashboardProjects.reduce((sum, p) => sum + (p.bookings || 0), 0);
        const totalDeliveries = dashboardProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0);
        const totalFollowUps = dashboardProjects.reduce((sum, p) => sum + (p.followUps || 0), 0);
        
        // ✅ คำนวณ % ทุกขั้นเทียบกับ "ผู้สนใจ" เป็นฐาน
        const testDriveRate = totalInquiries > 0 ? ((totalTestDrives / totalInquiries) * 100).toFixed(1) : 0;
        const bookingRate = totalInquiries > 0 ? ((totalBookings / totalInquiries) * 100).toFixed(1) : 0;
        const deliveryRate = totalInquiries > 0 ? ((totalDeliveries / totalInquiries) * 100).toFixed(2) : 0;
        const overallConversion = totalInquiries > 0 ? ((totalDeliveries / totalInquiries) * 100).toFixed(2) : 0;
        const cpl = totalInquiries > 0 ? (totalSpent / totalInquiries).toFixed(0) : 0;
        
        return { total, active, completed, totalBudget, totalSpent, totalInquiries, totalTestDrives, totalBookings, totalDeliveries, totalFollowUps, testDriveRate, bookingRate, deliveryRate, overallConversion, cpl };
      }, [dashboardProjects]);

      const categoryBreakdown = useMemo(() => {
        const breakdown = {};
        categories.forEach(cat => {
          const catProjects = projects.filter(p => p.category === cat.value);
          if (catProjects.length > 0) {
            breakdown[cat.value] = {
              ...cat, count: catProjects.length,
              totalBudget: catProjects.reduce((sum, p) => sum + (p.budget || 0), 0),
              totalSpent: catProjects.reduce((sum, p) => sum + (p.spent || 0), 0),
              totalInquiries: catProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0),
              totalTestDrives: catProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0),
              totalBookings: catProjects.reduce((sum, p) => sum + (p.bookings || 0), 0),
              totalDeliveries: catProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0)
            };
          }
        });
        return Object.values(breakdown);
      }, [projects]);

      const getStatusBadge = (status) => {
        const map = {
          planning: { label: 'Planning', color: 'bg-slate-100 text-slate-700 border border-slate-200' },
          active: { label: 'Active', color: 'bg-emerald-50 text-emerald-700 border border-emerald-200' },
          paused: { label: 'Paused', color: 'bg-amber-50 text-amber-700 border border-amber-200' },
          completed: { label: 'Completed', color: 'bg-blue-50 text-blue-700 border border-blue-200' },
          cancelled: { label: 'Cancelled', color: 'bg-red-50 text-red-700 border border-red-200' }
        };
        const s = map[status] || map.planning;
        return <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide ${s.color}`}>{s.label}</span>;
      };

      const formatDate = (date) => {
        const d = parseDate(date);
        if (!d) return '-';
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

      const getCategoryLabel = (catValue) => {
        const cat = categories.find(c => c.value === catValue);
        return cat ? `${cat.emoji} ${cat.label}` : catValue;
      };

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-50">
            <div className="text-center"><div className="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div><p className="mt-4 text-slate-500 font-medium text-sm">กำลังตรวจสอบสิทธิ์...</p></div>
          </div>
        );
      }

      if (!user) return <LoginComponent />;

      return (
        <div className="min-h-screen bg-slate-50">
          {toast && (
            <div className={`fixed top-4 right-4 z-[100] px-5 py-3 rounded-lg shadow-lg toast flex items-center gap-2 text-sm font-medium ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-blue-600 text-white'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4"></i>
              {toast.message}
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-6 py-4">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div className="flex items-center gap-3">
                  <div className="bg-blue-600 text-white p-2 rounded-lg shadow-sm">
                    <i data-lucide="car" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <h1 className="text-xl font-bold text-slate-900">Marketing Manager</h1>
                    <p className="text-xs text-slate-500">Welcome back, {user.email}</p>
                  </div>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => openModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow-sm hover:shadow">
                    <i data-lucide="plus" className="w-4 h-4"></i> แคมเปญใหม่
                  </button>
                  <button onClick={handleLogout} className="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 border border-slate-300">
                    <i data-lucide="log-out" className="w-4 h-4"></i> ออกจากระบบ
                  </button>
                </div>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex gap-2 mb-6 border-b border-slate-200 pb-1 overflow-x-auto">
              {[
                { id: 'dashboard', label: '📈 Dashboard รวม' },
                { id: 'breakdown', label: '📊 แยกกิจกรรม' },
                { id: 'projects', label: '📋 รายการแคมเปญ' },
                { id: 'calendar', label: '📅 ปฏิทิน' }
              ].map((tab) => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2.5 rounded-t-lg text-sm font-semibold transition whitespace-nowrap border-b-2 ${activeTab === tab.id ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}>
                  {tab.label}
                </button>
              ))}
            </div>

            {/* 📈 DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="fade-in space-y-6">
                <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wide mr-2">🔍 มุมมองข้อมูล:</span>
                    <button onClick={() => setDashboardFilter('all')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${dashboardFilter === 'all' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>ทั้งหมด ({projects.length})</button>
                    <button onClick={() => setDashboardFilter('active')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${dashboardFilter === 'active' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>Active ({projects.filter(p => p.status === 'active').length})</button>
                    {categories.map(cat => {
                      const count = projects.filter(p => p.category === cat.value).length;
                      if (count === 0) return null;
                      return (
                        <button key={cat.value} onClick={() => setDashboardFilter(cat.value)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${dashboardFilter === cat.value ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                          {cat.emoji} {cat.label} ({count})
                        </button>
                      );
                    })}
                  </div>
                </div>

                <AutoFunnel data={{ inquiries: metrics.totalInquiries, testDrives: metrics.totalTestDrives, bookings: metrics.totalBookings, deliveries: metrics.totalDeliveries }} />

                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
                  <StatCard title="แคมเปญทั้งหมด" value={metrics.total} icon="folder" color="text-blue-600" bg="bg-blue-50" subtitle={`Active: ${metrics.active}`} />
                  <StatCard title="งบประมาณรวม" value={`฿${metrics.totalBudget.toLocaleString()}`} icon="wallet" color="text-amber-600" bg="bg-amber-50" />
                  <StatCard title="ใช้จ่ายแล้ว" value={`฿${metrics.totalSpent.toLocaleString()}`} icon="credit-card" color="text-rose-600" bg="bg-rose-50" subtitle={`${metrics.totalBudget > 0 ? ((metrics.totalSpent/metrics.totalBudget)*100).toFixed(0) : 0}% ของงบ`} />
                  <StatCard title="Cost Per Lead" value={`฿${parseInt(metrics.cpl || 0).toLocaleString()}`} icon="target" color="text-purple-600" bg="bg-purple-50" subtitle="งบที่ใช้ ÷ ผู้สนใจ" />
                  <StatCard title="Follow-up" value={metrics.totalFollowUps.toLocaleString()} icon="phone-call" color="text-orange-600" bg="bg-orange-50" />
                </div>
              </div>
            )}

            {/* 📊 BREAKDOWN TAB */}
            {activeTab === 'breakdown' && (
              <div className="fade-in space-y-4">
                {categoryBreakdown.length === 0 ? (
                  <div className="bg-white rounded-xl border border-slate-200 p-12 text-center shadow-sm">
                    <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4"><i data-lucide="inbox" className="w-8 h-8"></i></div>
                    <p className="text-slate-500 font-medium">ยังไม่มีข้อมูลกิจกรรม</p>
                  </div>
                ) : (
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-5 border-b border-slate-100 flex justify-between items-center">
                      <h3 className="text-lg font-bold text-slate-900">📊 รายงานสรุปแยกตามกิจกรรม</h3>
                      <span className="text-xs text-slate-500 bg-slate-100 px-3 py-1 rounded-full">Automotive Performance Report</span>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200">
                            <th className="text-left p-4 font-bold text-slate-700 uppercase tracking-wide text-xs">กิจกรรม</th>
                            <th className="text-right p-4 font-bold text-slate-700 uppercase tracking-wide text-xs">แคมเปญ</th>
                            <th className="text-right p-4 font-bold text-slate-700 uppercase tracking-wide text-xs">ผู้สนใจ</th>
                            <th className="text-right p-4 font-bold text-blue-700 uppercase tracking-wide text-xs">ทดลองขับ</th>
                            <th className="text-right p-4 font-bold text-amber-700 uppercase tracking-wide text-xs">จองรถ</th>
                            <th className="text-right p-4 font-bold text-emerald-700 uppercase tracking-wide text-xs">ส่งมอบ</th>
                            <th className="text-right p-4 font-bold text-slate-700 uppercase tracking-wide text-xs">Conversion</th>
                            <th className="text-right p-4 font-bold text-slate-700 uppercase tracking-wide text-xs">งบประมาณ</th>
                          </tr>
                        </thead>
                        <tbody>
                          {categoryBreakdown.map((cat) => {
                            // ✅ คำนวณ Conversion เทียบกับ "ผู้สนใจ" เป็นฐาน
                            const conv = cat.totalInquiries > 0 ? ((cat.totalDeliveries / cat.totalInquiries) * 100).toFixed(2) : '0.00';
                            const spentPercent = cat.totalBudget > 0 ? ((cat.totalSpent / cat.totalBudget) * 100).toFixed(0) : 0;
                            return (
                              <tr key={cat.value} className="border-b border-slate-100 hover:bg-slate-50/80 transition">
                                <td className="p-4 font-semibold text-slate-900">{cat.emoji} {cat.label}</td>
                                <td className="text-right p-4 text-slate-600">{cat.count}</td>
                                <td className="text-right p-4 text-slate-600">{cat.totalInquiries.toLocaleString()}</td>
                                <td className="text-right p-4 font-medium text-blue-700">{cat.totalTestDrives.toLocaleString()}</td>
                                <td className="text-right p-4 font-medium text-amber-700">{cat.totalBookings.toLocaleString()}</td>
                                <td className="text-right p-4 font-bold text-emerald-700">{cat.totalDeliveries.toLocaleString()}</td>
                                <td className="text-right p-4"><span className="bg-blue-50 text-blue-700 px-2 py-1 rounded-md text-xs font-bold">{conv}%</span></td>
                                <td className="text-right p-4">
                                  <div className="text-xs text-slate-500 mb-1">฿{cat.totalSpent.toLocaleString()} / ฿{cat.totalBudget.toLocaleString()}</div>
                                  <div className="w-24 ml-auto bg-slate-200 rounded-full h-1.5 overflow-hidden">
                                    <div className={`h-full progress-bar ${spentPercent > 90 ? 'bg-red-500' : spentPercent > 70 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(spentPercent, 100)}%` }}></div>
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                          <tr className="bg-slate-100 font-bold border-t-2 border-slate-200">
                            <td className="p-4 text-slate-900">📊 รวมทั้งหมด</td>
                            <td className="text-right p-4 text-slate-900">{categoryBreakdown.reduce((s, c) => s + c.count, 0)}</td>
                            <td className="text-right p-4 text-slate-900">{categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0).toLocaleString()}</td>
                            <td className="text-right p-4 text-blue-900">{categoryBreakdown.reduce((s, c) => s + c.totalTestDrives, 0).toLocaleString()}</td>
                            <td className="text-right p-4 text-amber-900">{categoryBreakdown.reduce((s, c) => s + c.totalBookings, 0).toLocaleString()}</td>
                            <td className="text-right p-4 text-emerald-900">{categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0).toLocaleString()}</td>
                            <td className="text-right p-4">
                              {(() => {
                                const v = categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0);
                                const d = categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0);
                                return <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded-md text-xs font-bold">{v > 0 ? ((d/v)*100).toFixed(2) + '%' : '0.00%'}</span>;
                              })()}
                            </td>
                            <td className="text-right p-4 text-slate-900">฿{categoryBreakdown.reduce((s, c) => s + c.totalSpent, 0).toLocaleString()}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 📋 PROJECTS TAB */}
            {activeTab === 'projects' && (
              <div className="fade-in">
                <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4 shadow-sm">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">🔍 ค้นหา</label>
                      <input type="text" placeholder="ค้นหาชื่อแคมเปญ..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">📂 หมวดหมู่</label>
                      <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">ทั้งหมด</option>
                        {categories.map(cat => <option key={cat.value} value={cat.value}>{cat.emoji} {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">📊 สถานะ</label>
                      <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="all">ทั้งหมด</option>
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                  {filteredProjects.length === 0 ? (
                    <div className="col-span-full bg-white rounded-xl border border-slate-200 p-12 text-center shadow-sm">
                      <div className="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4"><i data-lucide="search-x" className="w-8 h-8"></i></div>
                      <p className="text-slate-500 font-medium">ไม่พบแคมเปญตามเงื่อนไข</p>
                    </div>
                  ) : (
                    filteredProjects.map(p => {
                      // ✅ คำนวณ % ทุกขั้นเทียบกับ "ผู้สนใจ" เป็นฐาน
                      const inquiries = p.inquiries || 0;
                      const testDriveRate = inquiries > 0 ? (((p.testDrives || 0) / inquiries) * 100).toFixed(0) : 0;
                      const bookingRate = inquiries > 0 ? (((p.bookings || 0) / inquiries) * 100).toFixed(0) : 0;
                      const deliveryRate = inquiries > 0 ? (((p.deliveries || 0) / inquiries) * 100).toFixed(0) : 0;
                      const spentPercent = (p.budget || 0) > 0 ? (((p.spent || 0) / (p.budget || 0)) * 100).toFixed(0) : 0;

                      return (
                        <div key={p.id} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all duration-200 group">
                          <div className="flex justify-between items-start mb-3">
                            <div className="flex-1 min-w-0 mr-3">
                              <h4 className="font-bold text-slate-900 truncate group-hover:text-blue-700 transition">{p.name}</h4>
                              <p className="text-xs text-slate-500 mt-0.5">{getCategoryLabel(p.category)}</p>
                            </div>
                            {getStatusBadge(p.status)}
                          </div>
                          <p className="text-xs text-slate-400 mb-4 flex items-center gap-1.5">
                            <i data-lucide="calendar" className="w-3.5 h-3.5"></i>
                            {formatDate(p.startDate)} - {formatDate(p.endDate)}
                          </p>

                          {/* ✅ แสดง % เทียบกับ "ผู้สนใจ" */}
                          <div className="grid grid-cols-4 gap-2 mb-4 p-3 bg-slate-50 rounded-lg border border-slate-100">
                            <div className="text-center">
                              <p className="text-[10px] text-slate-500 font-semibold uppercase">ผู้สนใจ</p>
                              <p className="text-sm font-bold text-slate-700">{inquiries.toLocaleString()}</p>
                              <p className="text-[9px] text-slate-500 font-medium">100%</p>
                            </div>
                            <div className="text-center border-l border-slate-200">
                              <p className="text-[10px] text-slate-500 font-semibold uppercase">ทดลองขับ</p>
                              <p className="text-sm font-bold text-blue-700">{(p.testDrives || 0).toLocaleString()}</p>
                              <p className="text-[9px] text-blue-600 font-medium">{testDriveRate}%</p>
                            </div>
                            <div className="text-center border-l border-slate-200">
                              <p className="text-[10px] text-slate-500 font-semibold uppercase">จอง</p>
                              <p className="text-sm font-bold text-amber-700">{(p.bookings || 0).toLocaleString()}</p>
                              <p className="text-[9px] text-amber-600 font-medium">{bookingRate}%</p>
                            </div>
                            <div className="text-center border-l border-slate-200">
                              <p className="text-[10px] text-slate-500 font-semibold uppercase">ส่งมอบ</p>
                              <p className="text-sm font-bold text-emerald-700">{(p.deliveries || 0).toLocaleString()}</p>
                              <p className="text-[9px] text-emerald-600 font-medium">{deliveryRate}%</p>
                            </div>
                          </div>

                          <div className="mb-4">
                            <div className="flex justify-between text-[11px] text-slate-500 mb-1.5 font-medium">
                              <span>💰 การใช้งบประมาณ</span>
                              <span className={`${spentPercent > 90 ? 'text-red-600' : spentPercent > 70 ? 'text-amber-600' : 'text-emerald-600'}`}>
                                ฿{(p.spent || 0).toLocaleString()} / ฿{(p.budget || 0).toLocaleString()} ({spentPercent}%)
                              </span>
                            </div>
                            <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                              <div className={`h-full progress-bar ${spentPercent > 90 ? 'bg-red-500' : spentPercent > 70 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(spentPercent, 100)}%` }}></div>
                            </div>
                          </div>

                          <div className="flex gap-2 pt-3 border-t border-slate-100">
                            <button onClick={() => openModal(p)} className="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5">
                              <i data-lucide="pencil" className="w-3.5 h-3.5"></i> แก้ไข
                            </button>
                            <button onClick={() => deleteProject(p.id)} className="flex-1 bg-red-50 hover:bg-red-100 text-red-600 py-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5">
                              <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> ลบ
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* 📅 CALENDAR TAB */}
            {activeTab === 'calendar' && (
              <div className="fade-in bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                <CalendarComponent projects={projects} />
              </div>
            )}
          </div>

          {/* 🟢 MODAL */}
          {showModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto fade-in" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-6">
                  <h3 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide={editingProject ? 'pencil' : 'plus-circle'} className="w-5 h-5 text-blue-600"></i>
                    {editingProject ? 'แก้ไขแคมเปญ' : 'สร้างแคมเปญใหม่'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600 transition"><i data-lucide="x" className="w-5 h-5"></i></button>
                </div>
                
                <div className="space-y-5">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">ชื่อแคมเปญ *</label>
                    <input type="text" placeholder="เช่น Test Drive Weekend, Motor Show 2026" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">หมวดหมู่</label>
                      <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500">
                        {categories.map(cat => <option key={cat.value} value={cat.value}>{cat.emoji} {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">สถานะ *</label>
                      <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-white outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">วันที่เริ่มต้น *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">วันที่สิ้นสุด *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">งบประมาณ (บาท)</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">ใช้ไปแล้ว (บาท)</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                  </div>

                  {/* 🚗 Auto Funnel Data */}
                  <div className="rounded-xl border border-blue-100 bg-gradient-to-br from-blue-50/60 to-white p-5 space-y-4">
                    <div>
                      <h4 className="font-bold text-blue-900 flex items-center gap-2 text-sm uppercase tracking-wide">
                        <i data-lucide="target" className="w-4 h-4"></i> ข้อมูล Automotive Sales Funnel
                      </h4>
                      <p className="text-xs text-slate-500 mt-1">ทุกขั้นตอนคำนวณ % เทียบกับ <span className="font-semibold text-slate-700">"ผู้สนใจ"</span> เป็นฐาน</p>
                    </div>

                    {/* Funnel Preview - แสดง % เทียบกับ "ผู้สนใจ" */}
                    {(() => {
                      const inq = parseInt(formData.inquiries) || 0;
                      const td = parseInt(formData.testDrives) || 0;
                      const bk = parseInt(formData.bookings) || 0;
                      const dl = parseInt(formData.deliveries) || 0;
                      const pct = (v) => inq > 0 ? ((v / inq) * 100).toFixed(1) + '%' : '0.0%';
                      return (
                        <div className="bg-white rounded-lg p-4 border border-blue-200 shadow-sm">
                          <p className="text-xs text-slate-500 mb-3 font-bold uppercase tracking-wide">📊 Funnel Preview (% เทียบกับผู้สนใจ)</p>
                          <div className="grid grid-cols-4 gap-2 text-center">
                            <div className="p-2 rounded-lg bg-slate-50 border border-slate-200">
                              <p className="text-[10px] text-slate-700 font-bold uppercase">ผู้สนใจ</p>
                              <p className="text-lg font-extrabold text-slate-900">{inq}</p>
                              <p className="text-[10px] text-slate-500 font-semibold">100%</p>
                            </div>
                            <div className="p-2 rounded-lg bg-blue-50 border border-blue-200">
                              <p className="text-[10px] text-blue-700 font-bold uppercase">ทดลองขับ</p>
                              <p className="text-lg font-extrabold text-slate-900">{td}</p>
                              <p className="text-[10px] text-blue-600 font-semibold">{pct(td)}</p>
                            </div>
                            <div className="p-2 rounded-lg bg-amber-50 border border-amber-200">
                              <p className="text-[10px] text-amber-700 font-bold uppercase">จอง</p>
                              <p className="text-lg font-extrabold text-slate-900">{bk}</p>
                              <p className="text-[10px] text-amber-600 font-semibold">{pct(bk)}</p>
                            </div>
                            <div className="p-2 rounded-lg bg-emerald-50 border border-emerald-200">
                              <p className="text-[10px] text-emerald-700 font-bold uppercase">ส่งมอบ</p>
                              <p className="text-lg font-extrabold text-slate-900">{dl}</p>
                              <p className="text-[10px] text-emerald-600 font-semibold">{pct(dl)}</p>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1.5">👥 ผู้สนใจ (Inquiries)</label>
                        <input type="number" min="0" placeholder="0" value={formData.inquiries} onChange={(e) => setFormData({...formData, inquiries: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-slate-500 bg-white" />
                      </div>
                      <div className="bg-blue-50/50 border border-blue-200 rounded-lg p-0.5">
                        <label className="block text-xs font-bold text-blue-800 mb-1.5 px-2.5 pt-1">🚗 ทดลองขับ</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="w-full border border-blue-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-white mx-0.5 mb-0.5" />
                      </div>
                      <div className="bg-amber-50/50 border border-amber-200 rounded-lg p-0.5">
                        <label className="block text-xs font-bold text-amber-800 mb-1.5 px-2.5 pt-1">📝 จองรถ</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="w-full border border-amber-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-amber-500 bg-white mx-0.5 mb-0.5" />
                      </div>
                      <div className="bg-emerald-50/50 border border-emerald-200 rounded-lg p-0.5">
                        <label className="block text-xs font-bold text-emerald-800 mb-1.5 px-2.5 pt-1">🔑 ส่งมอบรถ</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="w-full border border-emerald-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-white mx-0.5 mb-0.5" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 mb-1.5">📞 Follow-up</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-orange-500 bg-white" />
                      </div>
                    </div>

                    <div className="rounded-xl bg-gradient-to-br from-blue-600 to-blue-700 p-4 text-white shadow-md flex flex-col justify-center">
                      <div className="text-xs font-medium text-blue-200 uppercase tracking-wide mb-1">📈 Overall Conversion Rate</div>
                      <div className="text-3xl font-extrabold tracking-tight">
                        {(Number(formData.inquiries) || 0) > 0 ? (((Number(formData.deliveries) || 0) / (Number(formData.inquiries) || 0)) * 100).toFixed(2) : '0.00'}%
                      </div>
                      <div className="text-[11px] text-blue-200 mt-1">ส่งมอบรถ ÷ ผู้สนใจ × 100</div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wide mb-1.5">รายละเอียดเพิ่มเติม</label>
                    <textarea rows="3" placeholder="ระบุรายละเอียดกลุ่มเป้าหมาย, รุ่นรถที่โปรโมท, หรือเป้าหมายของแคมเปญ" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full border border-slate-300 p-2.5 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button onClick={saveProject} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-bold text-sm transition shadow-sm hover:shadow flex items-center justify-center gap-2">
                      <i data-lucide="save" className="w-4 h-4"></i> บันทึกข้อมูล
                    </button>
                    <button onClick={() => setShowModal(false)} className="px-6 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-bold transition">
                      ยกเลิก
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
