  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ============================================================
    // 🔥 FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyALhqvQGSPR2OtWG4-yuAeBVeo103mLHeE",
      authDomain: "mkt-project-f818a.firebaseapp.com",

      appId: "1:1076626422079:web:31d3849f6af7ae76213b8a",
      measurementId: "G-LQFMH7X9WH"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.firestore();
    const auth = firebase.auth();
    const analytics = firebase.analytics();

    analytics.logEvent('page_view', {
      page_title: 'Marketing Project Management',
      page_location: window.location.href

    const parseDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal.toDate && typeof dateVal.toDate === 'function') return dateVal.toDate();
      if (dateVal.seconds) return new Date(dateVal.seconds * 1000);
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? null : d;
    };

    // ============================================================
    // 📦 FIRESTORE SERVICE
    // ============================================================
    const FirebaseService = {
      async getProjects() {
        try {
          const snapshot = await db.collection('projects').orderBy('startDate', 'desc').get();
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ 
              id: doc.id, 
              ...data,
              startDate: parseDate(data.startDate),
              endDate: parseDate(data.endDate)
            });
          });
          return projects;
        } catch (error) {
          console.error('Error fetching projects:', error);
          throw error;
        }
      },

      async addProject(projectData) {
        try {
          const docRef = await db.collection('projects').add({
            ...projectData,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          return { id: docRef.id, ...projectData };
        } catch (error) {
          console.error('Error adding project:', error);
          throw error;
        }
      },

      async updateProject(id, projectData) {
        try {
          await db.collection('projects').doc(id).update({
            ...projectData,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          return { id, ...projectData };
        } catch (error) {
          console.error('Error updating project:', error);
          throw error;
        }
      },

      async deleteProject(id) {
        try {
          await db.collection('projects').doc(id).delete();
          return { success: true };
        } catch (error) {
          console.error('Error deleting project:', error);
          throw error;
        }
      },

      subscribeProjects(callback) {
        return db.collection('projects').orderBy('startDate', 'desc').onSnapshot((snapshot) => {
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ 
              id: doc.id, 
              ...data,
              startDate: parseDate(data.startDate),
              endDate: parseDate(data.endDate)
            });
          });
          callback(projects);
        }, (error) => {
          console.error('Error in subscription:', error);
        });
      }
    };

    // ============================================================
    // 🔐 LOGIN COMPONENT
    // ============================================================
    function LoginComponent({ onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        try {
          if (isRegister) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          console.error(err);
          let msg = 'เกิดข้อผิดพลาด';
          if (err.code === 'auth/user-not-found') msg = 'ไม่พบบัญชีผู้ใช้นี้';
          else if (err.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (err.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้งานแล้ว';
          else if (err.code === 'auth/weak-password') msg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          else if (err.code === 'auth/invalid-email') msg = 'รูปแบบอีเมลไม่ถูกต้อง';
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <div className="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden fade-in">
            <div className="p-8">
              <div className="text-center mb-8">
                <h1 className="text-3xl font-bold text-indigo-600 mb-2">MKT Project</h1>
                <p className="text-slate-500">{isRegister ? 'สร้างบัญชีใหม่' : 'เข้าสู่ระบบเพื่อจัดการโปรเจค'}</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
                  <input 
                    type="email" 
                    value={email} 
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="name@example.com"
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                  <input 
                    type="password" 
                    value={password} 
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="••••••••"
                    required
                  />
                </div>

                {error && (
                  <div className="p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100">
                    {error}
                  </div>
                )}

                <button 
                  type="submit" 
                  disabled={loading}
                  className={`w-full py-2.5 rounded-lg font-semibold text-white transition ${
                    loading ? 'bg-indigo-400 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'
                  }`}
                >
                  {loading ? 'กำลังดำเนินการ...' : (isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ')}
                </button>
              </form>

              <div className="mt-6 text-center">
                <button 
                  onClick={() => { setIsRegister(!isRegister); setError(''); }}
                  className="text-sm text-indigo-600 hover:text-indigo-800 font-medium"
                >
                  {isRegister ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? สมัครสมาชิก'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // 📊 STAT CARD COMPONENT
    // ============================================================
    function StatCard({ title, value, icon, color, bg, subtitle, trend }) {
      return (
        <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between stat-card-hover">
          <div className="flex-1 min-w-0">
            <p className="text-xs font-medium text-slate-500 truncate">{title}</p>
            <p className="text-xl font-bold text-slate-900 truncate">{value}</p>
            {subtitle && <p className="text-xs text-slate-400 mt-0.5 truncate">{subtitle}</p>}
          </div>
          <div className={`p-2.5 rounded-lg ${bg} ${color} flex-shrink-0 ml-2`}>
            <i data-lucide={icon} className="w-5 h-5"></i>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🎯 FUNNEL VISUALIZATION
    // ============================================================
    function FunnelVisualization({ data }) {
      const maxValue = Math.max(data.visitors, data.leads, data.bookings, data.deliveries, 1);
      
      const steps = [
        { label: 'ผู้เข้าชม', value: data.visitors, color: 'bg-cyan-500', emoji: '👥', rate: '100%' },
        { label: 'มุ่งหวัง', value: data.leads, color: 'bg-violet-500', emoji: '🎯', 
          rate: data.visitors > 0 ? ((data.leads / data.visitors) * 100).toFixed(1) + '%' : '0%' },
        { label: 'จอง', value: data.bookings, color: 'bg-amber-500', emoji: '📝',
          rate: data.leads > 0 ? ((data.bookings / data.leads) * 100).toFixed(1) + '%' : '0%' },
        { label: 'ส่งมอบ', value: data.deliveries, color: 'bg-emerald-500', emoji: '🚗',
          rate: data.bookings > 0 ? ((data.deliveries / data.bookings) * 100).toFixed(1) + '%' : '0%' }
      ];

      return (
        <div className="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
          <h3 className="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
            <span>📈</span> Sales Funnel (รวมทุกกิจกรรม)
          </h3>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {steps.map((step, idx) => (
              <div key={idx} className="relative">
                <div className="bg-slate-50 rounded-lg p-4 border border-slate-100">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold text-slate-500">{step.emoji} {step.label}</span>
                    <span className="text-xs font-bold text-indigo-600">{step.rate}</span>
                  </div>
                  <p className="text-2xl font-bold text-slate-900 mb-2">{(step.value || 0).toLocaleString()}</p>
                  <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div 
                      className={`h-full ${step.color} progress-bar`} 
                      style={{ width: `${Math.max((step.value / maxValue) * 100, 5)}%` }}
                    ></div>
                  </div>
                </div>
                {idx < steps.length - 1 && (
                  <div className="hidden md:block absolute -right-3 top-1/2 transform -translate-y-1/2 text-slate-300 text-2xl z-10">→</div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ============================================================
    // 📅 CALENDAR COMPONENT
    // ============================================================
    function CalendarComponent({ projects }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;

        const events = projects
          .filter(p => p.startDate && p.endDate)
          .map(p => {
            const startD = parseDate(p.startDate);
            const endD = parseDate(p.endDate);
            const adjustedEnd = new Date(endD);
            adjustedEnd.setDate(adjustedEnd.getDate() + 1);

            return {
              id: p.id,
              title: p.name,
              start: startD.toISOString().split('T')[0],
              end: adjustedEnd.toISOString().split('T')[0],
              backgroundColor: p.status === 'completed' ? '#3b82f6' : 
                              p.status === 'active' ? '#10b981' : 
                              p.status === 'paused' ? '#f59e0b' : 
                              p.status === 'cancelled' ? '#ef4444' : '#94a3b8',
              borderColor: 'transparent',
              textColor: '#ffffff'
            };
          });

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth',
          locale: 'th',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,dayGridWeek'
          },
          events: events,
          eventClick: function(info) {
            const p = projects.find(proj => proj.id === info.event.id);
            if (p) {
              const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
              const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
              alert(
                `📋 ${p.name}\n\n` +
                `📅 ${startStr} - ${endStr}\n` +
                `📂 หมวดหมู่: ${p.category || 'ไม่ระบุ'}\n` +
                `📊 สถานะ: ${p.status || 'planning'}\n` +
                `💰 งบประมาณ: ${p.budget?.toLocaleString() || 0} บาท\n` +
                `💸 ใช้ไป: ${p.spent?.toLocaleString() || 0} บาท\n\n` +
                `--- Funnel ---\n` +
                `👥 ผู้เข้าชม: ${(p.visitors || 0).toLocaleString()}\n` +
                `🎯 มุ่งหวัง: ${(p.leads || 0).toLocaleString()}\n` +
                `📝 จอง: ${(p.bookings || 0).toLocaleString()}\n` +
                `🚗 ส่งมอบ: ${(p.deliveries || 0).toLocaleString()}\n` +
                `🚙 ทดลองขับ: ${(p.testDrives || 0).toLocaleString()}\n` +
                `📞 Follow-up: ${(p.followUps || 0).toLocaleString()}\n\n` +
                `📈 Conversion Rate (มุ่งหวัง→ส่งมอบ): ${(p.leads || 0) > 0 ? (((p.deliveries || 0) / (p.leads || 0)) * 100).toFixed(1) : '0.0'}%\n\n` +
                `📝 ${p.description || 'ไม่มีรายละเอียด'}`
              );
            }
          }
        });

        calendar.render();

        return () => {
          calendar.destroy();
        };
      }, [projects]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          
          <div className="mt-6 flex flex-wrap gap-4 justify-center items-center text-xs text-slate-600 border-t border-slate-100 pt-4">
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200 shadow-sm">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Active
            </span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200 shadow-sm">
              <span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Completed
            </span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200 shadow-sm">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Paused
            </span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200 shadow-sm">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500"></span> Cancelled
            </span>
            <span className="flex items-center gap-1.5 font-medium px-3 py-1 rounded-full bg-slate-50 border border-slate-200 shadow-sm">
              <span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Planning
            </span>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🎯 MAIN APP
    // ============================================================
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showModal, setShowModal] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [dashboardFilter, setDashboardFilter] = useState('all'); // ✨ ใหม่: filter ใน dashboard

      const [formData, setFormData] = useState({
        name: '', description: '', category: 'social', budget: '', spent: '',
        leads: '', conversions: '', visitors: '', testDrives: '', followUps: '',
        bookings: '', deliveries: '', // ✨ ใหม่
        salesUnits: '', salesValue: '', status: 'planning', startDate: '', endDate: '',
        team: '', platform: '', target: ''
      });

      const categories = [
        { value: 'social', label: '📱 Social Media', emoji: '📱' },
        { value: 'seo', label: '🔍 SEO', emoji: '🔍' },
        { value: 'email', label: '📧 Email Marketing', emoji: '📧' },
        { value: 'content', label: '📝 Content Marketing', emoji: '📝' },
        { value: 'influencer', label: '⭐ Influencer', emoji: '⭐' },
        { value: 'ads', label: '💲 Paid Ads', emoji: '💲' },
        { value: 'event', label: '🎪 Event', emoji: '🎪' },
        { value: 'other', label: '📌 Other', emoji: '📌' }
      ];

      const statuses = [
        { value: 'planning', label: '📋 Planning (วางแผน)' },
        { value: 'active', label: '🟢 Active (กำลังดำเนินการ)' },
        { value: 'paused', label: '🟡 Paused (ชั่วคราว)' },
        { value: 'completed', label: '✅ Completed (เสร็จสิ้น)' },
        { value: 'cancelled', label: '🔴 Cancelled (ยกเลิก)' }
      ];

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetForm = () => {
        setFormData({
          name: '', description: '', category: 'social', budget: '', spent: '',
          leads: '', conversions: '', visitors: '', testDrives: '', followUps: '',
          bookings: '', deliveries: '',
          salesUnits: '', salesValue: '', status: 'planning', startDate: '', endDate: '',
          team: '', platform: '', target: ''
        });
        setEditingProject(null);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        
        const unsubscribe = FirebaseService.subscribeProjects((data) => {
          setProjects(data);
          setLoading(false);
          setTimeout(() => lucide.createIcons(), 100);
        });
        return () => unsubscribe();
      }, [user]);

      const handleLogout = async () => {
        try {
          await auth.signOut();
          showToast('ออกจากระบบสำเร็จ', 'success');
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการออกจากระบบ', 'error');
        }
      };

      const openModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          const sDate = parseDate(project.startDate);
          const eDate = parseDate(project.endDate);
          setFormData({
            name: project.name || '',
            description: project.description || '',
            category: project.category || 'social',
            budget: project.budget || '',
            spent: project.spent || '',
            leads: project.leads || '',
            conversions: project.conversions || '',
            visitors: project.visitors || '',
            testDrives: project.testDrives || '',
            followUps: project.followUps || '',
            bookings: project.bookings || '',
            deliveries: project.deliveries || '',
            salesUnits: project.salesUnits || '',
            salesValue: project.salesValue || '',
            status: project.status || 'planning',
            startDate: sDate ? sDate.toISOString().split('T')[0] : '',
            endDate: eDate ? eDate.toISOString().split('T')[0] : '',
            team: project.team || '',
            platform: project.platform || '',
            target: project.target || ''
          });
        } else {
          resetForm();
        }
        setShowModal(true);
      };

      const closeModal = () => {
        setShowModal(false);
        resetForm();
      };

      const saveProject = async () => {
        if (!formData.name || !formData.startDate || !formData.endDate) {
          showToast('กรุณากรอกชื่อโปรเจค และวันที่เริ่มต้น-สิ้นสุด', 'error');
          return;
        }

        if (new Date(formData.startDate) > new Date(formData.endDate)) {
          showToast('วันที่เริ่มต้นต้องน้อยกว่าวันที่สิ้นสุด', 'error');
          return;
        }

        const dataToSave = {
          name: formData.name,
          description: formData.description || '',
          category: formData.category,
          budget: parseInt(formData.budget) || 0,
          spent: parseInt(formData.spent) || 0,
          leads: parseInt(formData.leads) || 0,
          conversions: parseInt(formData.conversions) || 0,
          visitors: parseInt(formData.visitors) || 0,
          testDrives: parseInt(formData.testDrives) || 0,
          followUps: parseInt(formData.followUps) || 0,
          bookings: parseInt(formData.bookings) || 0,
          deliveries: parseInt(formData.deliveries) || 0,
          salesUnits: parseInt(formData.salesUnits) || 0,
          salesValue: parseFloat(formData.salesValue) || 0,
          status: formData.status,
          startDate: new Date(formData.startDate),
          endDate: new Date(formData.endDate),
          team: formData.team || '',
          platform: formData.platform || '',
          target: formData.target || ''
        };

        try {
          if (editingProject) {
            await FirebaseService.updateProject(editingProject.id, dataToSave);
            showToast('อัปเดตโปรเจคสำเร็จ!', 'success');
          } else {
            await FirebaseService.addProject(dataToSave);
            showToast('สร้างโปรเจคใหม่สำเร็จ!', 'success');
          }
          closeModal();

          showToast('เกิดข้อผิดพลาด: ' + error.message, 'error');
        }

      const deleteProject = async (id) => {
        if (!confirm('คุณแน่ใจว่าต้องการลบโปรเจคนี้?')) return;
        try {
          await FirebaseService.deleteProject(id);
          showToast('ลบโปรเจคเรียบร้อย', 'success');

          showToast('เกิดข้อผิดพลาดในการลบ', 'error');
        }
      };

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (searchTerm) {
          result = result.filter(p => 
            p.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            p.description?.toLowerCase().includes(searchTerm.toLowerCase())
          );
        }
        if (filterCategory !== 'all') {
          result = result.filter(p => p.category === filterCategory);
        }
        if (filterStatus !== 'all') {
          result = result.filter(p => p.status === filterStatus);
        }
        return result;
      }, [projects, searchTerm, filterCategory, filterStatus]);

      // ✨ ใหม่: Filtered projects for dashboard (based on dashboardFilter)
      const dashboardProjects = useMemo(() => {
        if (dashboardFilter === 'all') return projects;
        if (dashboardFilter === 'active') return projects.filter(p => p.status === 'active');
        if (dashboardFilter === 'completed') return projects.filter(p => p.status === 'completed');
        // ถ้าเป็น category
        return projects.filter(p => p.category === dashboardFilter);
      }, [projects, dashboardFilter]);

      const metrics = useMemo(() => {
        const total = dashboardProjects.length;
        const active = dashboardProjects.filter(p => p.status === 'active').length;
        const completed = dashboardProjects.filter(p => p.status === 'completed').length;
        const totalBudget = dashboardProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const totalSpent = dashboardProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        const totalLeads = dashboardProjects.reduce((sum, p) => sum + (p.leads || 0), 0);
        const totalConversions = dashboardProjects.reduce((sum, p) => sum + (p.conversions || 0), 0);
        const totalVisitors = dashboardProjects.reduce((sum, p) => sum + (p.visitors || 0), 0);
        const totalTestDrives = dashboardProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0);
        const totalFollowUps = dashboardProjects.reduce((sum, p) => sum + (p.followUps || 0), 0);
        const totalBookings = dashboardProjects.reduce((sum, p) => sum + (p.bookings || 0), 0);
        const totalDeliveries = dashboardProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0);
        const totalSalesUnits = dashboardProjects.reduce((sum, p) => sum + (p.salesUnits || 0), 0);
        const totalSalesValue = dashboardProjects.reduce((sum, p) => sum + (p.salesValue || 0), 0);
        
        // Conversion rates
        const leadRate = totalVisitors > 0 ? ((totalLeads / totalVisitors) * 100).toFixed(1) : 0;
        const bookingRate = totalLeads > 0 ? ((totalBookings / totalLeads) * 100).toFixed(1) : 0;
        const deliveryRate = totalBookings > 0 ? ((totalDeliveries / totalBookings) * 100).toFixed(1) : 0;
        const overallConversion = totalVisitors > 0 ? ((totalDeliveries / totalVisitors) * 100).toFixed(2) : 0;
        
        return { 
          total, active, completed, totalBudget, totalSpent, totalLeads, totalConversions,
          totalVisitors, totalTestDrives, totalFollowUps, totalBookings, totalDeliveries,
          totalSalesUnits, totalSalesValue, leadRate, bookingRate, deliveryRate, overallConversion

                  <StatCard title="Conversion รวม" value={metrics.overallConversion + '%'} icon="target" color="text-purple-600" bg="bg-purple-50" subtitle="ส่งมอบ ÷ ผู้เข้าชม" />

                  <StatCard title="Follow-up" value={metrics.totalFollowUps.toLocaleString()} icon="phone-call" color="text-orange-600" bg="bg-orange-50" />

                      <p className="text-2xl font-bold text-emerald-900">{metrics.overallConversion}%</p>
                      <div className="w-full bg-white/50 rounded-full h-2 mt-2 overflow-hidden">
                        <div className="h-full bg-emerald-500 progress-bar" style={{ width: `${Math.min(metrics.overallConversion * 10, 100)}%` }}></div>
                      </div>

            {activeTab === 'breakdown' && (

                {categoryBreakdown.length === 0 ? (

                    <table className="w-full text-sm">
                      <thead>
                        <tr className="bg-slate-50 border-b border-slate-200">
                          <th className="text-left p-2 font-semibold text-slate-700">กิจกรรม</th>
                          <th className="text-right p-2 font-semibold text-slate-700">โปรเจค</th>
                          <th className="text-right p-2 font-semibold text-slate-700">มุ่งหวัง</th>
                          <th className="text-right p-2 font-semibold text-slate-700">จอง</th>
                          <th className="text-right p-2 font-semibold text-slate-700">ส่งมอบ</th>
                          <th className="text-right p-2 font-semibold text-slate-700">Conversion</th>
                        </tr>
                      </thead>
                      <tbody>
                        {categoryBreakdown.map((cat) => {
                          const conv = cat.totalVisitors > 0 ? ((cat.totalDeliveries / cat.totalVisitors) * 100).toFixed(2) : '0.00';
                          return (
                            <tr key={cat.value} className="border-b border-slate-100 hover:bg-slate-50">
                              <td className="p-2 font-medium">{cat.emoji} {cat.label}</td>
                              <td className="text-right p-2">{cat.count}</td>
                              <td className="text-right p-2">{cat.totalLeads.toLocaleString()}</td>
                              <td className="text-right p-2">{cat.totalBookings.toLocaleString()}</td>
                              <td className="text-right p-2 font-semibold text-emerald-700">{cat.totalDeliveries.toLocaleString()}</td>
                              <td className="text-right p-2 font-bold text-indigo-700">{conv}%</td>
                            </tr>
                          );
                        })}
                        <tr className="bg-indigo-50 font-bold">
                          <td className="p-2">📊 รวมทั้งหมด</td>
                          <td className="text-right p-2">{categoryBreakdown.reduce((s, c) => s + c.count, 0)}</td>
                          <td className="text-right p-2">{categoryBreakdown.reduce((s, c) => s + c.totalLeads, 0).toLocaleString()}</td>
                          <td className="text-right p-2">{categoryBreakdown.reduce((s, c) => s + c.totalBookings, 0).toLocaleString()}</td>
                          <td className="text-right p-2 text-emerald-700">{categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0).toLocaleString()}</td>
                          <td className="text-right p-2 text-indigo-700">
                            {(() => {
                              const v = categoryBreakdown.reduce((s, c) => s + c.totalVisitors, 0);
                              const d = categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0);
                              return v > 0 ? ((d/v)*100).toFixed(2) + '%' : '0.00%';
                            })()}
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* 📋 PROJECTS TAB */}
            {activeTab === 'projects' && (
              <div className="fade-in">
                {/* Filters */}
                <div className="bg-white rounded-xl border border-slate-200 p-4 mb-4 shadow-sm">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">🔍 ค้นหา</label>
                      <input 
                        type="text" 
                        placeholder="ค้นหาชื่อโปรเจค..." 
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">📂 หมวดหมู่</label>
                      <select 
                        value={filterCategory} 
                        onChange={(e) => setFilterCategory(e.target.value)}
                        className="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white outline-none"
                      >
                        <option value="all">ทั้งหมด</option>
                        {categories.map(cat => (
                          <option key={cat.value} value={cat.value}>{cat.label}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">📊 สถานะ</label>
                      <select 
                        value={filterStatus} 
                        onChange={(e) => setFilterStatus(e.target.value)}
                        className="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white outline-none"
                      >
                        <option value="all">ทั้งหมด</option>
                        {statuses.map(st => (
                          <option key={st.value} value={st.value}>{st.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div className="mt-3 text-xs text-slate-500">
                    แสดง {filteredProjects.length} จาก {projects.length} โปรเจค
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                  {filteredProjects.length === 0 ? (
                    <div className="col-span-full bg-white rounded-xl border border-slate-200 p-12 text-center shadow-sm">
                      <p className="text-4xl mb-2">📭</p>
                      <p className="text-slate-500">ไม่พบโปรเจค</p>
                    </div>
                  ) : (
                    filteredProjects.map(p => {
                      const bookingRate = (p.leads || 0) > 0 ? (((p.bookings || 0) / (p.leads || 0)) * 100).toFixed(0) : 0;
                      const deliveryRate = (p.bookings || 0) > 0 ? (((p.deliveries || 0) / (p.bookings || 0)) * 100).toFixed(0) : 0;
                      const spentPercent = (p.budget || 0) > 0 ? (((p.spent || 0) / (p.budget || 0)) * 100).toFixed(0) : 0;

                      return (
                        <div key={p.id} className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition">
                          <div className="flex justify-between items-start mb-2">
                            <h4 className="font-bold text-slate-900 flex-1">{p.name}</h4>
                            {getStatusBadge(p.status)}
                          </div>
                          <p className="text-xs text-slate-500 mb-2">{getCategoryLabel(p.category)}</p>
                          <p className="text-xs text-slate-400 mb-3">📅 {formatDate(p.startDate)} - {formatDate(p.endDate)}</p>

                          {/* Funnel mini */}
                          <div className="grid grid-cols-4 gap-1 mb-3 p-2 bg-slate-50 rounded-lg">
                            <div className="text-center">
                              <p className="text-[9px] text-slate-500">มุ่งหวัง</p>
                              <p className="text-sm font-bold text-violet-700">{(p.leads || 0).toLocaleString()}</p>
                            </div>
                            <div className="text-center">
                              <p className="text-[9px] text-slate-500">จอง</p>
                              <p className="text-sm font-bold text-amber-700">{(p.bookings || 0).toLocaleString()}</p>
                              <p className="text-[9px] text-amber-600">{bookingRate}%</p>
                            </div>
                            <div className="text-center">
                              <p className="text-[9px] text-slate-500">ส่งมอบ</p>
                              <p className="text-sm font-bold text-emerald-700">{(p.deliveries || 0).toLocaleString()}</p>
                              <p className="text-[9px] text-emerald-600">{deliveryRate}%</p>
                            </div>
                            <div className="text-center">
                              <p className="text-[9px] text-slate-500">ขายได้</p>
                              <p className="text-sm font-bold text-green-700">{(p.salesUnits || 0).toLocaleString()}</p>
                            </div>
                          </div>

                          {/* Budget */}
                          <div className="mb-3">
                            <div className="flex justify-between text-[10px] text-slate-500 mb-1">
                              <span>💰 งบประมาณ</span>
                              <span className="font-medium">฿{(p.spent || 0).toLocaleString()} / ฿{(p.budget || 0).toLocaleString()}</span>
                            </div>
                            <div className="w-full bg-slate-200 rounded-full h-1.5 overflow-hidden">
                              <div 
                                className={`h-full progress-bar ${spentPercent > 90 ? 'bg-red-500' : spentPercent > 70 ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                style={{ width: `${Math.min(spentPercent, 100)}%` }}
                              ></div>
                            </div>
                          </div>

                          <div className="flex gap-2">
                            <button onClick={() => openModal(p)} className="flex-1 bg-indigo-50 text-indigo-700 py-1.5 rounded text-sm font-medium hover:bg-indigo-100">✏️ แก้ไข</button>
                            <button onClick={() => deleteProject(p.id)} className="flex-1 bg-red-50 text-red-600 py-1.5 rounded text-sm font-medium hover:bg-red-100">🗑️ ลบ</button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* 📅 CALENDAR TAB */}
            {activeTab === 'calendar' && (
              <div className="fade-in bg-white rounded-xl border border-slate-200 p-4">
                <CalendarComponent projects={projects} />
              </div>
            )}
          </div>

          {/* 🟢 MODAL เพิ่ม/แก้ไขโปรเจค */}
          {showModal && (
            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={closeModal}>
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                <h3 className="text-xl font-bold mb-4 text-slate-900">{editingProject ? '✏️ แก้ไขโปรเจค' : '➕ เพิ่มโปรเจคใหม่'}</h3>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อโปรเจค *</label>
                    <input type="text" placeholder="ระบุชื่อโปรเจค" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่</label>
                      <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white outline-none">
                        {categories.map(cat => (
                          <option key={cat.value} value={cat.value}>{cat.label}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">สถานะโปรเจค *</label>
                      <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm bg-white font-medium text-slate-700 outline-none">
                        {statuses.map(st => (
                          <option key={st.value} value={st.value}>{st.label}</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">วันที่เริ่มต้น *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">วันที่สิ้นสุด *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">งบประมาณ (บาท)</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 mb-1">ใช้ไปแล้ว (บาท)</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none" />
                    </div>
                  </div>

                  {/* 🎯 Sales Funnel Data */}
                  <div className="rounded-xl border border-indigo-100 bg-gradient-to-br from-indigo-50/50 to-violet-50/50 p-4 space-y-3">
                    <div>
                      <h4 className="font-bold text-indigo-900 flex items-center gap-2">
                        <span>🎯</span> Sales Funnel / เก็บข้อมูลลูกค้า
                      </h4>
                      <p className="text-xs text-slate-500 mt-1">บันทึกผลตั้งแต่ผู้เข้าชมจนส่งมอบรถ ระบบคำนวณ Conversion อัตโนมัติ</p>
                    </div>

                    {/* Funnel Preview */}
                    <div className="bg-white rounded-lg p-3 border border-indigo-200">
                      <p className="text-xs text-slate-500 mb-2 font-semibold">📊 Funnel Preview</p>
                      <div className="grid grid-cols-4 gap-2 text-center">
                        <div>
                          <p className="text-xs text-slate-500">เข้าชม</p>
                          <p className="text-sm font-bold text-slate-900">{parseInt(formData.visitors) || 0}</p>
                        </div>
                        <div className="border-l border-slate-200">
                          <p className="text-xs text-violet-600">มุ่งหวัง</p>
                          <p className="text-sm font-bold text-violet-700">{parseInt(formData.leads) || 0}</p>
                        </div>
                        <div className="border-l border-slate-200">
                          <p className="text-xs text-amber-600">จอง</p>
                          <p className="text-sm font-bold text-amber-700">{parseInt(formData.bookings) || 0}</p>
                        </div>
                        <div className="border-l border-slate-200">
                          <p className="text-xs text-emerald-600">ส่งมอบ</p>
                          <p className="text-sm font-bold text-emerald-700">{parseInt(formData.deliveries) || 0}</p>
                        </div>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">👥 ผู้เข้าชม</label>
                        <input type="number" min="0" placeholder="0" value={formData.visitors} onChange={(e) => setFormData({...formData, visitors: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">🎯 ลูกค้ามุ่งหวัง (Leads)</label>
                        <input type="number" min="0" placeholder="0" value={formData.leads} onChange={(e) => setFormData({...formData, leads: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">🚗 ทดลองขับ</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div className="bg-amber-50 border border-amber-200 rounded-lg p-1">
                        <label className="block text-xs font-semibold text-amber-700 mb-1 px-1">📝 ลูกค้าจอง (Bookings)</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="w-full border border-amber-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-1">
                        <label className="block text-xs font-semibold text-emerald-700 mb-1 px-1">🚚 ลูกค้าส่งมอบ (Deliveries)</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="w-full border border-emerald-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">📞 Follow-up</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">🚘 จำนวนรถที่ขายได้</label>
                        <input type="number" min="0" placeholder="0" value={formData.salesUnits} onChange={(e) => setFormData({...formData, salesUnits: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">💵 มูลค่าการขาย (บาท)</label>
                        <input type="number" min="0" step="0.01" placeholder="0" value={formData.salesValue} onChange={(e) => setFormData({...formData, salesValue: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none bg-white" />
                      </div>
                      <div className="rounded-lg bg-white border border-purple-200 p-3">
                        <div className="text-xs text-slate-500">📈 Conversion Rate</div>
                        <div className="text-xl font-bold text-purple-700">
                          {(Number(formData.visitors) || 0) > 0
                            ? (((Number(formData.deliveries) || 0) / (Number(formData.visitors) || 0)) * 100).toFixed(2)
                            : '0.00'}%
                        </div>
                        <div className="text-[11px] text-slate-400">ส่งมอบ ÷ ผู้เข้าชม × 100</div>
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">รายละเอียด</label>
                    <textarea rows="3" placeholder="ระบุรายละเอียดหรือเป้าหมายของโปรเจค" value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full border border-slate-300 p-2 rounded-lg text-sm outline-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button onClick={saveProject} className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold text-sm transition shadow-sm">
                      💾 บันทึกข้อมูล
                    </button>
                    <button onClick={closeModal} className="px-6 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
                      ยกเลิก
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
