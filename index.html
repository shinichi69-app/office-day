<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Manager Dashboard | Cyber Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- FullCalendar v6 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.9/locales/th.global.min.js"></script>

  <!-- Futuristic Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #05060f;
      color: #e0e7ff;
      overflow-x: hidden;
      position: relative;
    }

    /* ✨ Animated Grid Background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(6, 182, 212, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.08) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    /* 🌌 Cosmic Gradient Orbs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.08) 0%, transparent 60%);
      z-index: 0;
      pointer-events: none;
      animation: orbPulse 8s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(12px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* 🪟 Glass Card Base */
    .glass {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(30, 41, 59, 0.5) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      box-shadow: 
        0 8px 32px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    .glass-strong {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.75) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    /* ⚡ Neon Glow Effects */
    .neon-cyan { 
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4), 0 0 40px rgba(6, 182, 212, 0.2), inset 0 0 20px rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.5);
    }
    .neon-purple { 
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), 0 0 40px rgba(168, 85, 247, 0.2), inset 0 0 20px rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.5);
    }
    .neon-pink { 
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4), 0 0 40px rgba(236, 72, 153, 0.2);
      border: 1px solid rgba(236, 72, 153, 0.5);
    }
    .neon-green { 
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 40px rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
    }

    /* 🎯 Stat Card Hover */
    .stat-card-hover {
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform-style: preserve-3d;
    }
    .stat-card-hover::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, transparent 30%, rgba(6, 182, 212, 0.5), transparent 70%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
    }
    .stat-card-hover:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 40px -10px rgba(6, 182, 212, 0.3);
    }
    .stat-card-hover:hover::before { opacity: 1; }

    /* 🔢 Monospace Numbers */
    .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum"; }

    /* Toast */
    .toast { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideIn { 
      from { opacity: 0; transform: translateX(100%); } 
      to { opacity: 1; transform: translateX(0); } 
    }

    /* FullCalendar Dark Theme */
    .fc { 
      font-size: 0.85rem; 
      font-family: inherit;
      color: #e0e7ff;
    }
    .fc-theme-standard td, .fc-theme-standard th { border-color: rgba(148, 163, 184, 0.1); }
    .fc-theme-standard .fc-scrollgrid { border-color: rgba(148, 163, 184, 0.15); }
    .fc .fc-col-header-cell-cushion { color: #94a3b8; padding: 10px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
    .fc .fc-daygrid-day-number { color: #cbd5e1; padding: 8px; font-family: 'JetBrains Mono', monospace; }
    .fc .fc-day-today { background: rgba(6, 182, 212, 0.08) !important; }
    .fc .fc-button-primary {
      background: rgba(15, 23, 42, 0.8) !important;
      border: 1px solid rgba(148, 163, 184, 0.2) !important;
      color: #e0e7ff !important;
      backdrop-filter: blur(10px);
    }
    .fc .fc-button-primary:hover { background: rgba(6, 182, 212, 0.2) !important; border-color: rgba(6, 182, 212, 0.5) !important; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { 
      background: rgba(6, 182, 212, 0.3) !important; 
      border-color: rgba(6, 182, 212, 0.7) !important;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4) !important;
    }
    .fc-event { 
      cursor: pointer; 
      border-radius: 6px; 
      border: none !important;
      padding: 2px 6px;
      font-weight: 600;
      font-size: 11px;
      transition: transform 0.2s;
    }
    .fc-event:hover { transform: scale(1.05); box-shadow: 0 0 15px currentColor; }

    /* Modal Backdrop */
    .modal-backdrop { 
      backdrop-filter: blur(12px) saturate(180%); 
      background-color: rgba(2, 6, 23, 0.75); 
    }

    /* 🌊 Animated Progress Bar */
    .progress-bar { 
      transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, #06b6d4, #a855f7);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { 
      background: linear-gradient(180deg, #22d3ee, #c084fc);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
    }

    /* Funnel Connector */
    .funnel-connector { position: relative; }
    .funnel-connector::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -16px;
      transform: translateY(-50%);
      width: 24px; height: 2px;
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.8), transparent);
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      z-index: 10;
    }
    .funnel-connector::before {
      content: '';
      position: absolute;
      top: 50%;
      right: -20px;
      transform: translateY(-50%);
      width: 0; height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-left: 8px solid #06b6d4;
      filter: drop-shadow(0 0 5px #06b6d4);
      z-index: 11;
    }
    @media (max-width: 768px) {
      .funnel-connector::after, .funnel-connector::before { display: none; }
    }

    /* 🔥 Glitch text effect */
    .glitch {
      position: relative;
      display: inline-block;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch::before {
      animation: glitch-1 3s infinite linear alternate-reverse;
      color: #06b6d4;
      z-index: -1;
    }
    .glitch::after {
      animation: glitch-2 2s infinite linear alternate-reverse;
      color: #ec4899;
      z-index: -2;
    }
    @keyframes glitch-1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }
    @keyframes glitch-2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(2px, -2px); }
      40% { transform: translate(2px, 2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(-2px, 2px); }
    }

    /* 🌟 Pulse dot */
    .pulse-dot {
      position: relative;
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid currentColor;
      opacity: 0;
      animation: pulse-ring 2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    /* Tab active underline */
    .tab-active-underline {
      position: relative;
    }
    .tab-active-underline::after {
      content: '';
      position: absolute;
      left: 20%; right: 20%;
      bottom: -2px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #06b6d4, #a855f7, transparent);
      box-shadow: 0 0 10px #06b6d4;
    }

    /* Floating particles */
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30px, -30px) rotate(120deg); }
      66% { transform: translate(-20px, 20px) rotate(240deg); }
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Scanline effect */
    .scanline::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(6, 182, 212, 0.03) 2px,
        rgba(6, 182, 212, 0.03) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Neon text */
    .neon-text-cyan { color: #22d3ee; text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 20px rgba(34, 211, 238, 0.4); }
    .neon-text-purple { color: #c084fc; text-shadow: 0 0 10px rgba(192, 132, 252, 0.8), 0 0 20px rgba(192, 132, 252, 0.4); }
    .neon-text-pink { color: #f472b6; text-shadow: 0 0 10px rgba(244, 114, 182, 0.8); }
    .neon-text-green { color: #34d399; text-shadow: 0 0 10px rgba(52, 211, 153, 0.8); }

    /* Input styling */
    .cyber-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #e0e7ff;
      transition: all 0.3s;
    }
    .cyber-input:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2), 0 0 20px rgba(6, 182, 212, 0.3);
      background: rgba(15, 23, 42, 0.9);
    }
    .cyber-input::placeholder { color: #475569; }

    /* Cyber Button */
    .cyber-btn-primary {
      position: relative;
      background: linear-gradient(135deg, #0891b2 0%, #6366f1 50%, #a855f7 100%);
      color: white;
      font-weight: 700;
      overflow: hidden;
      transition: all 0.3s;
    }
    .cyber-btn-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cyber-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5), 0 0 40px rgba(6, 182, 212, 0.3);
    }
    .cyber-btn-primary:hover::before { opacity: 1; }
    .cyber-btn-primary > * { position: relative; z-index: 1; }

    .cyber-btn-ghost {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      transition: all 0.3s;
    }
    .cyber-btn-ghost:hover {
      border-color: rgba(6, 182, 212, 0.5);
      background: rgba(6, 182, 212, 0.1);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
    }

    /* Card glow borders */
    .card-glow {
      position: relative;
      isolation: isolate;
    }
    .card-glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, 
        rgba(6, 182, 212, 0.6),
        rgba(168, 85, 247, 0.3),
        rgba(236, 72, 153, 0.3),
        rgba(6, 182, 212, 0.6));
      background-size: 300% 300%;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: borderRotate 8s linear infinite;
      z-index: -1;
    }
    @keyframes borderRotate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Logo animation */
    @keyframes logoRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .logo-ring {
      animation: logoRotate 20s linear infinite;
    }

    /* Hover lift for cards */
    .card-lift {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-lift:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(6, 182, 212, 0.25);
    }

    /* Header styling */
    .header-glass {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.65) 100%);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(6, 182, 212, 0.15);
    }

    /* Status dot animations */
    .status-dot {
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px currentColor; }
      50% { opacity: 0.5; box-shadow: 0 0 5px currentColor; }
    }
  </style>
</head>
<body class="antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ============================================================
    // 🔥 FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyALhqvQGSPR2OtWG4-yuAeBVeo103mLHeE",
      authDomain: "mkt-project-f818a.firebaseapp.com",
      projectId: "mkt-project-f818a",
      storageBucket: "mkt-project-f818a.firebasestorage.app",
      messagingSenderId: "1076626422079",
      appId: "1:1076626422079:web:31d3849f6af7ae76213b8a",
      measurementId: "G-LQFMH7X9WH"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    
    const db = firebase.firestore();
    const auth = firebase.auth();

    const parseDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal.toDate && typeof dateVal.toDate === 'function') return dateVal.toDate();
      if (dateVal.seconds) return new Date(dateVal.seconds * 1000);
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? null : d;
    };

    // ============================================================
    // 📦 FIRESTORE SERVICE
    // ============================================================
    const FirebaseService = {
      subscribeProjects(callback) {
        return db.collection('projects').orderBy('startDate', 'desc').onSnapshot((snapshot) => {
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ 
              id: doc.id, 
              ...data,
              startDate: parseDate(data.startDate),
              endDate: parseDate(data.endDate)
            });
          });
          callback(projects);
        }, (error) => console.error('Subscription error:', error));
      },
      async addProject(projectData) {
        const docRef = await db.collection('projects').add({
          ...projectData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id: docRef.id, ...projectData };
      },
      async updateProject(id, projectData) {
        await db.collection('projects').doc(id).update({
          ...projectData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id, ...projectData };
      },
      async deleteProject(id) {
        await db.collection('projects').doc(id).delete();
      }
    };

    // ============================================================
    // 🔐 LOGIN COMPONENT (Cyberpunk Style)
    // ============================================================
    function LoginComponent() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          let msg = 'เกิดข้อผิดพลาด';
          if (err.code === 'auth/user-not-found') msg = 'ไม่พบบัญชีผู้ใช้นี้';
          else if (err.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (err.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้งานแล้ว';
          else if (err.code === 'auth/weak-password') msg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
          {/* Animated Particles */}
          {[...Array(20)].map((_, i) => (
            <div key={i} className="particle" style={{
              width: Math.random() * 4 + 2 + 'px',
              height: Math.random() * 4 + 2 + 'px',
              background: i % 3 === 0 ? '#06b6d4' : i % 3 === 1 ? '#a855f7' : '#ec4899',
              boxShadow: `0 0 10px currentColor`,
              top: Math.random() * 100 + '%',
              left: Math.random() * 100 + '%',
              animation: `float ${Math.random() * 20 + 15}s linear infinite`,
              animationDelay: `-${Math.random() * 20}s`
            }} />
          ))}

          <div className="glass-strong w-full max-w-md rounded-2xl overflow-hidden fade-in relative scanline card-glow">
            <div className="p-8 relative z-10">
              <div className="text-center mb-8">
                {/* Logo */}
                <div className="relative inline-block mb-6">
                  <div className="absolute inset-0 rounded-full bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 opacity-50 blur-xl animate-pulse"></div>
                  <div className="relative inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-br from-cyan-500 via-purple-600 to-pink-600 shadow-2xl">
                    <div className="absolute inset-1 rounded-full bg-slate-900 flex items-center justify-center">
                      <i data-lucide="car" className="w-8 h-8 text-cyan-400" style={{filter: 'drop-shadow(0 0 8px #22d3ee)'}}></i>
                    </div>
                  </div>
                </div>
                <h1 className="text-3xl font-bold mb-2">
                  <span className="neon-text-cyan glitch" data-text="MARKETING">MARKETING</span>
                  <span className="text-slate-400 mx-2">/</span>
                  <span className="neon-text-purple glitch" data-text="MANAGER">MANAGER</span>
                </h1>
                <p className="text-xs text-slate-400 uppercase tracking-[0.3em] mono">
                  ▸ CYBER COMMAND CENTER ◂
                </p>
                <p className="text-sm text-slate-500 mt-3">
                  {isRegister ? 'สร้างบัญชีสำหรับทีมการตลาด' : 'เข้าสู่ระบบเพื่อจัดการแคมเปญ'}
                </p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-[10px] font-bold text-cyan-400 mb-2 uppercase tracking-[0.2em] mono">◆ อีเมล</label>

        { label: 'ทดลองขับ', sub: 'TEST DRIVES', value: data.testDrives, icon: 'car', gradient: 'from-cyan-500 to-blue-600', accent: 'cyan', border: 'neon-cyan' },
        { label: 'จองรถ', sub: 'BOOKINGS', value: data.bookings, icon: 'calendar-check', gradient: 'from-purple-500 to-pink-600', accent: 'purple', border: 'neon-purple' },
        { label: 'ส่งมอบรถ', sub: 'DELIVERIES', value: data.deliveries, icon: 'key', gradient: 'from-emerald-500 to-teal-600', accent: 'green', border: 'neon-green' }

                      <div>
                        <span className="text-xs font-bold text-white block">{step.label}</span>
                        <span className="text-[10px] text-slate-400 font-bold mono tracking-wider">{step.sub}</span>
                      </div>

                    <div className="text-4xl font-extrabold text-white tracking-tight mono">
                      {(step.value || 0).toLocaleString()}
                    </div>
                    <div className="text-[10px] text-slate-500 mono mt-1">UNITS</div>

                    <div className="mt-4 pt-4 border-t border-slate-700/50">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-[10px] font-semibold text-slate-400 mono uppercase tracking-wider">Conversion</span>

    // ============================================================
    // 📅 CALENDAR COMPONENT
    // ============================================================
    function CalendarComponent({ projects }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;
        const events = projects.filter(p => p.startDate && p.endDate).map(p => {
          const startD = parseDate(p.startDate);
          const endD = parseDate(p.endDate);
          const adjustedEnd = new Date(endD);
          adjustedEnd.setDate(adjustedEnd.getDate() + 1);
          return {
            id: p.id, title: p.name,
            start: startD.toISOString().split('T')[0],
            end: adjustedEnd.toISOString().split('T')[0],
            backgroundColor: p.status === 'completed' ? '#0891b2' : p.status === 'active' ? '#10b981' : p.status === 'paused' ? '#f59e0b' : p.status === 'cancelled' ? '#ef4444' : '#64748b',
            borderColor: 'transparent', textColor: '#ffffff'
          };
        });

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth', locale: 'th',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          events: events,
          eventClick: function(info) {
            const p = projects.find(proj => proj.id === info.event.id);
            if (p) {
              const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
              const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
              const inquiries = p.inquiries || 0;
              const testDrives = p.testDrives || 0;
              const bookings = p.bookings || 0;
              const deliveries = p.deliveries || 0;
              const pct = (v) => inquiries > 0 ? ((v / inquiries) * 100).toFixed(2) + '%' : '0.00%';
              alert(`🚗 ${p.name}\n\n📅 ${startStr} - ${endStr}\n📂 หมวดหมู่: ${p.category || 'ไม่ระบุ'}\n📊 สถานะ: ${p.status || 'planning'}\n💰 งบประมาณ: ${(p.budget || 0).toLocaleString()} บาท\n💸 ใช้ไป: ${(p.spent || 0).toLocaleString()} บาท\n\n--- Automotive Funnel ---\n👥 ผู้สนใจ: ${inquiries.toLocaleString()} (100%)\n🚗 ทดลองขับ: ${testDrives.toLocaleString()} (${pct(testDrives)})\n📝 จองรถ: ${bookings.toLocaleString()} (${pct(bookings)})\n🔑 ส่งมอบ: ${deliveries.toLocaleString()} (${pct(deliveries)})\n\n📈 Overall: ${pct(deliveries)}\n\n📝 ${p.description || 'ไม่มีรายละเอียด'}`);
            }
          }
        });
        calendar.render();
        return () => calendar.destroy();
      }, [projects]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          <div className="mt-6 flex flex-wrap gap-3 justify-center items-center text-xs border-t border-slate-700/50 pt-4">
            <span className="flex items-center gap-2 font-semibold px-3 py-1.5 rounded-lg glass text-slate-300 mono">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 status-dot" style={{color: '#10b981'}}></span>ACTIVE
            </span>
            <span className="flex items-center gap-2 font-semibold px-3 py-1.5 rounded-lg glass text-slate-300 mono">
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-500 status-dot" style={{color: '#06b6d4'}}></span>COMPLETED
            </span>
            <span className="flex items-center gap-2 font-semibold px-3 py-1.5 rounded-lg glass text-slate-300 mono">
              <span className="w-2.5 h-2.5 rounded-full bg-amber-500 status-dot" style={{color: '#f59e0b'}}></span>PAUSED
            </span>
            <span className="flex items-center gap-2 font-semibold px-3 py-1.5 rounded-lg glass text-slate-300 mono">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500 status-dot" style={{color: '#ef4444'}}></span>CANCELLED
            </span>
          </div>
        </div>
      );
    }

    // ============================================================
    // 🎯 MAIN APP
    // ============================================================
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [dashboardFilter, setDashboardFilter] = useState('all');

      const [formData, setFormData] = useState({
        name: '', description: '', category: 'digital', budget: '', spent: '',
        inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
        status: 'planning', startDate: '', endDate: '', team: '', platform: '', target: ''
      });

      const categories = [
        { value: 'digital', label: 'Digital Lead Gen', emoji: '📱' },
        { value: 'motorshow', label: 'Motor Show', emoji: '🏢' },
        { value: 'testdrive', label: 'Test Drive', emoji: '🚗' },
        { value: 'dealer', label: 'Dealer / Roadshow', emoji: '🏪' },
        { value: 'service', label: 'Service Campaign', emoji: '🔧' },
        { value: 'crm', label: 'CRM', emoji: '🤝' },
        { value: 'other', label: 'อื่นๆ', emoji: '📌' }
      ];

      const statuses = [
        { value: 'planning', label: 'Planning' },
        { value: 'active', label: 'Active' },
        { value: 'paused', label: 'Paused' },
        { value: 'completed', label: 'Completed' },
        { value: 'cancelled', label: 'Cancelled' }
      ];

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetForm = () => {
        setFormData({
          name: '', description: '', category: 'digital', budget: '', spent: '',
          inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
          status: 'planning', startDate: '', endDate: '', team: '', platform: '', target: ''
        });
        setEditingProject(null);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubscribe = FirebaseService.subscribeProjects((data) => {
          setProjects(data);
          setTimeout(() => lucide.createIcons(), 100);
        });
        return () => unsubscribe();
      }, [user]);

      useEffect(() => {
        lucide.createIcons();
      });

      const handleLogout = async () => {
        await auth.signOut();
        showToast('ออกจากระบบสำเร็จ', 'success');
      };

      const openModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          const sDate = parseDate(project.startDate);
          const eDate = parseDate(project.endDate);
          setFormData({
            name: project.name || '', description: project.description || '', category: project.category || 'digital',
            budget: project.budget || '', spent: project.spent || '', 
            inquiries: project.inquiries || '', testDrives: project.testDrives || '', 
            bookings: project.bookings || '', deliveries: project.deliveries || '', followUps: project.followUps || '',
            status: project.status || 'planning',
            startDate: sDate ? sDate.toISOString().split('T')[0] : '',
            endDate: eDate ? eDate.toISOString().split('T')[0] : '',
            team: project.team || '', platform: project.platform || '', target: project.target || ''
          });
        } else {
          resetForm();
        }
        setShowModal(true);
      };

      const saveProject = async () => {
        if (!formData.name || !formData.startDate || !formData.endDate) {
          showToast('กรุณากรอกชื่อแคมเปญ และวันที่เริ่มต้น-สิ้นสุด', 'error');
          return;
        }
        if (new Date(formData.startDate) > new Date(formData.endDate)) {
          showToast('วันที่เริ่มต้นต้องน้อยกว่าวันที่สิ้นสุด', 'error');
          return;
        }

        const dataToSave = {
          name: formData.name, description: formData.description || '', category: formData.category,
          budget: parseInt(formData.budget) || 0, spent: parseInt(formData.spent) || 0,
          inquiries: parseInt(formData.inquiries) || 0, testDrives: parseInt(formData.testDrives) || 0,
          bookings: parseInt(formData.bookings) || 0, deliveries: parseInt(formData.deliveries) || 0,
          followUps: parseInt(formData.followUps) || 0, status: formData.status,
          startDate: new Date(formData.startDate), endDate: new Date(formData.endDate),
          team: formData.team || '', platform: formData.platform || '', target: formData.target || ''
        };

        try {
          if (editingProject) await FirebaseService.updateProject(editingProject.id, dataToSave);
          else await FirebaseService.addProject(dataToSave);
          showToast(editingProject ? 'อัปเดตแคมเปญสำเร็จ' : 'สร้างแคมเปญใหม่สำเร็จ', 'success');
          setShowModal(false);
          resetForm();
        } catch (error) {
          showToast('เกิดข้อผิดพลาด: ' + error.message, 'error');
        }
      };

      const deleteProject = async (id) => {
        if (!confirm('คุณแน่ใจว่าต้องการลบแคมเปญนี้?')) return;
        try {
          await FirebaseService.deleteProject(id);
          showToast('ลบแคมเปญเรียบร้อย', 'success');
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการลบ', 'error');
        }
      };

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (searchTerm) result = result.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.description?.toLowerCase().includes(searchTerm.toLowerCase()));
        if (filterCategory !== 'all') result = result.filter(p => p.category === filterCategory);
        if (filterStatus !== 'all') result = result.filter(p => p.status === filterStatus);
        return result;
      }, [projects, searchTerm, filterCategory, filterStatus]);

      const dashboardProjects = useMemo(() => {
        if (dashboardFilter === 'all') return projects;
        if (dashboardFilter === 'active') return projects.filter(p => p.status === 'active');
        if (dashboardFilter === 'completed') return projects.filter(p => p.status === 'completed');
        return projects.filter(p => p.category === dashboardFilter);
      }, [projects, dashboardFilter]);

      const metrics = useMemo(() => {
        const total = dashboardProjects.length;
        const active = dashboardProjects.filter(p => p.status === 'active').length;
        const completed = dashboardProjects.filter(p => p.status === 'completed').length;
        const totalBudget = dashboardProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const totalSpent = dashboardProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        const totalInquiries = dashboardProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0);
        const totalTestDrives = dashboardProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0);
        const totalBookings = dashboardProjects.reduce((sum, p) => sum + (p.bookings || 0), 0);
        const totalDeliveries = dashboardProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0);
        const totalFollowUps = dashboardProjects.reduce((sum, p) => sum + (p.followUps || 0), 0);
        
        const testDriveRate = totalInquiries > 0 ? ((totalTestDrives / totalInquiries) * 100).toFixed(1) : 0;
        const bookingRate = totalInquiries > 0 ? ((totalBookings / totalInquiries) * 100).toFixed(1) : 0;
        const deliveryRate = totalInquiries > 0 ? ((totalDeliveries / totalInquiries) * 100).toFixed(2) : 0;
        const overallConversion = totalInquiries > 0 ? ((totalDeliveries / totalInquiries) * 100).toFixed(2) : 0;
        const cpl = totalInquiries > 0 ? (totalSpent / totalInquiries).toFixed(0) : 0;
        
        return { total, active, completed, totalBudget, totalSpent, totalInquiries, totalTestDrives, totalBookings, totalDeliveries, totalFollowUps, testDriveRate, bookingRate, deliveryRate, overallConversion, cpl };
      }, [dashboardProjects]);

      const categoryBreakdown = useMemo(() => {
        const breakdown = {};
        categories.forEach(cat => {
          const catProjects = projects.filter(p => p.category === cat.value);
          if (catProjects.length > 0) {
            breakdown[cat.value] = {
              ...cat, count: catProjects.length,
              totalBudget: catProjects.reduce((sum, p) => sum + (p.budget || 0), 0),
              totalSpent: catProjects.reduce((sum, p) => sum + (p.spent || 0), 0),
              totalInquiries: catProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0),
              totalTestDrives: catProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0),
              totalBookings: catProjects.reduce((sum, p) => sum + (p.bookings || 0), 0),
              totalDeliveries: catProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0)
            };
          }
        });
        return Object.values(breakdown);
      }, [projects]);

      const getStatusBadge = (status) => {
        const map = {
          planning: { label: 'PLANNING', color: 'bg-slate-700/50 text-slate-300 border-slate-500/30' },
          active: { label: 'ACTIVE', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', glow: true },
          paused: { label: 'PAUSED', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
          completed: { label: 'COMPLETED', color: 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30' },
          cancelled: { label: 'CANCELLED', color: 'bg-red-500/20 text-red-400 border-red-500/30' }
        };
        const s = map[status] || map.planning;
        return <span className={`px-3 py-1 rounded-md text-[10px] font-extrabold uppercase tracking-widest mono border ${s.color}`}>{s.label}</span>;
      };

      const formatDate = (date) => {
        const d = parseDate(date);
        if (!d) return '-';
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

                    <div>
                      <label className="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2 mono">◆ START DATE *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="w-full cyber-input p-3 rounded-lg text-sm outline-none" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2 mono">◆ END DATE *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="w-full cyber-input p-3 rounded-lg text-sm outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2 mono">◆ BUDGET (THB)</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="w-full cyber-input p-3 rounded-lg text-sm outline-none mono" />
                    </div>
                    <div>
                      <label className="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2 mono">◆ SPENT (THB)</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="w-full cyber-input p-3 rounded-lg text-sm outline-none mono" />
                    </div>
                  </div>

                  {/* Funnel Data */}
                  <div className="rounded-xl p-5 space-y-4 relative overflow-hidden" style={{background: 'linear-gradient(135deg, rgba(6, 182, 212, 0.08) 0%, rgba(168, 85, 247, 0.08) 100%)', border: '1px solid rgba(6, 182, 212, 0.2)'}}>
                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500"></div>
                    <div>
                      <h4 className="font-bold text-cyan-300 flex items-center gap-2 text-xs uppercase tracking-[0.2em] mono">
                        <i data-lucide="target" className="w-4 h-4"></i> ◆ SALES FUNNEL DATA
                      </h4>
                      <p className="text-xs text-slate-400 mt-1">All percentages calculated against <span className="text-cyan-400 font-bold">"INQUIRIES"</span> as baseline</p>
                    </div>

                    {/* Funnel Preview */}
                    {(() => {
                      const inq = parseInt(formData.inquiries) || 0;
                      const td = parseInt(formData.testDrives) || 0;
                      const bk = parseInt(formData.bookings) || 0;
                      const dl = parseInt(formData.deliveries) || 0;
                      const pct = (v) => inq > 0 ? ((v / inq) * 100).toFixed(1) + '%' : '0.0%';
                      return (
                        <div className="glass rounded-lg p-4">
                          <p className="text-[10px] text-cyan-400 mb-3 font-bold uppercase tracking-widest mono">◆ LIVE PREVIEW</p>
                          <div className="grid grid-cols-4 gap-2 text-center">
                            <div className="p-2 rounded-lg bg-slate-900/60 border border-slate-700/50">
                              <p className="text-[9px] text-slate-400 font-bold uppercase mono">INQ</p>
                              <p className="text-lg font-extrabold text-white mono">{inq}</p>
                              <p className="text-[10px] text-slate-500 mono font-bold">100%</p>
                            </div>
                            <div className="p-2 rounded-lg bg-cyan-500/10 border border-cyan-500/30">
                              <p className="text-[9px] text-cyan-300 font-bold uppercase mono">TEST</p>
                              <p className="text-lg font-extrabold text-cyan-300 mono">{td}</p>
                              <p className="text-[10px] text-cyan-400 mono font-bold">{pct(td)}</p>
                            </div>
                            <div className="p-2 rounded-lg bg-purple-500/10 border border-purple-500/30">
                              <p className="text-[9px] text-purple-300 font-bold uppercase mono">BOOK</p>
                              <p className="text-lg font-extrabold text-purple-300 mono">{bk}</p>
                              <p className="text-[10px] text-purple-400 mono font-bold">{pct(bk)}</p>
                            </div>
                            <div className="p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30">
                              <p className="text-[9px] text-emerald-300 font-bold uppercase mono">DELR</p>
                              <p className="text-lg font-extrabold text-emerald-300 mono">{dl}</p>
                              <p className="text-[10px] text-emerald-400 mono font-bold">{pct(dl)}</p>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 mono">◆ INQUIRIES</label>
                        <input type="number" min="0" placeholder="0" value={formData.inquiries} onChange={(e) => setFormData({...formData, inquiries: e.target.value})} className="w-full cyber-input p-2.5 rounded-lg text-sm outline-none mono" />
                      </div>
                      <div className="bg-cyan-500/5 border border-cyan-500/20 rounded-lg p-2">
                        <label className="block text-[10px] font-bold text-cyan-300 uppercase tracking-widest mb-2 mono">◆ TEST DRIVES</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="w-full cyber-input p-2 rounded-lg text-sm outline-none mono" />
                      </div>
                      <div className="bg-purple-500/5 border border-purple-500/20 rounded-lg p-2">
                        <label className="block text-[10px] font-bold text-purple-300 uppercase tracking-widest mb-2 mono">◆ BOOKINGS</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="w-full cyber-input p-2 rounded-lg text-sm outline-none mono" />
                      </div>
                      <div className="bg-emerald-500/5 border border-emerald-500/20 rounded-lg p-2">
                        <label className="block text-[10px] font-bold text-emerald-300 uppercase tracking-widest mb-2 mono">◆ DELIVERIES</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="w-full cyber-input p-2 rounded-lg text-sm outline-none mono" />
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 mono">◆ FOLLOW-UP</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="w-full cyber-input p-2.5 rounded-lg text-sm outline-none mono" />
                      </div>
                    </div>

                    <div className="rounded-xl p-5 relative overflow-hidden" style={{background: 'linear-gradient(135deg, #0891b2 0%, #7c3aed 50%, #db2777 100%)', boxShadow: '0 0 40px rgba(168, 85, 247, 0.4)'}}>
                      <div className="text-[10px] font-bold text-cyan-100 uppercase tracking-[0.2em] mono mb-2">◆ OVERALL CONVERSION</div>
                      <div className="text-4xl font-extrabold text-white tracking-tight mono" style={{textShadow: '0 0 20px rgba(255,255,255,0.8)'}}>
                        {(Number(formData.inquiries) || 0) > 0 ? (((Number(formData.deliveries) || 0) / (Number(formData.inquiries) || 0)) * 100).toFixed(2) : '0.00'}%
                      </div>
                      <div className="text-[10px] text-cyan-100 mt-1 mono tracking-wider">DELIVERIES ÷ INQUIRIES × 100</div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold text-cyan-400 uppercase tracking-widest mb-2 mono">◆ NOTES</label>
                    <textarea rows="3" placeholder="Target audience, vehicle models, campaign goals..." value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="w-full cyber-input p-3 rounded-lg text-sm outline-none resize-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-slate-700/50">
                    <button onClick={saveProject} className="flex-1 cyber-btn-primary py-3 rounded-lg text-sm flex items-center justify-center gap-2">
                      <i data-lucide="save" className="w-4 h-4"></i> <span className="mono tracking-wider">◆ DEPLOY DATA</span>
                    </button>
                    <button onClick={() => setShowModal(false)} className="px-6 cyber-btn-ghost rounded-lg text-sm font-bold mono tracking-wider">
                      ABORT
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
