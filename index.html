<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดสรรงาน</title>
</head>
<body>
    <h2>เพิ่มงานใหม่</h2>
    <input type="text" id="taskName" placeholder="ชื่องาน" required>
    <input type="datetime-local" id="taskDateTime" required>
    <button onclick="addTask()">บันทึกและตั้งเตือน</button>

    <script>
        const publicVapidKey = 'YOUR_PUBLIC_VAPID_KEY'; // คีย์เดียวกับ Backend

        // ลงทะเบียน Service Worker และขอสิทธิ์
        async function setupPushNotifications() {
            if ('serviceWorker' in navigator) {
                const register = await navigator.serviceWorker.register('/sw.js');
                const subscription = await register.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: publicVapidKey
                });
                
                // ส่ง Subscription ไปเก็บที่ Backend
                await fetch('/subscribe', {
                    method: 'POST',
                    body: JSON.stringify(subscription),
                    headers: { 'Content-Type': 'application/json' }
                });
            }
        }
        setupPushNotifications();

        // ส่งงานไปที่ Backend
        async function addTask() {
            const task = document.getElementById('taskName').value;
            const dateTime = document.getElementById('taskDateTime').value;

            await fetch('/add-task', {
                method: 'POST',
                body: JSON.stringify({ task, dateTime }),
                headers: { 'Content-Type': 'application/json' }
            });
            alert('บันทึกงานเรียบร้อย ระบบจะแจ้งเตือนเมื่อถึงเวลา');
        }
    </script>
</body>
</html>
