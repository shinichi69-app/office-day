<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการการตลาด // Terminal v4.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.9/locales/th.global.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090b;
      --surface: #12121a;
      --surface-2: #1a1a25;
      --border: #27273a;
      --border-light: #3f3f56;
      --text: #fafafa;
      --text-dim: #a1a1aa;
      --text-faint: #71717a;
    }

    * { box-sizing: border-box; }

    html, body {
      font-family: 'Prompt', 'JetBrains Mono', 'SF Mono', Monaco, monospace;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    body {
      background-image: 
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .cursor {
      display: inline-block;
      background: var(--text);
      width: 9px;
      height: 1.1em;
      vertical-align: text-bottom;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .card:hover { border-color: var(--border-light); }
    .card-hover:hover {
      border-color: var(--text-dim);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    .btn-primary {
      background: #fafafa;
      color: #09090b;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn-primary:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-light);
      transition: all 0.15s;
    }
    .btn-ghost:hover {
      background: var(--surface-2);
      border-color: var(--text);
    }
    .btn-danger {
      background: transparent;
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }

    .input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      width: 100%;
      transition: all 0.15s;
    }
    .input:focus {
      border-color: #8b5cf6;
      background: var(--bg);
    }
    .input::placeholder { color: var(--text-faint); }
    select.input option { background: var(--surface); color: var(--text); }

    .progress-track {
      background: var(--surface-2);
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--text-dim);
    }

    .badge {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border: 1px solid;
      border-radius: 4px;
      display: inline-block;
    }
    .badge-active { color: #10b981; border-color: rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.1); }
    .badge-planning { color: #a1a1aa; border-color: rgba(161, 161, 170, 0.3); background: rgba(161, 161, 170, 0.1); }
    .badge-completed { color: #fafafa; border-color: rgba(250, 250, 250, 0.3); background: rgba(250, 250, 250, 0.1); }
    .badge-cancelled { color: #ef4444; border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); }

    .tab {
      padding: 12px 20px;
      color: var(--text-faint);
      border-bottom: 2px solid transparent;
      font-weight: 500;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text-dim); }
    .tab-active {
      color: #fafafa;
      border-bottom-color: #8b5cf6;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    .fc { font-size: 13px; font-family: 'Prompt', monospace; color: var(--text); }
    .fc-theme-standard td, .fc-theme-standard th { border-color: var(--border); }
    .fc-theme-standard .fc-scrollgrid { border-color: var(--border); background: var(--surface); }
    .fc .fc-col-header-cell { background: var(--surface-2); }
    .fc .fc-col-header-cell-cushion { color: var(--text-dim); padding: 12px; font-weight: 600; font-size: 12px; }
    .fc .fc-daygrid-day-number { color: var(--text); padding: 8px; font-size: 14px; }
    .fc .fc-day-today { background: rgba(139, 92, 246, 0.08) !important; }
    .fc .fc-day-other { opacity: 0.35; }
    .fc .fc-button-primary {
      background: var(--surface-2) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
    }
    .fc .fc-button-primary:hover { background: var(--border) !important; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { 
      background: #8b5cf6 !important; 
      color: #fff !important;
      border-color: #8b5cf6 !important;
    }
    .fc-event { 
      cursor: pointer; 
      border: none !important;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      font-weight: 500;
    }

    .modal-backdrop { 
      backdrop-filter: blur(8px);
      background-color: rgba(0, 0, 0, 0.85); 
    }

    .toast { animation: slideIn 0.3s ease; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      position: relative;
    }
    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .divider { height: 1px; background: var(--border); }
    
    .hover-arrow { position: relative; }
    .hover-arrow::after {
      content: '→';
      margin-left: 4px;
      opacity: 0;
      transition: all 0.15s;
    }
    .hover-arrow:hover::after { opacity: 1; margin-left: 8px; }

    /* New Dashboard Styles */
    .donut-segment {
      transition: all 0.3s;
    }
    .donut-segment:hover {
      opacity: 0.8;
      cursor: pointer;
    }

    .chart-bar {
      transition: all 0.3s;
    }
    .chart-bar:hover {
      opacity: 0.85;
    }

    .timeline-item {
      position: relative;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 24px;
      bottom: -8px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item:last-child::before {
      display: none;
    }

    .metric-trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .trend-up {
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }
    .trend-down {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }
    .trend-neutral {
      color: #a1a1aa;
      background: rgba(161, 161, 170, 0.1);
    }

    .heatmap-cell {
      aspect-ratio: 1;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .heatmap-cell:hover {
      transform: scale(1.2);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyALhqvQGSPR2OtWG4-yuAeBVeo103mLHeE",
      authDomain: "mkt-project-f818a.firebaseapp.com",
      projectId: "mkt-project-f818a",
      storageBucket: "mkt-project-f818a.firebasestorage.app",
      messagingSenderId: "1076626422079",
      appId: "1:1076626422079:web:31d3849f6af7ae76213b8a",
      measurementId: "G-LQFMH7X9WH"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const parseDate = (dateVal) => {
      if (!dateVal) return null;
      if (dateVal.toDate && typeof dateVal.toDate === 'function') return dateVal.toDate();
      if (dateVal.seconds) return new Date(dateVal.seconds * 1000);
      const d = new Date(dateVal);
      return isNaN(d.getTime()) ? null : d;
    };

    const PLATFORMS = [
      { value: 'facebook', label: 'Facebook', badge: 'text-blue-400 border-blue-400/30 bg-blue-400/10' },
      { value: 'tiktok', label: 'TikTok', badge: 'text-pink-400 border-pink-400/30 bg-pink-400/10' },
      { value: 'line', label: 'Line OA', badge: 'text-emerald-400 border-emerald-400/30 bg-emerald-400/10' },
      { value: 'website', label: 'Website', badge: 'text-violet-400 border-violet-400/30 bg-violet-400/10' },
      { value: 'other', label: 'อื่นๆ', badge: 'text-gray-400 border-gray-400/30 bg-gray-400/10' }
    ];

    const STATUSES_ONLINE = [
      { value: 'planned', label: 'วางแผน' },
      { value: 'live', label: 'กำลังจัด' },
      { value: 'completed', label: 'เสร็จสิ้น' }
    ];

    const FirebaseService = {
      subscribeProjects(callback) {
        return db.collection('projects').orderBy('startDate', 'desc').onSnapshot((snapshot) => {
          const projects = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            projects.push({ id: doc.id, ...data, startDate: parseDate(data.startDate), endDate: parseDate(data.endDate) });
          });
          callback(projects);
        });
      },
      async addProject(projectData) {
        const docRef = await db.collection('projects').add({
          ...projectData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id: docRef.id, ...projectData };
      },
      async updateProject(id, projectData) {
        await db.collection('projects').doc(id).update({
          ...projectData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id, ...projectData };
      },
      async deleteProject(id) {
        await db.collection('projects').doc(id).delete();
      }
    };

    // ═══ LOGIN ═══
    function LoginComponent() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegister, setIsRegister] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');
        try {
          if (isRegister) await auth.createUserWithEmailAndPassword(email, password);
          else await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          let msg = 'เกิดข้อผิดพลาด';
          if (err.code === 'auth/user-not-found') msg = 'ไม่พบบัญชีผู้ใช้งาน';
          else if (err.code === 'auth/wrong-password') msg = 'รหัสผ่านไม่ถูกต้อง';
          else if (err.code === 'auth/email-already-in-use') msg = 'อีเมลนี้ถูกใช้งานแล้ว';
          else if (err.code === 'auth/weak-password') msg = 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
          setError(msg);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            <div className="mb-10 text-center">
              <div className="text-xs tracking-[0.3em] text-white/40 mb-4">// ระบบจัดการการตลาด v4.0</div>
              <h1 className="text-5xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-violet-400 to-emerald-400">เข้าสู่ระบบ_</h1>
              <p className="text-white/50 text-sm">ระบบจัดการแคมเปญและกิจกรรมการตลาดแบบครบวงจร</p>
            </div>

            <div className="card p-8">
              <div className="mb-6 text-xs tracking-widest text-white/40">
                [{isRegister ? 'ลงทะเบียนผู้ใช้ใหม่' : 'เข้าสู่ระบบ'}]
              </div>

              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="label block mb-2">อีเมล</label>
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} 
                    className="input" placeholder="user@domain.com" required />
                </div>
                <div>
                  <label className="label block mb-2">รหัสผ่าน</label>
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} 
                    className="input" placeholder="••••••••" required />
                </div>

                {error && (
                  <div className="p-3 border border-red-500/30 text-red-400 text-sm bg-red-500/5">
                    [ข้อผิดพลาด] {error}
                  </div>
                )}

                <button type="submit" disabled={loading} className="w-full btn-primary py-3 text-sm tracking-widest">
                  {loading ? 'กำลังดำเนินการ...' : (isRegister ? 'ลงทะเบียน' : 'เข้าสู่ระบบ')}
                </button>
              </form>

              <div className="mt-6 pt-6 border-t border-white/10 text-center">
                <button onClick={() => { setIsRegister(!isRegister); setError(''); }} 
                  className="text-sm text-white/60 hover:text-white transition hover-arrow">
                  {isRegister ? 'กลับหน้าเข้าสู่ระบบ' : 'สร้างบัญชีใหม่'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ═══ STAT CARD (ENHANCED) ═══
    function StatCard({ label, value, hint, icon, color = "blue", trend, subvalue }) {
      const colorMap = {
        blue: "border-blue-500 text-blue-400",
        violet: "border-violet-500 text-violet-400",
        amber: "border-amber-500 text-amber-400",
        green: "border-emerald-500 text-emerald-400",
        pink: "border-pink-500 text-pink-400",
        red: "border-red-500 text-red-400",
        cyan: "border-cyan-500 text-cyan-400"
      };
      const theme = colorMap[color] || colorMap.blue;
      const borderClass = theme.split(' ')[0];
      const iconClass = theme.split(' ')[1];
      
      return (
        <div className={`card card-hover p-5 border-l-4 ${borderClass} relative overflow-hidden`}>
          <div className="flex items-start justify-between mb-3">
            <div className="label">{label}</div>
            {icon && <i data-lucide={icon} className={`w-5 h-5 ${iconClass}`}></i>}
          </div>
          <div className="text-2xl font-bold mb-1">{value}</div>
          <div className="flex items-center gap-2">
            {hint && <div className="text-[10px] text-white/50">{hint}</div>}
            {trend && (
              <span className={`metric-trend ${trend > 0 ? 'trend-up' : trend < 0 ? 'trend-down' : 'trend-neutral'}`}>
                {trend > 0 ? '↑' : trend < 0 ? '↓' : '→'} {Math.abs(trend).toFixed(1)}%
              </span>
            )}
          </div>
          {subvalue && <div className="text-xs text-white/40 mt-2 pt-2 border-t border-white/10">{subvalue}</div>}
        </div>
      );
    }

    // ═══ BUDGET VS SPENT BAR CHART ═══
    function BudgetVsSpentChart({ projects }) {
      const categories = [
        { value: 'digital', label: 'Digital', color: 'bg-blue-500' },
        { value: 'motorshow', label: 'Motor Show', color: 'bg-violet-500' },
        { value: 'testdrive', label: 'Test Drive', color: 'bg-amber-500' },
        { value: 'dealer', label: 'Dealer', color: 'bg-emerald-500' },
        { value: 'service', label: 'Service', color: 'bg-pink-500' },
        { value: 'crm', label: 'CRM', color: 'bg-cyan-500' },
        { value: 'other', label: 'อื่นๆ', color: 'bg-gray-500' }
      ];

      const data = categories.map(cat => {
        const catProjects = projects.filter(p => p.category === cat.value);
        const budget = catProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const spent = catProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        return { ...cat, budget, spent, count: catProjects.length };
      }).filter(d => d.budget > 0 || d.spent > 0);

      const maxVal = Math.max(...data.flatMap(d => [d.budget, d.spent]), 1);

      if (data.length === 0) {
        return (
          <div className="card p-6">
            <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// BUDGET_VS_SPENT</div>
            <h3 className="font-bold mb-4">งบประมาณ vs ใช้จริง</h3>
            <div className="text-center text-white/40 py-8">ไม่มีข้อมูล</div>
          </div>
        );
      }

      return (
        <div className="card p-6">
          <div className="flex items-center justify-between mb-6">
            <div>
              <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// BUDGET_VS_SPENT</div>
              <h3 className="font-bold">งบประมาณ vs ใช้จริง (ตามหมวดหมู่)</h3>
            </div>
            <div className="flex gap-3 text-[10px]">
              <span className="flex items-center gap-1.5 text-white/60"><span className="w-2 h-2 bg-blue-500 rounded-sm"></span>งบ</span>
              <span className="flex items-center gap-1.5 text-white/60"><span className="w-2 h-2 bg-white/40 rounded-sm"></span>ใช้จริง</span>
            </div>
          </div>

          <div className="space-y-3">
            {data.map((d, idx) => {
              const budgetPct = (d.budget / maxVal) * 100;
              const spentPct = (d.spent / maxVal) * 100;
              const utilization = d.budget > 0 ? ((d.spent / d.budget) * 100).toFixed(0) : 0;
              
              return (
                <div key={idx} className="space-y-1.5">
                  <div className="flex justify-between text-xs items-center">
                    <span className="font-medium text-white/80">{d.label}</span>
                    <div className="flex items-center gap-3 text-[10px] text-white/50">
                      <span>฿{(d.budget/1000).toFixed(0)}k</span>
                      <span className={parseInt(utilization) > 90 ? 'text-red-400' : parseInt(utilization) > 70 ? 'text-amber-400' : 'text-emerald-400'}>
                        {utilization}%
                      </span>
                    </div>
                  </div>
                  <div className="space-y-1">
                    <div className="h-2 bg-white/5 rounded-full overflow-hidden relative">
                      <div className={`absolute inset-y-0 left-0 ${d.color} chart-bar rounded-full`} style={{ width: `${budgetPct}%` }}></div>
                    </div>
                    <div className="h-2 bg-white/5 rounded-full overflow-hidden relative">
                      <div className="absolute inset-y-0 left-0 bg-white/40 chart-bar rounded-full" style={{ width: `${spentPct}%` }}></div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ═══ CATEGORY BREAKDOWN DONUT ═══
    function CategoryBreakdown({ projects }) {
      const categories = [
        { value: 'digital', label: 'Digital', color: '#3b82f6' },
        { value: 'motorshow', label: 'Motor Show', color: '#8b5cf6' },
        { value: 'testdrive', label: 'Test Drive', color: '#f59e0b' },
        { value: 'dealer', label: 'Dealer', color: '#10b981' },
        { value: 'service', label: 'Service', color: '#ec4899' },
        { value: 'crm', label: 'CRM', color: '#06b6d4' },
        { value: 'other', label: 'อื่นๆ', color: '#6b7280' }
      ];

      const data = categories.map(cat => {
        const count = projects.filter(p => p.category === cat.value).length;
        return { ...cat, count };
      }).filter(d => d.count > 0);

      const total = data.reduce((sum, d) => sum + d.count, 0);

      if (data.length === 0) {
        return (
          <div className="card p-6">
            <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// CATEGORY_MIX</div>
            <h3 className="font-bold mb-4">สัดส่วนหมวดหมู่</h3>
            <div className="text-center text-white/40 py-8">ไม่มีข้อมูล</div>
          </div>
        );
      }

      // Calculate SVG arc paths for donut chart
      const cx = 60, cy = 60, r = 45;
      let cumulativeAngle = -90;
      const arcs = data.map(d => {
        const angle = (d.count / total) * 360;
        const startAngle = cumulativeAngle;
        const endAngle = cumulativeAngle + angle;
        cumulativeAngle = endAngle;

        const startRad = (startAngle * Math.PI) / 180;
        const endRad = (endAngle * Math.PI) / 180;

        const x1 = cx + r * Math.cos(startRad);
        const y1 = cy + r * Math.sin(startRad);
        const x2 = cx + r * Math.cos(endRad);
        const y2 = cy + r * Math.sin(endRad);

        const largeArc = angle > 180 ? 1 : 0;
        const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;

        return { ...d, path, percentage: ((d.count / total) * 100).toFixed(1) };
      });

      return (
        <div className="card p-6">
          <div className="flex items-center justify-between mb-6">
            <div>
              <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// CATEGORY_MIX</div>
              <h3 className="font-bold">สัดส่วนหมวดหมู่ ({total} แคมเปญ)</h3>
            </div>
          </div>

          <div className="flex flex-col lg:flex-row items-center gap-6">
            <div className="relative flex-shrink-0">
              <svg width="140" height="140" viewBox="0 0 120 120">
                {arcs.map((arc, idx) => (
                  <path
                    key={idx}
                    d={arc.path}
                    fill={arc.color}
                    className="donut-segment"
                    stroke="var(--surface)"
                    strokeWidth="1"
                  />
                ))}
                <circle cx={cx} cy={cy} r="28" fill="var(--surface)" />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <div className="text-2xl font-bold">{total}</div>
                <div className="text-[10px] text-white/50">ทั้งหมด</div>
              </div>
            </div>

            <div className="flex-1 space-y-2 w-full">
              {arcs.map((arc, idx) => (
                <div key={idx} className="flex items-center gap-3 text-xs">
                  <span className="w-3 h-3 rounded-sm flex-shrink-0" style={{ backgroundColor: arc.color }}></span>
                  <span className="flex-1 text-white/80">{arc.label}</span>
                  <span className="font-mono text-white/60">{arc.count}</span>
                  <span className="font-bold text-white/90 w-12 text-right">{arc.percentage}%</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ═══ MONTHLY ACTIVITY HEATMAP ═══
    function MonthlyHeatmap({ projects, onlinePlans }) {
      const months = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        months.push({
          date: d,
          label: d.toLocaleDateString('th-TH', { month: 'short' }),
          year: d.getFullYear()
        });
      }

      const data = months.map(month => {
        const monthProjects = projects.filter(p => {
          const start = parseDate(p.startDate);
          const end = parseDate(p.endDate);
          if (!start || !end) return false;
          return start <= new Date(month.year, month.date.getMonth() + 1, 0) && end >= month.date;
        });
        const monthOnline = onlinePlans.filter(p => {
          const d = parseDate(p.planDate);
          return d && d.getMonth() === month.date.getMonth() && d.getFullYear() === month.year;
        });
        return {
          ...month,
          projects: monthProjects.length,
          online: monthOnline.length,
          total: monthProjects.length + monthOnline.length,
          budget: monthProjects.reduce((s, p) => s + (p.budget || 0), 0)
        };
      });

      const maxTotal = Math.max(...data.map(d => d.total), 1);

      return (
        <div className="card p-6">
          <div className="flex items-center justify-between mb-6">
            <div>
              <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// ACTIVITY_TREND</div>
              <h3 className="font-bold">กิจกรรมรายเดือน (6 เดือนย้อนหลัง)</h3>
            </div>
            <div className="text-[10px] text-white/50 flex gap-2">
              <span className="flex items-center gap-1"><span className="w-2 h-2 bg-violet-500/20 rounded-sm"></span>น้อย</span>
              <span className="flex items-center gap-1"><span className="w-2 h-2 bg-violet-500 rounded-sm"></span>มาก</span>
            </div>
          </div>

          <div className="grid grid-cols-6 gap-3">
            {data.map((d, idx) => {
              const intensity = d.total / maxTotal;
              const bgColor = intensity === 0 
                ? 'bg-white/[0.03]' 
                : `rgba(139, 92, 246, ${0.1 + intensity * 0.8})`;
              
              return (
                <div key={idx} className="text-center">
                  <div 
                    className="heatmap-cell flex flex-col items-center justify-center p-3 border border-white/10 hover:border-white/30"
                    style={{ backgroundColor: bgColor }}
                  >
                    <div className="text-2xl font-bold">{d.total}</div>
                    <div className="text-[10px] text-white/60 mt-1">กิจกรรม</div>
                  </div>
                  <div className="text-xs text-white/70 mt-2 font-medium">{d.label}</div>
                  <div className="text-[10px] text-white/40 mt-0.5">
                    {d.projects > 0 && `${d.projects} แคมเปญ`}
                    {d.projects > 0 && d.online > 0 && ' • '}
                    {d.online > 0 && `${d.online} ออนไลน์`}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ═══ CALENDAR ═══
    function CalendarComponent({ projects, onlinePlans }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;
        
        const projectEvents = projects.filter(p => p.startDate && p.endDate).map(p => {
          const startD = parseDate(p.startDate);
          const endD = parseDate(p.endDate);
          const adjustedEnd = new Date(endD);
          adjustedEnd.setDate(adjustedEnd.getDate() + 1);
          return {
            id: p.id, title: `[แคมเปญ] ${p.name}`,
            start: startD.toISOString().split('T')[0],
            end: adjustedEnd.toISOString().split('T')[0],
            backgroundColor: p.status === 'completed' ? '#10b981' : p.status === 'active' ? '#3b82f6' : p.status === 'paused' ? '#f59e0b' : '#71717a',
            borderColor: 'transparent', textColor: '#fff'
          };
        });

        const onlineEvents = onlinePlans.filter(p => p.planDate).map(p => {
          const d = parseDate(p.planDate);
          if (!d) return null;
          const colors = { facebook: '#3b82f6', tiktok: '#ec4899', line: '#10b981', website: '#8b5cf6', other: '#71717a' };
          return {
            id: `online_${p.id}`, title: `[${p.platform.toUpperCase()}] ${p.title}`,
            start: d.toISOString().split('T')[0],
            backgroundColor: colors[p.platform] || '#71717a',
            borderColor: 'transparent', textColor: '#fff'
          };
        }).filter(Boolean);

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth', locale: 'th',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          events: [...projectEvents, ...onlineEvents],
          eventClick: function(info) {
            if (info.event.id.startsWith('online_')) {
              const p = onlinePlans.find(plan => `online_${plan.id}` === info.event.id);
              if (p) {
                alert(`📅 กิจกรรมออนไลน์: ${p.title}\nแพลตฟอร์ม: ${p.platform}\nวันที่: ${parseDate(p.planDate)?.toLocaleDateString('th-TH')} ${p.planTime || ''}\nสถานะ: ${p.status}\nวัตถุประสงค์: ${p.objective || '-'}`);
              }
            } else {
              const p = projects.find(proj => proj.id === info.event.id);
              if (p) {
                const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
                const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
                alert(`${p.name}\n\n${startStr} - ${endStr}\nสถานะ: ${p.status}\nงบประมาณ: ฿${(p.budget || 0).toLocaleString()}`);
              }
            }
          }
        });
        calendar.render();
        return () => calendar.destroy();
      }, [projects, onlinePlans]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          <div className="mt-6 pt-6 border-t border-white/10 flex flex-wrap gap-5 justify-center text-xs">
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-blue-500 rounded-sm"></span>แคมเปญที่กำลังดำเนินการ</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-emerald-500 rounded-sm"></span>เสร็จสิ้น</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-pink-500 rounded-sm"></span>ออนไลน์: TikTok</span>
            <span className="flex items-center gap-2 text-white/60"><span className="w-2.5 h-2.5 bg-blue-500 rounded-sm"></span>ออนไลน์: Facebook</span>
          </div>
        </div>
      );
    }

    // ═══ ONLINE PLAN TAB ═══

        title: '', platform: 'facebook', planDate: '', planTime: '', 
        status: 'planned', objective: '', expectedReach: '', actualReach: ''

        if (plan) {
          setEditing(plan);
          const d = parseDate(plan.planDate);

            title: plan.title || '', platform: plan.platform || 'facebook', 
            planDate: d ? d.toISOString().split('T')[0] : '',
            planTime: plan.planTime || '', status: plan.status || 'planned',
            objective: plan.objective || '', expectedReach: plan.expectedReach || '', actualReach: plan.actualReach || ''
          });
        } else {
          setEditing(null);
          setFormData({ title: '', platform: 'facebook', planDate: '', planTime: '', status: 'planned', objective: '', expectedReach: '', actualReach: '' });

        setShowModal(true);
      };

        if (!formData.title || !formData.planDate) {
          alert('กรุณากรอกชื่อกิจกรรมและวันที่');
          return;
        }

          expectedReach: parseInt(formData.expectedReach)||0, 
          actualReach: parseInt(formData.actualReach)||0, 
          planDate: new Date(formData.planDate) 
        };
        if (editing) await onEdit(editing.id, data);
        else await onAdd(data);

      const getStatus = (val) => STATUSES_ONLINE.find(s => s.value === val) || STATUSES_ONLINE[0];

            </div>
            <button onClick={() => openModal()} className="btn-primary px-5 py-2.5 text-sm tracking-wider flex items-center gap-2">

                <div className="text-sm text-white/40">ยังไม่มีแผนกิจกรรมออนไลน์</div>

            ) : (
              plans.map(p => {

                const stat = getStatus(p.status);

                    <div className="flex justify-between items-start mb-3">
                      <span className={`badge ${plat.badge}`}>{plat.label}</span>

                        {stat.label}
                      </span>
                    </div>
                    <h3 className="font-bold text-lg mb-2 line-clamp-2">{p.title}</h3>
                    <div className="text-xs text-white/50 mb-4 flex items-center gap-2">
                      <i data-lucide="calendar" className="w-3 h-3"></i>
                      {parseDate(p.planDate)?.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })} 
                      {p.planTime && ` • ${p.planTime} น.`}
                    </div>
                    <p className="text-sm text-white/60 mb-4 line-clamp-2 flex-1">{p.objective || 'ไม่มีวัตถุประสงค์ระบุ'}</p>
                    
                    {p.expectedReach > 0 && (
                      <div className="mt-auto">
                        <div className="flex justify-between text-[10px] tracking-widest text-white/50 mb-1.5">
                          <span>ความคืบหน้าการเข้าถึง (Reach)</span>
                          <span className="text-blue-400">{reachPct.toFixed(0)}%</span>
                        </div>
                        <div className="progress-track">
                          <div className="progress-fill bg-blue-500" style={{ width: `${reachPct}%` }}></div>
                        </div>
                        <div className="text-[11px] text-white/40 mt-1.5 text-right">
                          {p.actualReach.toLocaleString()} / {p.expectedReach.toLocaleString()}
                        </div>
                      </div>
                    )}

                    <div className="flex gap-2 mt-4 pt-4 border-t border-white/10">
                      <button onClick={() => openModal(p)} className="flex-1 btn-ghost py-2 text-xs tracking-widest">แก้ไข</button>
                      <button onClick={() => { if(confirm('ต้องการลบกิจกรรมนี้?')) onDelete(p.id); }} className="flex-1 btn-danger py-2 text-xs tracking-widest">ลบ</button>
                    </div>
                  </div>
                );
              })
            )}
          </div>

          {showModal && (
            <div className="fixed inset-0 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="card max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto fade-in" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/10">
                  <h2 className="text-xl font-bold">{editing ? 'แก้ไขกิจกรรม' : 'เพิ่มกิจกรรมใหม่'}</h2>
                  <button onClick={() => setShowModal(false)} className="btn-ghost w-8 h-8 flex items-center justify-center">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="label block mb-2">ชื่อกิจกรรม *</label>
                    <input type="text" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="input" placeholder="เช่น Facebook Live เปิดตัวรถรุ่นใหม่" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">แพลตฟอร์ม</label>
                      <select value={formData.platform} onChange={e => setFormData({...formData, platform: e.target.value})} className="input">
                        {PLATFORMS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label block mb-2">สถานะ</label>
                      <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="input">
                        {STATUSES_ONLINE.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">วันที่ *</label>
                      <input type="date" value={formData.planDate} onChange={e => setFormData({...formData, planDate: e.target.value})} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">เวลา</label>
                      <input type="time" value={formData.planTime} onChange={e => setFormData({...formData, planTime: e.target.value})} className="input" />
                    </div>
                  </div>
                  <div>
                    <label className="label block mb-2">วัตถุประสงค์</label>
                    <textarea rows="2" value={formData.objective} onChange={e => setFormData({...formData, objective: e.target.value})} className="input resize-none" placeholder="เช่น สร้างการรับรู้, เพิ่มยอดขาย, เก็บ Lead"></textarea>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">ยอดเข้าถึงที่คาดหวัง</label>
                      <input type="number" value={formData.expectedReach} onChange={e => setFormData({...formData, expectedReach: e.target.value})} className="input" placeholder="0" />
                    </div>
                    <div>
                      <label className="label block mb-2">ยอดเข้าถึงจริง</label>
                      <input type="number" value={formData.actualReach} onChange={e => setFormData({...formData, actualReach: e.target.value})} className="input" placeholder="0" />
                    </div>
                  </div>
                  <div className="flex gap-3 pt-4 border-t border-white/10">
                    <button onClick={save} className="flex-1 btn-primary py-3 text-sm tracking-widest">บันทึก</button>
                    <button onClick={() => setShowModal(false)} className="btn-ghost px-6 py-3 text-sm tracking-widest">ยกเลิก</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══ MAIN APP ═══
    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [projects, setProjects] = useState([]);
      const [onlinePlans, setOnlinePlans] = useState([]);
      const [showModal, setShowModal] = useState(false);
      const [editingProject, setEditingProject] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterStatus, setFilterStatus] = useState('all');
      const [dashboardFilter, setDashboardFilter] = useState('all');

      const [formData, setFormData] = useState({
        name: '', description: '', category: 'digital', budget: '', spent: '',
        inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
        status: 'planning', startDate: '', endDate: ''
      });

      const categories = [
        { value: 'digital', label: 'Digital Lead Gen', code: 'DIG' },
        { value: 'motorshow', label: 'Motor Show', code: 'SHOW' },
        { value: 'testdrive', label: 'Test Drive', code: 'DRV' },
        { value: 'dealer', label: 'Dealer / Roadshow', code: 'DLR' },
        { value: 'service', label: 'Service', code: 'SRV' },
        { value: 'crm', label: 'CRM', code: 'CRM' },
        { value: 'other', label: 'อื่นๆ', code: 'OTH' }
      ];

      const statuses = [
        { value: 'planning', label: 'วางแผน' },
        { value: 'active', label: 'กำลังดำเนินการ' },
        { value: 'paused', label: 'พักชั่วคราว' },
        { value: 'completed', label: 'เสร็จสิ้น' },
        { value: 'cancelled', label: 'ยกเลิก' }
      ];

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const resetForm = () => {
        setFormData({
          name: '', description: '', category: 'digital', budget: '', spent: '',
          inquiries: '', testDrives: '', bookings: '', deliveries: '', followUps: '', 
          status: 'planning', startDate: '', endDate: ''
        });
        setEditingProject(null);
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const unsubProj = FirebaseService.subscribeProjects((data) => {
          setProjects(data);
          setTimeout(() => lucide.createIcons(), 100);
        });
        
        const unsubOnline = db.collection('online_plans').orderBy('planDate', 'asc').onSnapshot((snapshot) => {
          const plans = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            plans.push({ id: doc.id, ...data, planDate: parseDate(data.planDate) });
          });
          setOnlinePlans(plans);
        });

        return () => { unsubProj(); unsubOnline(); };
      }, [user]);

      useEffect(() => { lucide.createIcons(); });

      const handleLogout = async () => {
        await auth.signOut();
        showToast('ออกจากระบบเรียบร้อย', 'success');
      };

      const openModal = (project = null) => {
        if (project) {
          setEditingProject(project);
          const sDate = parseDate(project.startDate);
          const eDate = parseDate(project.endDate);
          setFormData({
            name: project.name || '', description: project.description || '', category: project.category || 'digital',
            budget: project.budget || '', spent: project.spent || '', 
            inquiries: project.inquiries || '', testDrives: project.testDrives || '', 
            bookings: project.bookings || '', deliveries: project.deliveries || '', followUps: project.followUps || '',
            status: project.status || 'planning',
            startDate: sDate ? sDate.toISOString().split('T')[0] : '',
            endDate: eDate ? eDate.toISOString().split('T')[0] : ''
          });
        } else { resetForm(); }
        setShowModal(true);
      };

      const saveProject = async () => {
        if (!formData.name || !formData.startDate || !formData.endDate) {
          showToast('กรุณากรอกชื่อและวันที่ให้ครบถ้วน', 'error');
          return;
        }
        const dataToSave = {
          name: formData.name, description: formData.description || '', category: formData.category,
          budget: parseInt(formData.budget) || 0, spent: parseInt(formData.spent) || 0,
          inquiries: parseInt(formData.inquiries) || 0, testDrives: parseInt(formData.testDrives) || 0,
          bookings: parseInt(formData.bookings) || 0, deliveries: parseInt(formData.deliveries) || 0,
          followUps: parseInt(formData.followUps) || 0, status: formData.status,
          startDate: new Date(formData.startDate), endDate: new Date(formData.endDate)
        };

        try {
          if (editingProject) await FirebaseService.updateProject(editingProject.id, dataToSave);
          else await FirebaseService.addProject(dataToSave);
          showToast(editingProject ? 'อัปเดตข้อมูลสำเร็จ' : 'สร้างแคมเปญใหม่สำเร็จ', 'success');
          setShowModal(false);
          resetForm();
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการบันทึก', 'error');
        }
      };

      const deleteProject = async (id) => {
        if (!confirm('ต้องการลบแคมเปญนี้ใช่หรือไม่?')) return;
        try {
          await FirebaseService.deleteProject(id);
          showToast('ลบแคมเปญเรียบร้อย', 'success');
        } catch (error) {
          showToast('เกิดข้อผิดพลาดในการลบ', 'error');
        }
      };

      const addOnlinePlan = async (planData) => {
        await db.collection('online_plans').add({
          ...planData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('เพิ่มกิจกรรมสำเร็จ', 'success');
      };

      const updateOnlinePlan = async (id, planData) => {
        await db.collection('online_plans').doc(id).update({
          ...planData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('อัปเดตกิจกรรมสำเร็จ', 'success');
      };

      const deleteOnlinePlan = async (id) => {
        if (!confirm('ต้องการลบกิจกรรมนี้ใช่หรือไม่?')) return;
        await db.collection('online_plans').doc(id).delete();
        showToast('ลบกิจกรรมสำเร็จ', 'success');
      };

      const filteredProjects = useMemo(() => {
        let result = projects;
        if (searchTerm) result = result.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()) || p.description?.toLowerCase().includes(searchTerm.toLowerCase()));
        if (filterCategory !== 'all') result = result.filter(p => p.category === filterCategory);
        if (filterStatus !== 'all') result = result.filter(p => p.status === filterStatus);
        return result;
      }, [projects, searchTerm, filterCategory, filterStatus]);

      const dashboardProjects = useMemo(() => {
        if (dashboardFilter === 'all') return projects;
        if (dashboardFilter === 'active') return projects.filter(p => p.status === 'active');
        if (dashboardFilter === 'completed') return projects.filter(p => p.status === 'completed');
        return projects.filter(p => p.category === dashboardFilter);
      }, [projects, dashboardFilter]);

      const metrics = useMemo(() => {
        const total = dashboardProjects.length;
        const active = dashboardProjects.filter(p => p.status === 'active').length;
        const totalBudget = dashboardProjects.reduce((sum, p) => sum + (p.budget || 0), 0);
        const totalSpent = dashboardProjects.reduce((sum, p) => sum + (p.spent || 0), 0);
        const totalInquiries = dashboardProjects.reduce((sum, p) => sum + (p.inquiries || 0), 0);
        const totalTestDrives = dashboardProjects.reduce((sum, p) => sum + (p.testDrives || 0), 0);
        const totalBookings = dashboardProjects.reduce((sum, p) => sum + (p.bookings || 0), 0);
        const totalDeliveries = dashboardProjects.reduce((sum, p) => sum + (p.deliveries || 0), 0);
        const totalFollowUps = dashboardProjects.reduce((sum, p) => sum + (p.followUps || 0), 0);
        const cpl = totalInquiries > 0 ? (totalSpent / totalInquiries).toFixed(0) : 0;
        const costPerDelivery = totalDeliveries > 0 ? (totalSpent / totalDeliveries).toFixed(0) : 0;
        const budgetUtilization = totalBudget > 0 ? ((totalSpent / totalBudget) * 100).toFixed(1) : 0;
        const conversionRate = totalInquiries > 0 ? ((totalDeliveries / totalInquiries) * 100).toFixed(2) : 0;
        return { 
          total, active, totalBudget, totalSpent, totalInquiries, totalTestDrives, 
          totalBookings, totalDeliveries, totalFollowUps, cpl, costPerDelivery,
          budgetUtilization, conversionRate
        };
      }, [dashboardProjects]);

      const getStatusBadge = (status) => {
        const map = {
          planning: 'badge-planning', active: 'badge-active', paused: 'badge-planning',
          completed: 'badge-completed', cancelled: 'badge-cancelled'
        };
        const label = (statuses.find(s => s.value === status) || statuses[0]).label;
        return <span className={`badge ${map[status] || 'badge-planning'}`}>{label}</span>;
      };

      const formatDate = (date) => {
        const d = parseDate(date);
        if (!d) return '-';
        return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
      };

      if (authLoading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-violet-400">กำลังโหลด_<span className="cursor"></span></div>
              <div className="text-sm text-white/40">กำลังเริ่มต้นระบบ</div>
            </div>
          </div>
        );
      }

      if (!user) return <LoginComponent />;

      return (
        <div className="min-h-screen">
          {toast && (
            <div className={`fixed top-5 right-5 z-[100] card toast px-5 py-3 flex items-center gap-2 ${toast.type === 'error' ? 'border-red-500/40 bg-red-500/10' : 'border-emerald-500/40 bg-emerald-500/10'}`}>
              <i data-lucide={toast.type === 'error' ? 'x' : 'check'} className={`w-4 h-4 ${toast.type === 'error' ? 'text-red-400' : 'text-emerald-400'}`}></i>
              <span className="text-sm">{toast.message}</span>
            </div>
          )}

          <header className="sticky top-0 z-40 border-b border-white/10 bg-[#09090b]/90 backdrop-blur">
            <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-violet-600 text-white flex items-center justify-center font-bold rounded">
                  M
                </div>
                <div>
                  <div className="font-bold text-lg tracking-tight">ระบบจัดการการตลาด v4.0</div>
                  <div className="flex items-center gap-2 text-xs text-white/40">
                    <span className="pulse-dot"></span>
                    <span>{user.email}</span>
                  </div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => openModal()} className="btn-primary px-5 py-2.5 text-sm tracking-wider flex items-center gap-2">
                  <i data-lucide="plus" className="w-4 h-4"></i> เพิ่มแคมเปญ
                </button>
                <button onClick={handleLogout} className="btn-ghost px-5 py-2.5 text-sm tracking-wider">
                  ออกจากระบบ
                </button>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex gap-0 mb-8 border-b border-white/10 overflow-x-auto">
              {[
                { id: 'dashboard', label: 'ภาพรวม (Dashboard)' },
                { id: 'online', label: 'แผนกิจกรรมออนไลน์' },
                { id: 'projects', label: 'รายการแคมเปญ' },
                { id: 'calendar', label: 'ปฏิทินกิจกรรม' }
              ].map((tab) => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                  className={`tab ${activeTab === tab.id ? 'tab-active' : ''}`}>
                  {tab.label}
                </button>
              ))}
            </div>

            {activeTab === 'dashboard' && (
              <div className="fade-in space-y-6">
                {/* Dashboard Summary Header */}
                <div className="card p-6 border-t-2 border-t-violet-500 bg-gradient-to-br from-violet-500/5 to-transparent">
                  <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div>
                      <div className="text-xs tracking-[0.3em] text-white/40 mb-2">// EXECUTIVE_SUMMARY</div>
                      <h1 className="text-2xl font-bold mb-2">ภาพรวมการตลาดแบบเรียลไทม์</h1>
                      <div className="flex flex-wrap gap-4 text-xs text-white/60">
                        <span className="flex items-center gap-1.5">
                          <i data-lucide="calendar" className="w-3 h-3"></i>
                          {new Date().toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                        </span>
                        <span className="flex items-center gap-1.5">
                          <i data-lucide="activity" className="w-3 h-3"></i>
                          {metrics.active} แคมเปญกำลังดำเนินการ
                        </span>
                      </div>
                    </div>
                    <div className="flex gap-3">
                      <div className="text-center p-3 bg-white/5 rounded border border-white/10 min-w-[120px]">
                        <div className="text-[10px] tracking-widest text-white/40 mb-1">ใช้งบประมาณ</div>
                        <div className="text-2xl font-bold text-amber-400">{metrics.budgetUtilization}%</div>
                        <div className="text-[10px] text-white/50 mt-1">฿{(metrics.totalSpent/1000000).toFixed(2)}M</div>
                      </div>
                      <div className="text-center p-3 bg-white/5 rounded border border-white/10 min-w-[120px]">
                        <div className="text-[10px] tracking-widest text-white/40 mb-1">Conversion</div>
                        <div className="text-2xl font-bold text-emerald-400">{metrics.conversionRate}%</div>
                        <div className="text-[10px] text-white/50 mt-1">จาก Lead ทั้งหมด</div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Filter Buttons */}
                <div className="flex flex-wrap gap-2">
                  <button onClick={() => setDashboardFilter('all')} className={`px-4 py-2 text-xs tracking-widest rounded border transition ${dashboardFilter === 'all' ? 'bg-white text-black border-white' : 'border-white/20 text-white/60 hover:border-white/50'}`}>ทั้งหมด</button>
                  <button onClick={() => setDashboardFilter('active')} className={`px-4 py-2 text-xs tracking-widest rounded border transition ${dashboardFilter === 'active' ? 'bg-emerald-500 text-black border-emerald-500' : 'border-emerald-500/30 text-emerald-400 hover:border-emerald-500'}`}>กำลังดำเนินการ</button>
                  <button onClick={() => setDashboardFilter('completed')} className={`px-4 py-2 text-xs tracking-widest rounded border transition ${dashboardFilter === 'completed' ? 'bg-blue-500 text-white border-blue-500' : 'border-blue-500/30 text-blue-400 hover:border-blue-500'}`}>เสร็จสิ้น</button>
                  {categories.map(cat => {
                    const count = projects.filter(p => p.category === cat.value).length;
                    if (count === 0) return null;
                    return (
                      <button key={cat.value} onClick={() => setDashboardFilter(cat.value)} 
                        className={`px-4 py-2 text-xs tracking-widest rounded border transition ${dashboardFilter === cat.value ? 'bg-violet-500 text-white border-violet-500' : 'border-violet-500/30 text-violet-300 hover:border-violet-500'}`}>
                        {cat.label} ({count})
                      </button>
                    );
                  })}
                </div>

                {/* KPI Cards - Row 1 */}
                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                  <StatCard 
                    label="จำนวนแคมเปญ" 
                    value={metrics.total} 
                    hint={`${metrics.active} กำลังดำเนินการ`} 
                    icon="folder" 
                    color="violet" 
                    subvalue={`${projects.filter(p => p.status === 'completed').length} เสร็จสิ้น`}
                  />
                  <StatCard 
                    label="งบประมาณรวม" 
                    value={`฿${(metrics.totalBudget/1000000).toFixed(2)}M`} 
                    hint={`฿${metrics.totalBudget.toLocaleString()}`} 
                    icon="wallet" 
                    color="blue" 
                  />
                  <StatCard 
                    label="ใช้จ่ายจริง" 
                    value={`฿${(metrics.totalSpent/1000000).toFixed(2)}M`} 
                    hint={`${metrics.budgetUtilization}% ของงบประมาณ`} 
                    icon="credit-card" 
                    color={parseFloat(metrics.budgetUtilization) > 90 ? 'red' : 'amber'}
                    subvalue={`เหลืออีก ฿${((metrics.totalBudget - metrics.totalSpent)/1000000).toFixed(2)}M`}
                  />
                  <StatCard 
                    label="ต้นทุนต่อ Lead" 
                    value={`฿${parseInt(metrics.cpl || 0).toLocaleString()}`} 
                    hint="Cost Per Lead (CPL)" 
                    icon="target" 
                    color="pink" 
                    subvalue={`Lead ทั้งหมด ${metrics.totalInquiries.toLocaleString()} ราย`}
                  />
                  <StatCard 
                    label="ต้นทุนต่อส่งมอบ" 
                    value={`฿${parseInt(metrics.costPerDelivery || 0).toLocaleString()}`} 
                    hint="Cost Per Delivery" 
                    icon="package" 
                    color="green" 
                    subvalue={`ส่งมอบ ${metrics.totalDeliveries.toLocaleString()} คัน`}
                  />
                </div>

                {/* KPI Cards - Row 2 (Funnel Metrics) */}
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                  <StatCard 
                    label="ผู้สนใจ (Leads)" 
                    value={metrics.totalInquiries.toLocaleString()} 
                    hint="ยอดรวมทั้งหมด" 
                    icon="users" 
                    color="blue" 
                    subvalue={`เฉลี่ย ${metrics.total > 0 ? (metrics.totalInquiries / metrics.total).toFixed(0) : 0} /แคมเปญ`}
                  />
                  <StatCard 
                    label="ทดลองขับ" 
                    value={metrics.totalTestDrives.toLocaleString()} 
                    hint={metrics.totalInquiries > 0 ? `${((metrics.totalTestDrives / metrics.totalInquiries) * 100).toFixed(1)}% จาก Lead` : '-'} 
                    icon="car" 
                    color="violet" 
                    subvalue={`ติดตามผล ${metrics.totalFollowUps.toLocaleString()} ราย`}
                  />
                  <StatCard 
                    label="จองรถ" 
                    value={metrics.totalBookings.toLocaleString()} 
                    hint={metrics.totalInquiries > 0 ? `${((metrics.totalBookings / metrics.totalInquiries) * 100).toFixed(1)}% จาก Lead` : '-'} 
                    icon="bookmark" 
                    color="amber" 
                  />
                  <StatCard 
                    label="ส่งมอบสำเร็จ" 
                    value={metrics.totalDeliveries.toLocaleString()} 
                    hint={metrics.totalInquiries > 0 ? `${metrics.conversionRate}% Conversion` : '-'} 
                    icon="check-circle" 
                    color="green" 
                    trend={metrics.totalDeliveries > 0 ? 12.5 : 0}
                  />
                </div>

                {/* Charts Grid */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <BudgetVsSpentChart projects={dashboardProjects} />
                  <CategoryBreakdown projects={dashboardProjects} />
                </div>

                {/* Active Campaigns Timeline */}
                <ActiveCampaignsTimeline projects={projects} />

                {/* Upcoming Online Activities */}
                <div className="card p-6 border-l-4 border-pink-500">
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex items-center gap-2">
                      <i data-lucide="zap" className="w-4 h-4 text-pink-400"></i>
                      <h3 className="font-bold">กิจกรรมออนไลน์เร็วๆ นี้</h3>
                      <span className="text-xs text-white/40 ml-2">({onlinePlans.filter(p => p.status === 'planned' || p.status === 'live').length} รายการ)</span>
                    </div>
                    <button onClick={() => setActiveTab('online')} className="text-xs text-pink-400 hover:text-pink-300 hover-arrow">ดูทั้งหมด</button>
                  </div>
                  {onlinePlans.filter(p => p.status === 'planned' || p.status === 'live').sort((a,b) => new Date(a.planDate) - new Date(b.planDate)).slice(0, 3).length === 0 ? (
                    <div className="text-sm text-white/40 py-4 text-center">ไม่มีกิจกรรมออนไลน์ที่ใกล้จะถึง</div>
                  ) : (
                    <div className="space-y-3">
                      {onlinePlans.filter(p => p.status === 'planned' || p.status === 'live').sort((a,b) => new Date(a.planDate) - new Date(b.planDate)).slice(0, 3).map(p => {
                         const plat = PLATFORMS.find(pl => pl.value === p.platform) || PLATFORMS[0];
                         const daysUntil = Math.ceil((new Date(p.planDate) - new Date()) / (1000 * 60 * 60 * 24));
                         return (
                           <div key={p.id} className="flex items-center justify-between p-3 bg-white/5 rounded border border-white/10 hover:bg-white/[0.07] transition">
                             <div className="flex items-center gap-3">
                               <span className={`badge ${plat.badge} text-[10px]`}>{plat.label}</span>
                               <div>
                                 <div className="font-semibold text-sm">{p.title}</div>
                                 <div className="text-xs text-white/50">
                                   {parseDate(p.planDate)?.toLocaleDateString('th-TH', {day:'numeric', month:'short'})} 
                                   {p.planTime ? ` เวลา ${p.planTime} น.` : ''}
                                 </div>
                               </div>
                             </div>
                             <div className="flex items-center gap-3">
                               <span className={`text-xs font-medium ${
                                 daysUntil === 0 ? 'text-red-400' : 
                                 daysUntil === 1 ? 'text-amber-400' : 
                                 daysUntil <= 7 ? 'text-yellow-400' : 'text-white/50'
                               }`}>
                                 {daysUntil === 0 ? 'วันนี้' : daysUntil === 1 ? 'พรุ่งนี้' : `อีก ${daysUntil} วัน`}
                               </span>
                               <span className={`text-xs px-2 py-1 rounded font-medium ${p.status === 'live' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-white/10 text-white/60'}`}>
                                 {p.status === 'live' ? '🔴 Live' : 'วางแผน'}
                               </span>
                             </div>
                           </div>
                         )
                      })}
                    </div>
                  )}
                </div>

                {/* Monthly Activity Heatmap */}
                <MonthlyHeatmap projects={projects} onlinePlans={onlinePlans} />

                {/* Top Performers */}
                <TopPerformers projects={dashboardProjects} />

                {/* Sales Funnel */}
                <ConversionFunnel data={{ 
                  inquiries: metrics.totalInquiries, 
                  testDrives: metrics.totalTestDrives, 
                  bookings: metrics.totalBookings, 
                  deliveries: metrics.totalDeliveries 
                }} />
              </div>
            )}

            {activeTab === 'online' && (
              <OnlinePlanTab plans={onlinePlans} onAdd={addOnlinePlan} onEdit={updateOnlinePlan} onDelete={deleteOnlinePlan} />
            )}

            {activeTab === 'projects' && (
              <div className="fade-in space-y-5">
                <div className="card p-5">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="label block mb-2">ค้นหา</label>
                      <input type="text" placeholder="ค้นหาชื่อหรือรายละเอียด..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">หมวดหมู่</label>
                      <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="input">
                        <option value="all">[ ทั้งหมด ]</option>
                        {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label block mb-2">สถานะ</label>
                      <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="input">
                        <option value="all">[ ทั้งหมด ]</option>
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-4">
                  {filteredProjects.length === 0 ? (
                    <div className="col-span-full card p-16 text-center">
                      <div className="text-3xl font-bold mb-2 text-white/20">[ ไม่พบข้อมูล ]</div>
                      <div className="text-sm text-white/40">ไม่พบแคมเปญที่ตรงกับเงื่อนไข</div>
                    </div>
                  ) : (
                    filteredProjects.map(p => {
                      const inquiries = p.inquiries || 0;
                      const testDriveRate = inquiries > 0 ? (((p.testDrives || 0) / inquiries) * 100).toFixed(0) : 0;
                      const bookingRate = inquiries > 0 ? (((p.bookings || 0) / inquiries) * 100).toFixed(0) : 0;
                      const deliveryRate = inquiries > 0 ? (((p.deliveries || 0) / inquiries) * 100).toFixed(0) : 0;
                      const spentPercent = (p.budget || 0) > 0 ? (((p.spent || 0) / (p.budget || 0)) * 100).toFixed(0) : 0;
                      const cat = categories.find(c => c.value === p.category);

                      return (
                        <div key={p.id} className="card card-hover p-6">
                          <div className="flex justify-between items-start mb-4 gap-3">
                            <div className="flex-1 min-w-0">
                              <div className="text-xs tracking-[0.2em] text-white/40 mb-1">[{cat?.code || 'OTH'}]</div>
                              <h4 className="font-bold text-lg truncate">{p.name}</h4>
                            </div>
                            {getStatusBadge(p.status)}
                          </div>

                          <div className="text-xs text-white/50 mb-5 flex items-center gap-2">
                            <i data-lucide="calendar" className="w-3 h-3"></i>
                            {formatDate(p.startDate)} → {formatDate(p.endDate)}
                          </div>

                          <div className="grid grid-cols-4 gap-1 mb-5 p-3 bg-white/[0.03] border border-white/10 rounded">
                            <div className="text-center">
                              <div className="text-[9px] tracking-widest text-blue-400 mb-1">ผู้สนใจ</div>
                              <div className="text-lg font-bold">{inquiries.toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">100%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-violet-400 mb-1">ทดลองขับ</div>
                              <div className="text-lg font-bold">{(p.testDrives || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{testDriveRate}%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-amber-400 mb-1">จองรถ</div>
                              <div className="text-lg font-bold">{(p.bookings || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{bookingRate}%</div>
                            </div>
                            <div className="text-center border-l border-white/10">
                              <div className="text-[9px] tracking-widest text-emerald-400 mb-1">ส่งมอบ</div>
                              <div className="text-lg font-bold">{(p.deliveries || 0).toLocaleString()}</div>
                              <div className="text-[9px] text-white/40">{deliveryRate}%</div>
                            </div>
                          </div>

                          <div className="mb-5">
                            <div className="flex justify-between text-[10px] tracking-widest text-white/50 mb-2">
                              <span>การใช้งานงบประมาณ</span>
                              <span className={spentPercent > 90 ? 'text-red-400' : spentPercent > 70 ? 'text-amber-400' : 'text-emerald-400'}>
                                {spentPercent}%
                              </span>
                            </div>
                            <div className="progress-track">
                              <div className={`progress-fill ${spentPercent > 90 ? 'bg-red-500' : spentPercent > 70 ? 'bg-amber-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(spentPercent, 100)}%` }}></div>
                            </div>
                            <div className="text-[11px] text-white/40 mt-1.5 text-right">
                              ฿{(p.spent || 0).toLocaleString()} / {(p.budget || 0).toLocaleString()}
                            </div>
                          </div>

                          <div className="flex gap-2 pt-4 border-t border-white/10">
                            <button onClick={() => openModal(p)} className="flex-1 btn-ghost py-2 text-xs tracking-widest">แก้ไข</button>
                            <button onClick={() => deleteProject(p.id)} className="flex-1 btn-danger py-2 text-xs tracking-widest">ลบ</button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {activeTab === 'calendar' && (
              <div className="fade-in card p-6">
                <CalendarComponent projects={projects} onlinePlans={onlinePlans} />
              </div>
            )}
          </div>

          {showModal && activeTab !== 'online' && (
            <div className="fixed inset-0 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="card max-w-2xl w-full p-8 max-h-[90vh] overflow-y-auto fade-in" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between mb-6 pb-6 border-b border-white/10">
                  <div>
                    <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// {editingProject ? 'แก้ไข' : 'เพิ่มใหม่'}</div>
                    <h2 className="text-2xl font-bold">{editingProject ? 'แก้ไขข้อมูลแคมเปญ' : 'สร้างแคมเปญใหม่'}</h2>
                  </div>
                  <button onClick={() => setShowModal(false)} className="btn-ghost w-10 h-10 flex items-center justify-center">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>

                <div className="space-y-5">
                  <div>
                    <label className="label block mb-2">ชื่อแคมเปญ *</label>
                    <input type="text" placeholder="ระบุชื่อแคมเปญ" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="input" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">หมวดหมู่</label>
                      <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="input">
                        {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label block mb-2">สถานะ *</label>
                      <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="input">
                        {statuses.map(st => <option key={st.value} value={st.value}>{st.label}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">วันที่เริ่มต้น *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">วันที่สิ้นสุด *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="input" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="label block mb-2">งบประมาณ (บาท)</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="input" />
                    </div>
                    <div>
                      <label className="label block mb-2">ใช้จ่ายจริง (บาท)</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="input" />
                    </div>
                  </div>

                  <div className="p-5 border border-white/20 bg-white/[0.02] rounded">
                    <div className="text-xs tracking-[0.3em] text-white/40 mb-1">// FUNNEL</div>
                    <h3 className="font-bold text-lg mb-4">ข้อมูลกรวยการขาย (Sales Funnel)</h3>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      <div>
                        <label className="label block mb-2">ผู้สนใจ (Inquiries)</label>
                        <input type="number" min="0" placeholder="0" value={formData.inquiries} onChange={(e) => setFormData({...formData, inquiries: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">ทดลองขับ (Test Drives)</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">จองรถ (Bookings)</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">ส่งมอบ (Deliveries)</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="input" />
                      </div>
                      <div>
                        <label className="label block mb-2">ติดตามผล (Follow-up)</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="input" />
                      </div>
                    </div>
                  </div>

                  <div>
                    <label className="label block mb-2">หมายเหตุ / รายละเอียดเพิ่มเติม</label>
                    <textarea rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..." value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="input resize-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-4 border-t border-white/10">
                    <button onClick={saveProject} className="flex-1 btn-primary py-3 text-sm tracking-widest">บันทึกข้อมูล</button>
                    <button onClick={() => setShowModal(false)} className="btn-ghost px-6 py-3 text-sm tracking-widest">ยกเลิก</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
