  <style>
    :root {
      --hacker-green: #00ff41;
      --hacker-green-dim: #00cc33;
      --hacker-green-dark: #00802080;
      --hacker-bg: #000814;
      --hacker-bg-panel: #001a0d;
      --hacker-amber: #ffb000;
      --hacker-red: #ff0040;
      --hacker-cyan: #00d9ff;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Share Tech Mono', 'Fira Code', monospace;
      background: var(--hacker-bg);
      color: var(--hacker-green);
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      text-shadow: 0 0 2px rgba(0, 255, 65, 0.5);
    }

    /* Matrix Rain Canvas */
    #matrix-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    /* CRT Scanlines */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15),
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* CRT Flicker */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(18, 16, 16, 0);
      opacity: 0;
      z-index: 9998;
      pointer-events: none;
      animation: flicker 0.15s infinite;
    }

    @keyframes flicker {
      0% { opacity: 0.27861; }
      5% { opacity: 0.34769; }
      10% { opacity: 0.23604; }
      15% { opacity: 0.90626; }
      20% { opacity: 0.18128; }
      25% { opacity: 0.83891; }
      30% { opacity: 0.65583; }
      35% { opacity: 0.67807; }
      40% { opacity: 0.26559; }
      45% { opacity: 0.84693; }
      50% { opacity: 0.96019; }
      55% { opacity: 0.08594; }
      60% { opacity: 0.20313; }
      65% { opacity: 0.71988; }
      70% { opacity: 0.53455; }
      75% { opacity: 0.37288; }
      80% { opacity: 0.71428; }
      85% { opacity: 0.70419; }
      90% { opacity: 0.7003; }
      95% { opacity: 0.36108; }
      100% { opacity: 0.24387; }
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .fade-in { animation: fadeIn 0.3s steps(8); }
    @keyframes fadeIn { 
      from { opacity: 0; } 
      to { opacity: 1; } 
    }

    /* Terminal window */
    .terminal-window {
      background: rgba(0, 20, 10, 0.85);
      border: 1px solid var(--hacker-green-dark);
      box-shadow: 
        0 0 20px rgba(0, 255, 65, 0.2),
        inset 0 0 30px rgba(0, 255, 65, 0.05);
      position: relative;
    }

    .terminal-titlebar {
      background: linear-gradient(180deg, rgba(0, 40, 20, 0.9) 0%, rgba(0, 20, 10, 0.9) 100%);
      border-bottom: 1px solid var(--hacker-green-dark);
      padding: 6px 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .terminal-body {
      padding: 16px;
    }

    /* Blinking cursor */
    .cursor {
      display: inline-block;
      background: var(--hacker-green);
      animation: blink 1s step-end infinite;
      width: 8px;
      height: 1em;
      vertical-align: middle;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Typing animation */
    .typing {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      animation: typing 2s steps(40);
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    /* Glitch effect */
    .glitch {
      position: relative;
      display: inline-block;
      animation: glitch-skew 4s infinite linear alternate-reverse;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch::before {
      color: var(--hacker-red);
      animation: glitch-effect 3s infinite linear alternate-reverse;
      clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      transform: translate(-2px);
    }
    .glitch::after {
      color: var(--hacker-cyan);
      animation: glitch-effect 2s infinite linear alternate-reverse;
      clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
      transform: translate(2px);
    }
    @keyframes glitch-effect {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(3px, 2px); }
      80% { transform: translate(2px, -2px); }
    }
    @keyframes glitch-skew {
      0%, 100% { transform: skew(0deg); }
      20% { transform: skew(-0.5deg); }
      40% { transform: skew(0.5deg); }
    }

    /* Hacker button */
    .hacker-btn {
      background: transparent;
      border: 1px solid var(--hacker-green);
      color: var(--hacker-green);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .hacker-btn:hover {
      background: var(--hacker-green);
      color: var(--hacker-bg);
      box-shadow: 0 0 20px var(--hacker-green);
      text-shadow: none;
    }
    .hacker-btn-primary {
      background: var(--hacker-green);
      color: var(--hacker-bg);
      font-weight: bold;
    }
    .hacker-btn-primary:hover {
      background: transparent;
      color: var(--hacker-green);
    }
    .hacker-btn-danger {
      border-color: var(--hacker-red);
      color: var(--hacker-red);
    }
    .hacker-btn-danger:hover {
      background: var(--hacker-red);
      color: var(--hacker-bg);
      box-shadow: 0 0 20px var(--hacker-red);
    }

    /* Input */
    .hacker-input {
      background: rgba(0, 10, 5, 0.8);
      border: 1px solid var(--hacker-green-dark);
      color: var(--hacker-green);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      width: 100%;
      outline: none;
      transition: all 0.2s;

    .hacker-input:focus {
      border-color: var(--hacker-green);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.5), inset 0 0 5px rgba(0, 255, 65, 0.1);

      color: var(--hacker-green);
      padding: 10px 12px;
      font-family: inherit;
      width: 100%;
      outline: none;

    .hacker-select:focus {
      border-color: var(--hacker-green);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
    }
    .hacker-select option {
      background: var(--hacker-bg);
      color: var(--hacker-green);
    }

    /* Terminal progress bar */
    .terminal-progress {
      font-family: 'Fira Code', monospace;
      letter-spacing: 0;
      color: var(--hacker-green);
    }

    /* Stat card */
    .stat-card {
      transition: all 0.2s;
      cursor: pointer;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
      border-color: var(--hacker-green);
    }
    .stat-card:hover .stat-value {

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--hacker-bg); }
    ::-webkit-scrollbar-thumb { 
      background: var(--hacker-green-dark);
      border: 1px solid var(--hacker-green);
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--hacker-green); }

    .fc { font-size: 0.85rem; font-family: inherit; color: var(--hacker-green); }
    .fc-theme-standard td, .fc-theme-standard th { border-color: rgba(0, 255, 65, 0.2); }
    .fc-theme-standard .fc-scrollgrid { border-color: rgba(0, 255, 65, 0.3); }
    .fc .fc-col-header-cell-cushion { color: var(--hacker-green); padding: 8px; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
    .fc .fc-daygrid-day-number { color: var(--hacker-green); padding: 6px; }

    .fc .fc-button-primary:not(:disabled).fc-button-active {

    .fc-event {

      padding: 2px 6px;
      font-size: 11px;
      font-family: inherit;
    }
    .fc-event:hover { box-shadow: 0 0 10px currentColor; }

    /* Modal */
    .modal-backdrop { 
      backdrop-filter: blur(3px) contrast(1.2); 
      background-color: rgba(0, 0, 0, 0.85); 
    }

    /* Toast */
    .toast { animation: slideIn 0.3s steps(8); }
    @keyframes slideIn { 
      from { opacity: 0; transform: translateX(100%); } 
      to { opacity: 1; transform: translateX(0); } 
    }

    /* Progress bar with terminal style */
    .progress-bar { 
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      background: var(--hacker-green);
      box-shadow: 0 0 8px var(--hacker-green);
    }

    /* Status indicators */
    .status-online {
      color: var(--hacker-green);
      text-shadow: 0 0 5px var(--hacker-green);
    }
    .status-warning {
      color: var(--hacker-amber);
      text-shadow: 0 0 5px var(--hacker-amber);
    }
    .status-critical {
      color: var(--hacker-red);
      text-shadow: 0 0 5px var(--hacker-red);
      animation: blink 1s step-end infinite;
    }

    /* Bracket decoration */
    .bracket::before { content: '[ '; opacity: 0.5; }
    .bracket::after { content: ' ]'; opacity: 0.5; }

    /* Tab active */
    .tab-active {
      background: rgba(0, 255, 65, 0.15);
      color: var(--hacker-green);
      border: 1px solid var(--hacker-green);
      text-shadow: 0 0 8px var(--hacker-green);
    }

    /* ASCII art style borders using box-drawing */
    .ascii-box {
      position: relative;
      padding: 20px;
    }

    /* Header line */
    .header-line {
      background: linear-gradient(90deg, 
        var(--hacker-green) 0%, 
        transparent 50%, 
        var(--hacker-green) 100%);
      height: 1px;
      opacity: 0.4;
    }

    /* Loading dots */
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4) infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* Pulse ring */
    .pulse-ring {
      animation: pulse-ring 2s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); }
      100% { box-shadow: 0 0 0 15px rgba(0, 255, 65, 0); }
    }

    /* Boot text */
    .boot-text {
      font-family: 'VT323', monospace;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Large VT323 for ASCII feel */
    .vt323 { font-family: 'VT323', monospace; }

    /* Funnel connector arrow */
    .funnel-arrow::after {
      content: '===>';
      color: var(--hacker-green);
      font-weight: bold;
      text-shadow: 0 0 5px var(--hacker-green);
    }
    @media (max-width: 768px) {
      .funnel-arrow::after { content: '⬇'; }
    }

    /* Highlight amber text */
    .text-amber { color: var(--hacker-amber); }
    .text-red { color: var(--hacker-red); }
    .text-cyan { color: var(--hacker-cyan); }
    .text-green { color: var(--hacker-green); }

    /* Data stream animation */
    @keyframes stream {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    /* Terminal window hover glow */
    .terminal-window:hover {
      box-shadow: 
        0 0 30px rgba(0, 255, 65, 0.3),
        inset 0 0 30px rgba(0, 255, 65, 0.08);
    }

    /* ASCII logo style */
    .ascii-logo {
      font-family: 'VT323', monospace;
      letter-spacing: 1px;
      line-height: 1;
      white-space: pre;
    }
  </style>

  <script>
    // ═══ MATRIX RAIN ═══
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノ$#@%&*+=/\\<>{}[]()';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    
    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 8, 20, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px "Fira Code", monospace';
      
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 50);
    
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

            projects.push({ 
              id: doc.id,

        const docRef = await db.collection('projects').add({
          ...projectData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        return { id: docRef.id, ...projectData };
      },
      async updateProject(id, projectData) {
        await db.collection('projects').doc(id).update({
          ...projectData,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()

        return { id, ...projectData };

    // ═══════════════════════════════════════════
    // 🚗 AUTO FUNNEL
    // ═══════════════════════════════════════════
    function AutoFunnel({ data }) {
      const steps = [
        { label: 'INQUIRIES', sub: 'ลูกค้ามุ่งหวัง', value: data.inquiries, icon: 'users', color: 'green' },
        { label: 'TEST DRIVES', sub: 'ทดลองขับ', value: data.testDrives, icon: 'car', color: 'cyan' },
        { label: 'BOOKINGS', sub: 'จองรถ', value: data.bookings, icon: 'calendar-check', color: 'amber' },
        { label: 'DELIVERIES', sub: 'ส่งมอบ', value: data.deliveries, icon: 'key', color: 'red' }
      ];

      const rates = [
        '100.00%',
        data.inquiries > 0 ? ((data.testDrives / data.inquiries) * 100).toFixed(1) + '%' : '0.0%',
        data.inquiries > 0 ? ((data.bookings / data.inquiries) * 100).toFixed(1) + '%' : '0.0%',
        data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) + '%' : '0.0%'
      ];

      const overallRate = data.inquiries > 0 ? ((data.deliveries / data.inquiries) * 100).toFixed(2) + '%' : '0.00%';

      const colorMap = {
        green: 'text-green',
        cyan: 'text-cyan',
        amber: 'text-amber',
        red: 'text-red'
      };

      // Terminal progress: [████████░░] 80%
      const renderTerminalProgress = (pct) => {
        const val = Math.min(parseFloat(pct), 100);
        const filled = Math.round(val / 10);
        const empty = 10 - filled;
        return '[' + '█'.repeat(filled) + '░'.repeat(empty) + '] ' + pct;
      };

      return (
        <div className="terminal-window fade-in">
          <div className="terminal-titlebar">
            <span className="terminal-dot bg-red-500"></span>
            <span className="terminal-dot bg-amber-500"></span>
            <span className="terminal-dot bg-green-500"></span>
            <span className="ml-2 text-[11px] text-green-400 uppercase tracking-wider">
              ◆ SALES_FUNNEL.exe — LIVE ANALYTICS
            </span>
            <span className="ml-auto text-[10px] text-amber-400 uppercase tracking-wider">
              OVERALL: {overallRate}
            </span>
          </div>
          <div className="terminal-body">
            <div className="mb-4 text-xs text-green-400/70">
              <span className="text-green">&gt;</span> analyzing conversion pipeline...
              <span className="text-green-400/50"> (baseline: INQUIRIES)</span>
            </div>

            <div className="flex flex-col md:flex-row items-stretch gap-3 md:gap-2">
              {steps.map((step, idx) => (
                <React.Fragment key={idx}>
                  <div className={`flex-1 ${idx < steps.length - 1 ? 'md:flex-none md:w-auto funnel-arrow md:pr-3' : ''}`}>
                    <div className="terminal-window stat-card h-full">
                      <div className="terminal-titlebar">
                        <span className={`terminal-dot ${step.color === 'green' ? 'bg-green-500' : step.color === 'cyan' ? 'bg-cyan-400' : step.color === 'amber' ? 'bg-amber-400' : 'bg-red-400'}`}></span>
                        <span className={`text-[10px] ${colorMap[step.color]} uppercase tracking-wider`}>{step.label}</span>
                      </div>
                      <div className="terminal-body text-center">
                        <div className="mb-2">
                          <i data-lucide={step.icon} className={`w-5 h-5 inline ${colorMap[step.color]}`} style={{filter: 'drop-shadow(0 0 5px currentColor)'}}></i>
                        </div>
                        <div className={`vt323 font-bold ${colorMap[step.color]}`} style={{fontSize: '32px'}}>
                          {(step.value || 0).toLocaleString()}
                        </div>
                        <div className="text-[10px] text-green-400/50 uppercase tracking-wider mb-3">{step.sub}</div>
                        <div className="text-[11px] text-green-400/80 terminal-progress">
                          {renderTerminalProgress(rates[idx])}
                        </div>
                      </div>
                    </div>
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════
    // 📅 CALENDAR
    // ═══════════════════════════════════════════
    function CalendarComponent({ projects }) {
      const calendarRef = useRef(null);

      useEffect(() => {
        if (!calendarRef.current) return;
        const events = projects.filter(p => p.startDate && p.endDate).map(p => {
          const startD = parseDate(p.startDate);
          const endD = parseDate(p.endDate);
          const adjustedEnd = new Date(endD);
          adjustedEnd.setDate(adjustedEnd.getDate() + 1);
          return {
            id: p.id, title: p.name,
            start: startD.toISOString().split('T')[0],
            end: adjustedEnd.toISOString().split('T')[0],
            backgroundColor: p.status === 'completed' ? '#00ff41' : p.status === 'active' ? '#00d9ff' : p.status === 'paused' ? '#ffb000' : p.status === 'cancelled' ? '#ff0040' : '#00802080',
            borderColor: 'rgba(0, 255, 65, 0.5)',
            textColor: '#000814'
          };
        });

        const calendar = new FullCalendar.Calendar(calendarRef.current, {
          initialView: 'dayGridMonth', locale: 'th',
          headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,dayGridWeek' },
          events: events,
          eventClick: function(info) {
            const p = projects.find(proj => proj.id === info.event.id);
            if (p) {
              const startStr = parseDate(p.startDate)?.toLocaleDateString('th-TH') || '-';
              const endStr = parseDate(p.endDate)?.toLocaleDateString('th-TH') || '-';
              const inquiries = p.inquiries || 0;
              const testDrives = p.testDrives || 0;
              const bookings = p.bookings || 0;
              const deliveries = p.deliveries || 0;
              const pct = (v) => inquiries > 0 ? ((v / inquiries) * 100).toFixed(2) + '%' : '0.00%';
              alert(`
╔══════════════════════════════════════╗
║ MISSION: ${p.name.padEnd(26)}║
╠══════════════════════════════════════╣
║ DATE:  ${startStr} - ${endStr}
║ CAT:   ${p.category || 'N/A'}
║ STAT:  ${p.status || 'planning'}
║ BUDG:  ฿${(p.budget || 0).toLocaleString()}
║ SPENT: ฿${(p.spent || 0).toLocaleString()}
╠══════════════════════════════════════╣
║ FUNNEL ANALYSIS:
║   INQUIRIES:  ${inquiries.toLocaleString()} (100%)
║   TEST DRIVE: ${testDrives.toLocaleString()} (${pct(testDrives)})
║   BOOKINGS:   ${bookings.toLocaleString()} (${pct(bookings)})
║   DELIVERIES: ${deliveries.toLocaleString()} (${pct(deliveries)})
║   CONVERSION: ${pct(deliveries)}
╚══════════════════════════════════════╝`);
            }
          }
        });
        calendar.render();
        return () => calendar.destroy();
      }, [projects]);

      return (
        <div>
          <div ref={calendarRef} className="min-h-[600px]"></div>
          <div className="mt-4 pt-4 border-t border-green-900/50 flex flex-wrap gap-3 justify-center items-center text-[11px] uppercase tracking-wider">
            <span className="flex items-center gap-2"><span className="w-2 h-2 bg-cyan-400" style={{boxShadow: '0 0 5px #00d9ff'}}></span> ACTIVE</span>
            <span className="flex items-center gap-2"><span className="w-2 h-2 bg-green-500" style={{boxShadow: '0 0 5px #00ff41'}}></span> COMPLETED</span>
            <span className="flex items-center gap-2"><span className="w-2 h-2 bg-amber-400" style={{boxShadow: '0 0 5px #ffb000'}}></span> PAUSED</span>
            <span className="flex items-center gap-2"><span className="w-2 h-2 bg-red-500" style={{boxShadow: '0 0 5px #ff0040'}}></span> CANCELLED</span>
          </div>
        </div>
      );
    }

                { id: 'breakdown', label: 'ANALYTICS' },
                { id: 'projects', label: 'MISSIONS' },
                { id: 'calendar', label: 'TIMELINE' }
              ].map((tab) => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                  className={`px-4 py-2 text-[11px] font-bold uppercase tracking-widest transition whitespace-nowrap ${activeTab === tab.id ? 'tab-active' : 'text-green-400/60 hover:text-green border border-transparent hover:border-green-900/50'}`}>
                  &gt; {tab.label}
                </button>
              ))}
            </div>

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="fade-in space-y-4">
                <div className="terminal-window">
                  <div className="terminal-titlebar">
                    <span className="terminal-dot bg-green-500"></span>
                    <span className="text-[10px] text-green-400 uppercase tracking-wider">◆ FILTER_MODULE</span>
                  </div>
                  <div className="terminal-body">
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-[10px] text-green-400/70 uppercase tracking-widest mr-2">&gt; SELECT:</span>
                      <button onClick={() => setDashboardFilter('all')} className={`px-3 py-1 text-[10px] font-bold uppercase tracking-wider border ${dashboardFilter === 'all' ? 'bg-green text-black border-green' : 'border-green-900/50 text-green-400/60 hover:border-green'}`}>ALL [{projects.length}]</button>
                      <button onClick={() => setDashboardFilter('active')} className={`px-3 py-1 text-[10px] font-bold uppercase tracking-wider border ${dashboardFilter === 'active' ? 'bg-cyan-400 text-black border-cyan-400' : 'border-green-900/50 text-green-400/60 hover:border-green'}`}>ACTIVE [{projects.filter(p => p.status === 'active').length}]</button>
                      {categories.map(cat => {
                        const count = projects.filter(p => p.category === cat.value).length;
                        if (count === 0) return null;
                        return (
                          <button key={cat.value} onClick={() => setDashboardFilter(cat.value)} 
                            className={`px-3 py-1 text-[10px] font-bold uppercase tracking-wider border ${dashboardFilter === cat.value ? 'bg-green text-black border-green' : 'border-green-900/50 text-green-400/60 hover:border-green'}`}>
                            [{cat.code}] ({count})
                          </button>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <AutoFunnel data={{ inquiries: metrics.totalInquiries, testDrives: metrics.totalTestDrives, bookings: metrics.totalBookings, deliveries: metrics.totalDeliveries }} />

                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                  <StatCard title="MISSIONS" value={metrics.total} icon="folder" variant="green" subtitle={`active: ${metrics.active}`} />
                  <StatCard title="BUDGET" value={`฿${metrics.totalBudget.toLocaleString()}`} icon="wallet" variant="amber" />
                  <StatCard title="EXPENDITURE" value={`฿${metrics.totalSpent.toLocaleString()}`} icon="credit-card" variant="red" subtitle={`${metrics.totalBudget > 0 ? ((metrics.totalSpent/metrics.totalBudget)*100).toFixed(0) : 0}% consumed`} />
                  <StatCard title="COST/LEAD" value={`฿${parseInt(metrics.cpl || 0).toLocaleString()}`} icon="target" variant="cyan" subtitle="cpl metric" />
                  <StatCard title="FOLLOW-UP" value={metrics.totalFollowUps.toLocaleString()} icon="phone-call" variant="green" subtitle="contacts" />
                </div>
              </div>
            )}

            {/* BREAKDOWN */}
            {activeTab === 'breakdown' && (
              <div className="fade-in">
                {categoryBreakdown.length === 0 ? (
                  <div className="terminal-window p-12 text-center">
                    <div className="text-4xl vt323 mb-3">[ NO DATA ]</div>
                    <div className="text-xs text-green-400/60 uppercase tracking-wider">&gt; awaiting mission deployment</div>
                  </div>
                ) : (
                  <div className="terminal-window">
                    <div className="terminal-titlebar">
                      <span className="terminal-dot bg-red-500"></span>
                      <span className="terminal-dot bg-amber-500"></span>
                      <span className="terminal-dot bg-green-500"></span>
                      <span className="ml-2 text-[11px] text-green-400 uppercase tracking-wider">
                        ◆ ANALYTICS_REPORT.txt
                      </span>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs">
                        <thead>
                          <tr className="border-b border-green-900/50 text-[10px] text-green-400/70 uppercase tracking-wider">
                            <th className="text-left p-3">[ CATEGORY ]</th>
                            <th className="text-right p-3">MIS</th>
                            <th className="text-right p-3">INQ</th>
                            <th className="text-right p-3 text-cyan">TST</th>
                            <th className="text-right p-3 text-amber">BK</th>
                            <th className="text-right p-3 text-red">DLR</th>
                            <th className="text-right p-3">CONV</th>
                            <th className="text-right p-3">BUDGET</th>
                          </tr>
                        </thead>
                        <tbody>
                          {categoryBreakdown.map((cat) => {
                            const conv = cat.totalInquiries > 0 ? ((cat.totalDeliveries / cat.totalInquiries) * 100).toFixed(2) : '0.00';
                            const spentPercent = cat.totalBudget > 0 ? ((cat.totalSpent / cat.totalBudget) * 100).toFixed(0) : 0;
                            return (
                              <tr key={cat.value} className="border-b border-green-900/30 hover:bg-green-900/20 transition">
                                <td className="p-3 text-green uppercase tracking-wider">[{cat.code}] <span className="text-green-400/80 normal-case">{cat.label}</span></td>
                                <td className="text-right p-3">{cat.count}</td>
                                <td className="text-right p-3">{cat.totalInquiries.toLocaleString()}</td>
                                <td className="text-right p-3 text-cyan">{cat.totalTestDrives.toLocaleString()}</td>
                                <td className="text-right p-3 text-amber">{cat.totalBookings.toLocaleString()}</td>
                                <td className="text-right p-3 text-red font-bold">{cat.totalDeliveries.toLocaleString()}</td>
                                <td className="text-right p-3">
                                  <span className="px-2 py-0.5 border border-green text-green text-[10px]">{conv}%</span>
                                </td>
                                <td className="text-right p-3">
                                  <div className="text-[9px] text-green-400/60 mb-1">฿{cat.totalSpent.toLocaleString()}/{cat.totalBudget.toLocaleString()}</div>
                                  <div className="w-24 ml-auto text-[9px] text-green terminal-progress">
                                    [{('█'.repeat(Math.min(Math.round(spentPercent/10), 10)) + '░'.repeat(Math.max(10 - Math.round(spentPercent/10), 0))) + ']'} {spentPercent}%
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                          <tr className="bg-green-900/20 font-bold border-t border-green-500">
                            <td className="p-3 text-green uppercase tracking-wider">[ TOTAL ]</td>
                            <td className="text-right p-3">{categoryBreakdown.reduce((s, c) => s + c.count, 0)}</td>
                            <td className="text-right p-3">{categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0).toLocaleString()}</td>
                            <td className="text-right p-3 text-cyan">{categoryBreakdown.reduce((s, c) => s + c.totalTestDrives, 0).toLocaleString()}</td>
                            <td className="text-right p-3 text-amber">{categoryBreakdown.reduce((s, c) => s + c.totalBookings, 0).toLocaleString()}</td>
                            <td className="text-right p-3 text-red">{categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0).toLocaleString()}</td>
                            <td className="text-right p-3">
                              {(() => {
                                const v = categoryBreakdown.reduce((s, c) => s + c.totalInquiries, 0);
                                const d = categoryBreakdown.reduce((s, c) => s + c.totalDeliveries, 0);
                                return <span className="px-2 py-0.5 border border-green text-green text-[10px]">{v > 0 ? ((d/v)*100).toFixed(2) + '%' : '0.00%'}</span>;
                              })()}
                            </td>
                            <td className="text-right p-3">฿{categoryBreakdown.reduce((s, c) => s + c.totalSpent, 0).toLocaleString()}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* MISSIONS */}
            {activeTab === 'projects' && (
              <div className="fade-in space-y-3">
                <div className="terminal-window">
                  <div className="terminal-titlebar">
                    <span className="terminal-dot bg-green-500"></span>
                    <span className="text-[10px] text-green-400 uppercase tracking-wider">◆ QUERY_PARAMETERS</span>
                  </div>
                  <div className="terminal-body">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; SEARCH:</label>
                        <input type="text" placeholder="pattern..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="hacker-input text-[11px]" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; CATEGORY:</label>
                        <select value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className="hacker-select text-[11px]">
                          <option value="all">[ ALL ]</option>
                          {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; STATUS:</label>
                        <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="hacker-select text-[11px]">
                          <option value="all">[ ALL ]</option>
                          {statuses.map(st => <option key={st.value} value={st.value}>[{st.label.toUpperCase()}]</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-3">
                  {filteredProjects.length === 0 ? (
                    <div className="col-span-full terminal-window p-12 text-center">
                      <div className="text-4xl vt323 mb-3">[ NO MATCHES ]</div>
                      <div className="text-xs text-green-400/60 uppercase tracking-wider">&gt; refine query parameters</div>
                    </div>
                  ) : (
                    filteredProjects.map(p => {
                      const inquiries = p.inquiries || 0;
                      const testDriveRate = inquiries > 0 ? (((p.testDrives || 0) / inquiries) * 100).toFixed(0) : 0;
                      const bookingRate = inquiries > 0 ? (((p.bookings || 0) / inquiries) * 100).toFixed(0) : 0;
                      const deliveryRate = inquiries > 0 ? (((p.deliveries || 0) / inquiries) * 100).toFixed(0) : 0;
                      const spentPercent = (p.budget || 0) > 0 ? (((p.spent || 0) / (p.budget || 0)) * 100).toFixed(0) : 0;

                      return (
                        <div key={p.id} className="terminal-window stat-card">
                          <div className="terminal-titlebar flex justify-between">
                            <div className="flex items-center gap-2">
                              <span className="terminal-dot bg-green-500 pulse-ring"></span>
                              <span className="text-[10px] text-green uppercase tracking-wider">MISSION_{p.id.substring(0,6)}</span>
                            </div>
                            {getStatusBadge(p.status)}
                          </div>
                          <div className="terminal-body">
                            <h4 className="font-bold text-green text-sm mb-1 truncate">{p.name}</h4>
                            <div className="text-[10px] text-green-400/60 uppercase tracking-wider mb-3">
                              [{(categories.find(c => c.value === p.category) || {}).code || 'OTH'}] {formatDate(p.startDate)} → {formatDate(p.endDate)}
                            </div>

                            <div className="grid grid-cols-4 gap-1 mb-3 p-2 border border-green-900/50 bg-black/30 text-center">
                              <div>
                                <div className="text-[8px] text-green-400/60 uppercase">INQ</div>
                                <div className="text-green font-bold vt323" style={{fontSize: '18px'}}>{inquiries.toLocaleString()}</div>
                                <div className="text-[8px] text-green-400/50">100%</div>
                              </div>
                              <div className="border-l border-green-900/50">
                                <div className="text-[8px] text-cyan uppercase">TST</div>
                                <div className="text-cyan font-bold vt323" style={{fontSize: '18px'}}>{(p.testDrives || 0).toLocaleString()}</div>
                                <div className="text-[8px] text-cyan">{testDriveRate}%</div>
                              </div>
                              <div className="border-l border-green-900/50">
                                <div className="text-[8px] text-amber uppercase">BK</div>
                                <div className="text-amber font-bold vt323" style={{fontSize: '18px'}}>{(p.bookings || 0).toLocaleString()}</div>
                                <div className="text-[8px] text-amber">{bookingRate}%</div>
                              </div>
                              <div className="border-l border-green-900/50">
                                <div className="text-[8px] text-red uppercase">DLR</div>
                                <div className="text-red font-bold vt323" style={{fontSize: '18px'}}>{(p.deliveries || 0).toLocaleString()}</div>
                                <div className="text-[8px] text-red">{deliveryRate}%</div>
                              </div>
                            </div>

                            <div className="mb-3">
                              <div className="flex justify-between text-[9px] text-green-400/70 mb-1 uppercase tracking-wider">
                                <span>&gt; BUDGET_UTILIZATION</span>
                                <span className={spentPercent > 90 ? 'text-red' : spentPercent > 70 ? 'text-amber' : 'text-green'}>
                                  {spentPercent}%
                                </span>
                              </div>
                              <div className="text-[10px] terminal-progress text-green">
                                [{('█'.repeat(Math.min(Math.round(spentPercent/10), 10)) + '░'.repeat(Math.max(10 - Math.round(spentPercent/10), 0))) + ']'} ฿{(p.spent || 0).toLocaleString()}/{(p.budget || 0).toLocaleString()}
                              </div>
                            </div>

                            <div className="flex gap-2 pt-3 border-t border-green-900/50">
                              <button onClick={() => openModal(p)} className="flex-1 hacker-btn text-[10px] py-1.5">
                                &gt; EDIT
                              </button>
                              <button onClick={() => deleteProject(p.id)} className="flex-1 hacker-btn hacker-btn-danger text-[10px] py-1.5">
                                &gt; PURGE
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {/* TIMELINE */}
            {activeTab === 'calendar' && (
              <div className="fade-in terminal-window">
                <div className="terminal-titlebar">
                  <span className="terminal-dot bg-red-500"></span>
                  <span className="terminal-dot bg-amber-500"></span>
                  <span className="terminal-dot bg-green-500"></span>
                  <span className="ml-2 text-[11px] text-green-400 uppercase tracking-wider">◆ TIMELINE.cron</span>
                </div>
                <div className="terminal-body">
                  <CalendarComponent projects={projects} />
                </div>
              </div>
            )}
          </div>

          {/* MODAL */}
          {showModal && (
            <div className="fixed inset-0 flex items-center justify-center z-50 p-4 modal-backdrop" onClick={() => setShowModal(false)}>
              <div className="terminal-window max-w-2xl w-full max-h-[90vh] overflow-y-auto fade-in" onClick={(e) => e.stopPropagation()}>
                <div className="terminal-titlebar">
                  <span className="terminal-dot bg-red-500"></span>
                  <span className="terminal-dot bg-amber-500"></span>
                  <span className="terminal-dot bg-green-500"></span>
                  <span className="ml-2 text-[11px] text-green-400 uppercase tracking-wider">
                    ◆ {editingProject ? 'MODIFY_MISSION.sh' : 'DEPLOY_MISSION.sh'}
                  </span>
                  <button onClick={() => setShowModal(false)} className="ml-auto text-green-400 hover:text-red text-xs">[ X ]</button>
                </div>
                <div className="terminal-body space-y-4">
                  <div>
                    <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; MISSION_CODENAME *</label>
                    <input type="text" placeholder="operation_name" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="hacker-input" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; CATEGORY</label>
                      <select value={formData.category} onChange={(e) => setFormData({...formData, category: e.target.value})} className="hacker-select">
                        {categories.map(cat => <option key={cat.value} value={cat.value}>[{cat.code}] {cat.label}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; STATUS *</label>
                      <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="hacker-select">
                        {statuses.map(st => <option key={st.value} value={st.value}>[{st.label.toUpperCase()}]</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; START_DATE *</label>
                      <input type="date" value={formData.startDate} onChange={(e) => setFormData({...formData, startDate: e.target.value})} className="hacker-input" />
                    </div>
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; END_DATE *</label>
                      <input type="date" value={formData.endDate} onChange={(e) => setFormData({...formData, endDate: e.target.value})} className="hacker-input" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; BUDGET_THB</label>
                      <input type="number" placeholder="0" value={formData.budget} onChange={(e) => setFormData({...formData, budget: e.target.value})} className="hacker-input" />
                    </div>
                    <div>
                      <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; EXPENDITURE_THB</label>
                      <input type="number" placeholder="0" value={formData.spent} onChange={(e) => setFormData({...formData, spent: e.target.value})} className="hacker-input" />
                    </div>
                  </div>

                  {/* Funnel */}
                  <div className="border border-green-500/50 p-4 bg-green-900/10">
                    <div className="text-[10px] text-green uppercase tracking-widest mb-3">◆ FUNNEL_PARAMETERS</div>

                    {(() => {
                      const inq = parseInt(formData.inquiries) || 0;
                      const td = parseInt(formData.testDrives) || 0;
                      const bk = parseInt(formData.bookings) || 0;
                      const dl = parseInt(formData.deliveries) || 0;
                      const pct = (v) => inq > 0 ? ((v / inq) * 100).toFixed(1) + '%' : '0.0%';
                      return (
                        <div className="border border-green-900/50 p-3 bg-black/40 mb-3">
                          <div className="text-[9px] text-green-400/60 uppercase tracking-wider mb-2">&gt; LIVE_PREVIEW</div>
                          <div className="grid grid-cols-4 gap-1 text-center">
                            <div>
                              <div className="text-[8px] text-green-400/60 uppercase">INQ</div>
                              <div className="text-green vt323" style={{fontSize: '22px'}}>{inq}</div>
                              <div className="text-[9px] text-green-400/60">100%</div>
                            </div>
                            <div className="border-l border-green-900/50">
                              <div className="text-[8px] text-cyan uppercase">TST</div>
                              <div className="text-cyan vt323" style={{fontSize: '22px'}}>{td}</div>
                              <div className="text-[9px] text-cyan">{pct(td)}</div>
                            </div>
                            <div className="border-l border-green-900/50">
                              <div className="text-[8px] text-amber uppercase">BK</div>
                              <div className="text-amber vt323" style={{fontSize: '22px'}}>{bk}</div>
                              <div className="text-[9px] text-amber">{pct(bk)}</div>
                            </div>
                            <div className="border-l border-green-900/50">
                              <div className="text-[8px] text-red uppercase">DLR</div>
                              <div className="text-red vt323" style={{fontSize: '22px'}}>{dl}</div>
                              <div className="text-[9px] text-red">{pct(dl)}</div>
                            </div>
                          </div>
                        </div>
                      );
                    })()}

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; INQUIRIES</label>
                        <input type="number" min="0" placeholder="0" value={formData.inquiries} onChange={(e) => setFormData({...formData, inquiries: e.target.value})} className="hacker-input" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-cyan mb-1 uppercase tracking-wider">&gt; TEST_DRIVES</label>
                        <input type="number" min="0" placeholder="0" value={formData.testDrives} onChange={(e) => setFormData({...formData, testDrives: e.target.value})} className="hacker-input" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-amber mb-1 uppercase tracking-wider">&gt; BOOKINGS</label>
                        <input type="number" min="0" placeholder="0" value={formData.bookings} onChange={(e) => setFormData({...formData, bookings: e.target.value})} className="hacker-input" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-red mb-1 uppercase tracking-wider">&gt; DELIVERIES</label>
                        <input type="number" min="0" placeholder="0" value={formData.deliveries} onChange={(e) => setFormData({...formData, deliveries: e.target.value})} className="hacker-input" />
                      </div>
                      <div>
                        <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; FOLLOW_UP</label>
                        <input type="number" min="0" placeholder="0" value={formData.followUps} onChange={(e) => setFormData({...formData, followUps: e.target.value})} className="hacker-input" />
                      </div>
                    </div>

                    <div className="mt-4 border border-green-500 p-3 bg-green-900/20">
                      <div className="text-[9px] text-green-400/70 uppercase tracking-widest mb-1">◆ OVERALL_CONVERSION</div>
                      <div className="text-3xl font-bold text-green vt323" style={{fontSize: '36px', textShadow: '0 0 10px #00ff41'}}>
                        {(Number(formData.inquiries) || 0) > 0 ? (((Number(formData.deliveries) || 0) / (Number(formData.inquiries) || 0)) * 100).toFixed(2) : '0.00'}%
                      </div>
                      <div className="text-[10px] text-green-400/60">[ deliveries / inquiries ] × 100</div>
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] text-green-400/80 mb-1 uppercase tracking-wider">&gt; NOTES / INTEL</label>
                    <textarea rows="3" placeholder="mission details..." value={formData.description} onChange={(e) => setFormData({...formData, description: e.target.value})} className="hacker-input resize-none"></textarea>
                  </div>

                  <div className="flex gap-3 pt-3 border-t border-green-900/50">
                    <button onClick={saveProject} className="flex-1 hacker-btn hacker-btn-primary">
                      &gt; EXECUTE
                    </button>
                    <button onClick={() => setShowModal(false)} className="hacker-btn hacker-btn-danger">
                      &gt; ABORT
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
